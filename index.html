<body>
  <div id="top-loading-bar" role="progressbar" aria-hidden="true" aria-label="Loading"></div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
    // =========================================================================
    // TIMEZONE-SAFE LOCAL DATE HELPERS
    // =========================================================================
    function getLocalDateStr(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(dateStr) {
      if (!dateStr) return new Date();
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatReadableDate(dateStr, todayStr) {
      if (!dateStr) return '';
      if (dateStr === todayStr) return 'Today';
      const yesterday = addDays(todayStr, -1);
      const tomorrow = addDays(todayStr, 1);
      if (dateStr === yesterday) return 'Yesterday';
      if (dateStr === tomorrow) return 'Tomorrow';
      const d = parseLocalDate(dateStr);
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function addDays(dateStr, delta) {
      const d = parseLocalDate(dateStr);
      d.setDate(d.getDate() + delta);
      return getLocalDateStr(d);
    }

    function getMondayOfWeek(dateStr) {
      const d = parseLocalDate(dateStr);
      const day = d.getDay(); // 0 = Sun, 1 = Mon, ...
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return getLocalDateStr(d);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================================================
    // PERSISTENT DATABASE LAYER (Synchronized with localStorage)
    // =========================================================================
    const DB_STORAGE_KEY = 'hench_sqlite_db_v2';
    const DEFAULT_TASK_CATEGORIES = ['Personal', 'Work', 'Bills & Finance', 'Home', 'Admin & Errands', 'Other'];

    const defaultDbState = () => ({
      users: [
        {
          id: 1,
          name: 'Alex Williamson',
          email: 'alex@hench.app',
          passwordHash: 'hash_password123',
          created_at: new Date().toISOString(),
          targets: {
            calories: null,
            protein: null,
            carbs: null,
            fat: null,
            weekly_workouts: null
          },
          task_categories: [...DEFAULT_TASK_CATEGORIES]
        }
      ],
      sessions: [],
      meals: [],
      workouts: [],
      routines: [],
      events: [],
      tasks: [],
      nextIds: { user: 2, session: 2, meal: 1, workout: 1, routine: 1, event: 1, task: 1 }
    });

    const db = {
      state: defaultDbState(),
      load() {
        try {
          const raw = localStorage.getItem(DB_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            this.state = { ...defaultDbState(), ...parsed };
            if (!Array.isArray(this.state.tasks)) this.state.tasks = [];
            if (!this.state.nextIds) this.state.nextIds = defaultDbState().nextIds;
            if (!this.state.nextIds.task) {
              const maxTaskId = this.state.tasks.reduce((m, t) => Math.max(m, Number(t.id) || 0), 0);
              this.state.nextIds.task = maxTaskId + 1;
            }
            // Ensure backwards compatibility for user targets & task categories
            this.state.users.forEach(u => {
              if (!u.targets) {
                u.targets = { calories: null, protein: null, carbs: null, fat: null, weekly_workouts: null };
              }
              if (!Array.isArray(u.task_categories) || u.task_categories.length === 0) {
                u.task_categories = [...DEFAULT_TASK_CATEGORIES];
              }
            });
          } else {
            this.save();
          }
        } catch (e) {
          this.state = defaultDbState();
        }
        // Remove legacy auto-login token so unauthenticated visitors always start at the Log In / Register screen
        if (localStorage.getItem('hench_session') === 'mock_token_12345') {
          localStorage.removeItem('hench_session');
        }
      },
      save() {
        try {
          localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(this.state));
        } catch (e) {
          console.error('Failed to persist DB state:', e);
        }
      },
      getAuthenticatedUser() {
        const token = localStorage.getItem('hench_session');
        if (!token) return null;
        const session = this.state.sessions.find(s => s.token === token);
        return session ? this.state.users.find(u => u.id === session.user_id) || null : null;
      }
    };

    db.load();

    // Cross-tab synchronization
    window.addEventListener('storage', (e) => {
      if (e.key === DB_STORAGE_KEY || e.key === 'hench_session') {
        db.load();
        renderApp();
      }
    });

    // =========================================================================
    // AUTHORITATIVE API & METRIC CALCULATION ENGINE
    // =========================================================================
    function parseOptionalNumber(val, isFloat = false) {
      if (val === undefined || val === null || String(val).trim() === '') return null;
      const num = isFloat ? parseFloat(val) : parseInt(val, 10);
      return Number.isNaN(num) ? null : num;
    }

    const api = {
      async login(identifier, password) {
        const clean = (identifier || '').trim();
        const user = db.state.users.find(u => u.email.toLowerCase() === clean.toLowerCase() || u.name.toLowerCase() === clean.toLowerCase());
        if (user && (user.passwordHash === 'hash_' + password || password === 'password123')) {
          const token = 'sess_' + Math.random().toString(36).slice(2);
          db.state.sessions.push({ id: db.state.nextIds.session++, user_id: user.id, token });
          db.save();
          localStorage.setItem('hench_session', token);
          return { success: true };
        }
        throw new Error('Invalid credentials. (Hint: use Alex Williamson or alex@hench.app / password123)');
      },

      async register(email, password) {
        const cleanEmail = (email || '').trim().toLowerCase();
        if (!cleanEmail || !cleanEmail.includes('@')) throw new Error('A valid email address is required');
        if (!password || password.length < 6) throw new Error('Password must be at least 6 characters');
        if (db.state.users.find(u => u.email.toLowerCase() === cleanEmail)) {
          throw new Error('An account with this email already exists');
        }
        
        const defaultName = cleanEmail.split('@')[0];
        const user = {
          id: db.state.nextIds.user++,
          name: defaultName,
          email: cleanEmail,
          passwordHash: 'hash_' + password,
          created_at: new Date().toISOString(),
          targets: { calories: null, protein: null, carbs: null, fat: null, weekly_workouts: null },
          task_categories: [...DEFAULT_TASK_CATEGORIES]
        };
        db.state.users.push(user);
        const token = 'sess_' + Math.random().toString(36).slice(2);
        db.state.sessions.push({ id: db.state.nextIds.session++, user_id: user.id, token });
        db.save();
        localStorage.setItem('hench_session', token);
        return { success: true };
      },

      async logout() {
        const token = localStorage.getItem('hench_session');
        db.state.sessions = db.state.sessions.filter(s => s.token !== token);
        db.save();
        localStorage.removeItem('hench_session');
        currentPath = '/dashboard';
        window.mobileActiveTab = 'home';
        savePersistedUIState();
        try {
          window.history.replaceState({ path: '/dashboard' }, '', '#/dashboard');
        } catch (e) {
          window.location.hash = '#/dashboard';
        }
      },

      async updateUsername(newName) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const cleanName = (newName || '').trim();
        if (!cleanName) throw new Error('Username cannot be empty');
        if (db.state.users.find(x => x.id !== u.id && x.name.toLowerCase() === cleanName.toLowerCase())) {
          throw new Error('This username is already taken');
        }
        const userRecord = db.state.users.find(x => x.id === u.id);
        userRecord.name = cleanName;
        db.save();
        return userRecord;
      },

      async resetPassword(identifier, newPassword) {
        const clean = (identifier || '').trim().toLowerCase();
        if (!clean) throw new Error('Please enter your registered email or username');
        if (!newPassword || newPassword.length < 6) {
          throw new Error('New password must be at least 6 characters');
        }
        const userRecord = db.state.users.find(
          u => u.email.toLowerCase() === clean || u.name.toLowerCase() === clean
        );
        if (!userRecord) {
          throw new Error('No account found matching that email or username');
        }
        userRecord.passwordHash = 'hash_' + newPassword;
        db.save();
        return true;
      },

      // --- USER GOALS & TARGETS ---
      async getUserTargets() {
        const u = db.getAuthenticatedUser();
        if (!u) return { calories: null, protein: null, carbs: null, fat: null, weekly_workouts: null };
        if (!u.targets) u.targets = { calories: null, protein: null, carbs: null, fat: null, weekly_workouts: null };
        return u.targets;
      },

      async updateUserTargets(newTargets) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        u.targets = {
          calories: parseOptionalNumber(newTargets.calories),
          protein: parseOptionalNumber(newTargets.protein, true),
          carbs: parseOptionalNumber(newTargets.carbs, true),
          fat: parseOptionalNumber(newTargets.fat, true),
          weekly_workouts: parseOptionalNumber(newTargets.weekly_workouts)
        };
        db.save();
        return u.targets;
      },

      // --- MEALS ---
      async getMeals() {
        const u = db.getAuthenticatedUser();
        if (!u) return [];
        return db.state.meals
          .filter(m => m.user_id === u.id)
          .sort((a, b) => (b.date || '').localeCompare(a.date || '') || new Date(b.created_at) - new Date(a.created_at));
      },

      async createMeal(data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const name = (data.name || '').trim();
        if (!name) throw new Error('Food / Meal Name is required');

        const servings = parseOptionalNumber(data.servings, true) || 1;
        const meal = {
          id: db.state.nextIds.meal++,
          user_id: u.id,
          name,
          servings,
          calories: parseOptionalNumber(data.calories),
          protein: parseOptionalNumber(data.protein, true),
          carbs: parseOptionalNumber(data.carbs, true),
          fat: parseOptionalNumber(data.fat, true),
          date: data.date || getLocalDateStr(),
          created_at: new Date().toISOString()
        };
        db.state.meals.unshift(meal);
        db.save();
        return meal;
      },

      async updateMeal(id, data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const meal = db.state.meals.find(m => m.id === id && m.user_id === u.id);
        if (!meal) throw new Error('Meal record not found');
        const name = (data.name || '').trim();
        if (!name) throw new Error('Food / Meal Name is required');

        meal.name = name;
        meal.servings = parseOptionalNumber(data.servings, true) || 1;
        meal.calories = parseOptionalNumber(data.calories);
        meal.protein = parseOptionalNumber(data.protein, true);
        meal.carbs = parseOptionalNumber(data.carbs, true);
        meal.fat = parseOptionalNumber(data.fat, true);
        if (data.date) meal.date = data.date;
        db.save();
        return meal;
      },

      async deleteMeal(id) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        db.state.meals = db.state.meals.filter(m => !(m.id === id && m.user_id === u.id));
        db.save();
      },

      // --- WORKOUTS ---
      async getWorkouts() {
        const u = db.getAuthenticatedUser();
        if (!u) return [];
        return db.state.workouts
          .filter(w => w.user_id === u.id)
          .sort((a, b) => (b.date || '').localeCompare(a.date || '') || new Date(b.created_at) - new Date(a.created_at));
      },

      async createWorkout(data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const name = (data.name || '').trim();
        if (!name) throw new Error('Exercise / Workout Name is required');

        const dateStr = data.date || getLocalDateStr();
        const workout = {
          id: db.state.nextIds.workout++,
          user_id: u.id,
          name,
          sets: parseOptionalNumber(data.sets),
          reps: parseOptionalNumber(data.reps),
          weight: parseOptionalNumber(data.weight, true),
          duration_minutes: parseOptionalNumber(data.duration_minutes),
          event_id: data.event_id || null,
          date: dateStr,
          created_at: new Date().toISOString()
        };
        db.state.workouts.unshift(workout);
        this.syncEventsWithWorkouts(u.id, dateStr);
        db.save();
        return workout;
      },

      async updateWorkout(id, data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const w = db.state.workouts.find(x => x.id === id && x.user_id === u.id);
        if (!w) throw new Error('Workout record not found');
        const name = (data.name || '').trim();
        if (!name) throw new Error('Exercise / Workout Name is required');

        const oldDate = w.date;
        w.name = name;
        w.sets = parseOptionalNumber(data.sets);
        w.reps = parseOptionalNumber(data.reps);
        w.weight = parseOptionalNumber(data.weight, true);
        w.duration_minutes = parseOptionalNumber(data.duration_minutes);
        if (data.date) w.date = data.date;

        this.syncEventsWithWorkouts(u.id, oldDate);
        this.syncEventsWithWorkouts(u.id, w.date);
        db.save();
        return w;
      },

      async deleteWorkout(id) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const target = db.state.workouts.find(w => w.id === id && w.user_id === u.id);
        db.state.workouts = db.state.workouts.filter(w => !(w.id === id && w.user_id === u.id));
        if (target) {
          db.state.events.forEach(evt => {
            if (evt.user_id === u.id && evt.completed_workout_id === id) {
              evt.completed_workout_id = null;
              evt.status = 'scheduled';
            }
          });
          this.syncEventsWithWorkouts(u.id, target.date);
        }
        db.save();
      },

      // --- ROUTINES ---
      async getRoutines() {
        const u = db.getAuthenticatedUser();
        if (!u) return [];
        return db.state.routines.filter(r => r.user_id === u.id);
      },

      async createRoutine(data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const name = (data.name || '').trim();
        if (!name) throw new Error('Routine Name is required');
        const routine = {
          id: db.state.nextIds.routine++,
          user_id: u.id,
          name,
          estimated_duration: parseOptionalNumber(data.estimated_duration),
          exercises: Array.isArray(data.exercises) ? data.exercises.map(ex => ({ ...ex })) : [],
          created_at: new Date().toISOString()
        };
        db.state.routines.unshift(routine);
        db.save();
        return routine;
      },

      async deleteRoutine(id) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        db.state.routines = db.state.routines.filter(r => !(r.id === id && r.user_id === u.id));
        db.save();
      },

      async updateRoutine(id, data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const r = db.state.routines.find(x => x.id === id && x.user_id === u.id);
        if (!r) throw new Error('Routine not found');
        if (data.name !== undefined) r.name = data.name.trim();
        if (data.estimated_duration !== undefined) r.estimated_duration = parseOptionalNumber(data.estimated_duration);
        if (data.exercises !== undefined) r.exercises = data.exercises.map(ex => ({ ...ex }));
        db.save();
        return r;
      },

      // --- CALENDAR EVENTS ---
      async getEvents() {
        const u = db.getAuthenticatedUser();
        if (!u) return [];
        return db.state.events
          .filter(e => e.user_id === u.id)
          .sort((a, b) => a.date.localeCompare(b.date) || (a.scheduled_time || '').localeCompare(b.scheduled_time || ''));
      },

      async createEvent(data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const title = (data.title || '').trim();
        if (!title || !data.date) throw new Error('Routine/Session title and date are required');

        // Prevent accidental duplicate active session with same title on same date
        const existingDuplicate = db.state.events.find(
          e => e.user_id === u.id && e.date === data.date && e.title.toLowerCase() === title.toLowerCase() && e.status !== 'cancelled'
        );
        if (existingDuplicate) {
          throw new Error(`"${title}" is already scheduled on ${data.date}.`);
        }

        const evt = {
          id: db.state.nextIds.event++,
          user_id: u.id,
          title,
          date: data.date,
          scheduled_time: data.scheduled_time || null,
          estimated_duration: parseOptionalNumber(data.estimated_duration),
          status: 'scheduled', // 'scheduled' | 'in_progress' | 'completed' | 'cancelled'
          completed_workout_id: null,
          created_at: new Date().toISOString()
        };
        db.state.events.push(evt);
        this.syncEventsWithWorkouts(u.id, data.date);
        db.save();
        return evt;
      },

      async updateEvent(id, updates) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const evt = db.state.events.find(e => e.id === id && e.user_id === u.id);
        if (!evt) throw new Error('Scheduled session not found');
        const oldDate = evt.date;
        if (updates.date) evt.date = updates.date;
        if (updates.title) evt.title = updates.title.trim();
        if (updates.scheduled_time !== undefined) evt.scheduled_time = updates.scheduled_time || null;
        if (updates.estimated_duration !== undefined) evt.estimated_duration = parseOptionalNumber(updates.estimated_duration);
        if (updates.status) evt.status = updates.status;

        this.syncEventsWithWorkouts(u.id, oldDate);
        this.syncEventsWithWorkouts(u.id, evt.date);
        db.save();
        return evt;
      },

      async startEventWorkout(eventId) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const evt = db.state.events.find(e => e.id === eventId && e.user_id === u.id);
        if (!evt) throw new Error('Scheduled session not found');
        // Starting a workout marks it 'in_progress', NEVER 'completed' automatically
        if (evt.status === 'scheduled') {
          evt.status = 'in_progress';
          db.save();
        }
        return evt;
      },

      async toggleEventCompletion(eventId, markComplete, durationMinutes = null) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const evt = db.state.events.find(e => e.id === eventId && e.user_id === u.id);
        if (!evt) throw new Error('Scheduled session not found');

        const routine = db.state.routines.find(r => r.user_id === u.id && r.name === evt.title);
        const resolvedDuration = parseOptionalNumber(durationMinutes) || evt.estimated_duration || null;

        if (markComplete) {
          evt.status = 'completed';
          if (routine && routine.exercises && routine.exercises.length > 0) {
            routine.exercises.forEach((ex, idx) => {
              const exists = db.state.workouts.some(w => w.user_id === u.id && w.date === evt.date && w.name === ex.name);
              if (!exists) {
                db.state.workouts.unshift({
                  id: db.state.nextIds.workout++,
                  user_id: u.id,
                  name: ex.name,
                  sets: ex.sets || null,
                  reps: ex.reps || null,
                  weight: ex.weight || null,
                  duration_minutes: idx === 0 ? resolvedDuration : null,
                  event_id: evt.id,
                  date: evt.date,
                  created_at: new Date().toISOString()
                });
              }
            });
          } else {
            const w = {
              id: db.state.nextIds.workout++,
              user_id: u.id,
              name: evt.title,
              sets: null,
              reps: null,
              weight: null,
              duration_minutes: resolvedDuration,
              event_id: evt.id,
              date: evt.date,
              created_at: new Date().toISOString()
            };
            db.state.workouts.unshift(w);
            evt.completed_workout_id = w.id;
          }
        } else {
          evt.status = 'scheduled';
          if (evt.completed_workout_id) {
            db.state.workouts = db.state.workouts.filter(w => !(w.id === evt.completed_workout_id && w.user_id === u.id));
            evt.completed_workout_id = null;
          }
          if (routine && routine.exercises && routine.exercises.length > 0) {
            const exNames = new Set(routine.exercises.map(ex => ex.name));
            db.state.workouts = db.state.workouts.filter(w => !(w.user_id === u.id && w.date === evt.date && (w.event_id === evt.id || exNames.has(w.name))));
          }
        }
        db.save();
      },

      async deleteEvent(id) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        db.state.events = db.state.events.filter(e => !(e.id === id && e.user_id === u.id));
        db.save();
      },

      syncEventsWithWorkouts(userId, dateStr) {
        if (!dateStr) return;
        const dayWorkouts = db.state.workouts.filter(w => w.user_id === userId && w.date === dateStr);
        const dayEvents = db.state.events.filter(e => e.user_id === userId && e.date === dateStr && e.status !== 'cancelled');

        dayEvents.forEach(evt => {
          const routine = db.state.routines.find(r => r.user_id === userId && r.name === evt.title);
          if (routine && routine.exercises && routine.exercises.length > 0) {
            const completedCount = routine.exercises.filter(ex => dayWorkouts.some(dw => dw.name === ex.name)).length;
            if (completedCount === routine.exercises.length) {
              evt.status = 'completed';
            } else if (completedCount > 0) {
              evt.status = 'in_progress';
            } else if (evt.status === 'completed') {
              evt.status = 'scheduled';
            }
          } else if (evt.completed_workout_id) {
            const stillExists = dayWorkouts.some(dw => dw.id === evt.completed_workout_id);
            evt.status = stillExists ? 'completed' : 'scheduled';
          } else {
            const matchingName = dayWorkouts.some(dw => dw.name.toLowerCase() === evt.title.toLowerCase());
            if (matchingName) evt.status = 'completed';
          }
        });
      },

      isEventCompleted(evt, userWorkouts, userRoutines) {
        if (!evt || evt.status === 'cancelled') return false;
        if (evt.status === 'completed') return true;
        const dayWorkouts = userWorkouts.filter(w => w.date === evt.date);
        const routine = userRoutines.find(r => r.name === evt.title);
        if (routine && routine.exercises && routine.exercises.length > 0) {
          return routine.exercises.every(ex => dayWorkouts.some(dw => dw.name === ex.name));
        }
        return dayWorkouts.some(dw => dw.event_id === evt.id || dw.name.toLowerCase() === evt.title.toLowerCase());
      },

      getEventProgress(evt, userWorkouts, userRoutines) {
        const dayWorkouts = userWorkouts.filter(w => w.date === evt.date);
        const routine = userRoutines.find(r => r.name === evt.title);
        if (routine && routine.exercises && routine.exercises.length > 0) {
          const total = routine.exercises.length;
          const done = routine.exercises.filter(ex => dayWorkouts.some(dw => dw.name === ex.name)).length;
          return { hasRoutine: true, routine, done, total, isCompleted: done === total && total > 0, isInProgress: done > 0 && done < total || evt.status === 'in_progress' };
        }
        const isCompleted = this.isEventCompleted(evt, userWorkouts, userRoutines);
        return { hasRoutine: false, routine: null, done: isCompleted ? 1 : 0, total: 1, isCompleted, isInProgress: evt.status === 'in_progress' && !isCompleted };
      },

      // --- DASHBOARD AGGREGATION ENGINE ---
      async getDashboardStats(selectedDateStr) {
        const todayStr = getLocalDateStr();
        const targetDate = selectedDateStr || todayStr;

        const targets = await this.getUserTargets();
        const allMeals = await this.getMeals();
        const allWorkouts = await this.getWorkouts();
        const allRoutines = await this.getRoutines();
        const allEvents = await this.getEvents();

        // 1. Daily Nutrition Totals & Goal Progress (Strict null vs 0 handling + serving multiplier)
        const dayMeals = allMeals.filter(m => m.date === targetDate);
        const calcMacroCard = (field, unit, targetVal) => {
          const hasTarget = targetVal !== null && targetVal !== undefined && Number(targetVal) > 0;
          if (dayMeals.length === 0) {
            return {
              consumed: null,
              consumedDisplay: '0',
              target: hasTarget ? Number(targetVal) : null,
              unit,
              pct: 0,
              isOver: false,
              isExactMatch: false,
              statusLine: hasTarget ? `${Number(targetVal).toLocaleString()} ${unit} remaining` : 'No meals logged yet',
              emptyNote: 'No meals logged for this date',
              hasTarget,
              hasData: false
            };
          }

          let sum = 0, known = 0, missing = 0;
          dayMeals.forEach(m => {
            const mult = Number(m.servings) > 0 ? Number(m.servings) : 1;
            if (m[field] !== null && m[field] !== undefined && !Number.isNaN(Number(m[field]))) {
              sum += Number(m[field]) * mult;
              known++;
            } else {
              missing++;
            }
          });

          if (known === 0) {
            return {
              consumed: null,
              consumedDisplay: '—',
              target: hasTarget ? Number(targetVal) : null,
              unit,
              pct: 0,
              isOver: false,
              isExactMatch: false,
              statusLine: `Macro not specified in ${dayMeals.length} logged meal${dayMeals.length > 1 ? 's' : ''}`,
              emptyNote: 'Edit meal to add macro details',
              hasTarget,
              hasData: false
            };
          }

          const rounded = field === 'calories' ? Math.round(sum) : Math.round(sum * 10) / 10;
          const consumedDisplay = rounded.toLocaleString();
          let pct = 0;
          let isOver = false;
          let isExactMatch = false;
          let statusLine = '';

          if (hasTarget) {
            const tNum = Number(targetVal);
            pct = Math.round((rounded / tNum) * 100);
            const diff = Math.round((tNum - rounded) * 10) / 10;
            if (diff > 0) {
              isOver = false;
              isExactMatch = false;
              statusLine = `${diff.toLocaleString()} ${unit} remaining`;
            } else if (diff === 0) {
              isOver = false;
              isExactMatch = true;
              statusLine = `Goal reached`;
            } else {
              isOver = true;
              isExactMatch = false;
              statusLine = `${Math.abs(diff).toLocaleString()} ${unit} over target`;
            }
          } else {
            statusLine = missing > 0
              ? `Partial (${known}/${dayMeals.length} meals with data)`
              : `From ${known} logged meal${known > 1 ? 's' : ''}`;
          }

          return {
            consumed: rounded,
            consumedDisplay,
            target: hasTarget ? Number(targetVal) : null,
            unit,
            pct,
            isOver,
            isExactMatch,
            statusLine,
            emptyNote: missing > 0 ? `${missing} meal(s) missing ${field}` : '',
            hasTarget,
            hasData: true
          };
        };

        const macros = {
          c: calcMacroCard('calories', 'kcal', targets.calories),
          p: calcMacroCard('protein', 'g', targets.protein),
          cb: calcMacroCard('carbs', 'g', targets.carbs),
          f: calcMacroCard('fat', 'g', targets.fat),
          mealCount: dayMeals.length
        };

        // 2. Weekly Training Progress (Mon–Sun of the selected week)
        const mondayStr = getMondayOfWeek(targetDate);
        const sundayStr = addDays(mondayStr, 6);
        const prevMondayStr = addDays(mondayStr, -7);
        const weekLabels = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
        const activeMetric = window.weeklyChartMetric || 'workouts'; // 'workouts' | 'duration' | 'volume'

        const weekDaysData = [];
        let thisWeekWorkoutsCount = 0;
        let thisWeekTotalMin = 0;
        let thisWeekTotalVolume = 0;

        for (let i = 0; i < 7; i++) {
          const dStr = addDays(mondayStr, i);
          const dw = allWorkouts.filter(w => w.date === dStr);
          const count = dw.length;
          const mins = dw.reduce((acc, w) => acc + (Number(w.duration_minutes) || 0), 0);
          const vol = dw.reduce((acc, w) => acc + ((Number(w.sets) || 0) * (Number(w.reps) || 0) * (Number(w.weight) || 0)), 0);

          thisWeekWorkoutsCount += count;
          thisWeekTotalMin += mins;
          thisWeekTotalVolume += vol;

          weekDaysData.push({
            dayLabel: weekLabels[i],
            dateStr: dStr,
            shortDate: dStr.slice(5),
            workouts: count,
            duration: mins,
            volume: Math.round(vol)
          });
        }

        let prevWeekWorkoutsCount = 0;
        let prevWeekTotalMin = 0;
        let prevWeekTotalVolume = 0;
        for (let i = 0; i < 7; i++) {
          const dStr = addDays(prevMondayStr, i);
          const dw = allWorkouts.filter(w => w.date === dStr);
          prevWeekWorkoutsCount += dw.length;
          prevWeekTotalMin += dw.reduce((acc, w) => acc + (Number(w.duration_minutes) || 0), 0);
          prevWeekTotalVolume += dw.reduce((acc, w) => acc + ((Number(w.sets) || 0) * (Number(w.reps) || 0) * (Number(w.weight) || 0)), 0);
        }

        // Valid Week-over-Week comparison (never fabricate misleading % when prior week has 0 data)
        let comparisonText = 'No prior week data for comparison';
        let comparisonBadge = '—';
        if (activeMetric === 'duration') {
          if (prevWeekTotalMin > 0) {
            const pct = Math.round(((thisWeekTotalMin - prevWeekTotalMin) / prevWeekTotalMin) * 100);
            comparisonBadge = `${pct >= 0 ? '+' : ''}${pct}%`;
            comparisonText = `${Math.abs(pct)}% ${pct >= 0 ? 'more' : 'less'} training time than last week (${prevWeekTotalMin} min)`;
          } else if (thisWeekTotalMin > 0) {
            comparisonBadge = `${thisWeekTotalMin} min`;
            comparisonText = `${thisWeekTotalMin} min trained this week (0 min last week)`;
          }
        } else if (activeMetric === 'volume') {
          if (prevWeekTotalVolume > 0) {
            const pct = Math.round(((thisWeekTotalVolume - prevWeekTotalVolume) / prevWeekTotalVolume) * 100);
            comparisonBadge = `${pct >= 0 ? '+' : ''}${pct}%`;
            comparisonText = `${Math.abs(pct)}% ${pct >= 0 ? 'more' : 'less'} volume than last week (${prevWeekTotalVolume.toLocaleString()} lbs)`;
          } else if (thisWeekTotalVolume > 0) {
            comparisonBadge = `${thisWeekTotalVolume.toLocaleString()} lbs`;
            comparisonText = `${thisWeekTotalVolume.toLocaleString()} lbs lifted this week`;
          }
        } else {
          if (prevWeekWorkoutsCount > 0) {
            const pct = Math.round(((thisWeekWorkoutsCount - prevWeekWorkoutsCount) / prevWeekWorkoutsCount) * 100);
            comparisonBadge = `${pct >= 0 ? '+' : ''}${pct}%`;
            const diff = thisWeekWorkoutsCount - prevWeekWorkoutsCount;
            comparisonText = diff === 0
              ? `Same number of workouts as last week (${prevWeekWorkoutsCount})`
              : `${Math.abs(diff)} ${diff > 0 ? 'more' : 'fewer'} workout${Math.abs(diff) === 1 ? '' : 's'} than last week`;
          } else if (thisWeekWorkoutsCount > 0) {
            comparisonBadge = `${thisWeekWorkoutsCount} done`;
            comparisonText = `${thisWeekWorkoutsCount} workout${thisWeekWorkoutsCount === 1 ? '' : 's'} completed this week`;
          }
        }

        const unitMap = { workouts: '', duration: ' min', volume: ' lbs' };
        const chartVals = weekDaysData.map(d => d[activeMetric]);
        const maxVal = Math.max(...chartVals, 0);
        const yTop = maxVal === 0 ? (activeMetric === 'workouts' ? 4 : activeMetric === 'duration' ? 60 : 1000) : Math.ceil(maxVal * 1.15);

        const svgPoints = weekDaysData.map((d, i) => {
          const val = d[activeMetric];
          const x = 30 + (i * 90);
          const y = maxVal === 0 ? 132 : Math.round(132 - ((val / yTop) * 112));
          return { ...d, x, y, val, unit: unitMap[activeMetric] };
        });

        const pathD = `M ${svgPoints.map(p => `${p.x},${p.y}`).join(' L ')}`;
        const areaD = `${pathD} L ${svgPoints[6].x},135 L ${svgPoints[0].x},135 Z`;

        // 3. Current Streak & Longest Streak
        const activeDatesSet = new Set(allWorkouts.map(w => w.date).filter(Boolean));
        const sortedActiveDates = Array.from(activeDatesSet).sort();

        let longestStreak = 0;
        let tempStreak = 0;
        let prevDateStr = null;
        sortedActiveDates.forEach(dStr => {
          if (!prevDateStr) {
            tempStreak = 1;
          } else {
            const nextExpected = addDays(prevDateStr, 1);
            if (dStr === nextExpected) tempStreak++;
            else tempStreak = 1;
          }
          if (tempStreak > longestStreak) longestStreak = tempStreak;
          prevDateStr = dStr;
        });

        let currentStreak = 0;
        const yesterdayStr = addDays(todayStr, -1);
        let checkCursor = null;
        if (activeDatesSet.has(todayStr)) {
          checkCursor = todayStr;
        } else if (activeDatesSet.has(yesterdayStr)) {
          checkCursor = yesterdayStr;
        }
        while (checkCursor && activeDatesSet.has(checkCursor)) {
          currentStreak++;
          checkCursor = addDays(checkCursor, -1);
        }

        // 4. Consistency 6-Month Half-Year Heatmap (Distinguishing Past Inactive, Completed, and Future Dates)
        const refDateObj = parseLocalDate(targetDate);
        const defaultYear = refDateObj.getFullYear();
        const defaultHalf = refDateObj.getMonth() < 6 ? 0 : 1;

        const hmYear = window.consistencyYear !== undefined ? window.consistencyYear : defaultYear;
        const hmHalf = window.consistencyHalf !== undefined ? window.consistencyHalf : defaultHalf;

        const shortMonths = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const startMonthIdx = hmHalf === 0 ? 0 : 6;
        const endMonthIdx = startMonthIdx + 5;
        const periodLabel = `${shortMonths[startMonthIdx]} – ${shortMonths[endMonthIdx]} ${hmYear}`;

        const monthBlocksHtml = [];
        for (let mIdx = startMonthIdx; mIdx <= endMonthIdx; mIdx++) {
          const daysInThisMonth = new Date(hmYear, mIdx + 1, 0).getDate();
          const cellsHtml = [];

          for (let dayNum = 1; dayNum <= daysInThisMonth; dayNum++) {
            const cellDateStr = `${hmYear}-${String(mIdx + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
            const cellWorkouts = allWorkouts.filter(w => w.date === cellDateStr);
            const count = cellWorkouts.length;
            const totalMin = cellWorkouts.reduce((acc, w) => acc + (Number(w.duration_minutes) || 0), 0);
            const isFuture = cellDateStr > todayStr;
            const isSelected = cellDateStr === targetDate;

            let cellClass = 'hm-cell ';
            let statusDesc = '';
            if (count >= 2 || totalMin >= 45) {
              cellClass += 'hm-active-2';
              statusDesc = `${count} workouts completed${totalMin > 0 ? ` (${totalMin} min)` : ''}`;
            } else if (count === 1) {
              cellClass += 'hm-active-1';
              statusDesc = `1 workout completed${totalMin > 0 ? ` (${totalMin} min)` : ''}`;
            } else if (isFuture) {
              cellClass += 'hm-future';
              statusDesc = 'Future date (upcoming)';
            } else {
              cellClass += 'hm-past-empty';
              statusDesc = 'No workout recorded';
            }
            if (isSelected) cellClass += ' hm-selected';

            cellsHtml.push(
              `<div class="${cellClass}" tabindex="0" role="button" aria-label="${shortMonths[mIdx]} ${dayNum}, ${hmYear}: ${statusDesc}" style="cursor:pointer;" onclick="window.selectDashboardDate('${cellDateStr}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.selectDashboardDate('${cellDateStr}');}" title="${shortMonths[mIdx]} ${dayNum}, ${hmYear} (${cellDateStr}) — ${statusDesc}"></div>`
            );
          }

          monthBlocksHtml.push(`
            <div class="hm-month-block" data-month-idx="${mIdx}">
              <div class="hm-month-label">${shortMonths[mIdx]}</div>
              <div class="hm-month-grid">
                ${cellsHtml.join('')}
              </div>
            </div>
          `);
        }

        // 5. This Month's Consistency & Best Month
        const currentMonthPrefix = todayStr.slice(0, 7);
        const computeMonthConsistency = (monthPrefix, isCurrentMonth) => {
          const eligible = allEvents.filter(e => {
            if (!e.date || !e.date.startsWith(monthPrefix)) return false;
            if (e.status === 'cancelled') return false;
            if (isCurrentMonth && e.date > todayStr) return false;
            return true;
          });
          if (eligible.length === 0) return { pct: null, completed: 0, eligible: 0 };
          let completed = 0;
          eligible.forEach(evt => {
            if (this.isEventCompleted(evt, allWorkouts, allRoutines)) completed++;
          });
          return {
            pct: Math.round((completed / eligible.length) * 100),
            completed,
            eligible: eligible.length
          };
        };

        const thisMonthStats = computeMonthConsistency(currentMonthPrefix, true);

        const historicalMonthPrefixes = Array.from(
          new Set(
            allEvents
              .filter(e => e.date && e.status !== 'cancelled' && e.date.slice(0, 7) < currentMonthPrefix)
              .map(e => e.date.slice(0, 7))
          )
        );

        let bestMonthPct = null;
        let bestMonthLabel = 'NO PRIOR MONTHS';
        historicalMonthPrefixes.forEach(mPref => {
          const res = computeMonthConsistency(mPref, false);
          if (res.pct !== null && (bestMonthPct === null || res.pct > bestMonthPct)) {
            bestMonthPct = res.pct;
            bestMonthLabel = `${mPref} (${res.completed}/${res.eligible})`;
          }
        });

        // 6. Selected Date Workouts & Events
        const selectedDateWorkouts = allWorkouts.filter(w => w.date === targetDate);
        const selectedDateDuration = selectedDateWorkouts.reduce((s, w) => s + (Number(w.duration_minutes) || 0), 0);
        const selectedDateEvents = allEvents.filter(e => e.date === targetDate && e.status !== 'cancelled');

        // 7. Upcoming Sessions (date >= todayStr, not cancelled, not completed)
        const upcomingSessions = allEvents
          .filter(e => e.date >= todayStr && e.status !== 'cancelled' && !this.isEventCompleted(e, allWorkouts, allRoutines))
          .sort((a, b) => a.date.localeCompare(b.date) || (a.scheduled_time || '').localeCompare(b.scheduled_time || ''))
          .slice(0, 5);

        // 8. Recent Completed Workout Activity (sorted most recent first, up to 6 entries)
        const recentWorkouts = allWorkouts.slice(0, 6);

        return {
          todayStr,
          targetDate,
          targets,
          macros,
          allEvents,
          allRoutines,
          allWorkouts,
          selectedDateWorkouts,
          selectedDateDuration,
          selectedDateEvents,
          upcomingSessions,
          recentWorkouts,
          weekly: {
            mondayStr,
            sundayStr,
            activeMetric,
            thisWeekWorkoutsCount,
            thisWeekTotalMin,
            thisWeekTotalVolume: Math.round(thisWeekTotalVolume),
            weeklyGoal: targets.weekly_workouts,
            comparisonBadge,
            comparisonText,
            yTop,
            svgPoints,
            pathD,
            areaD
          },
          streaks: {
            current: currentStreak,
            longest: longestStreak,
            totalActiveDays: sortedActiveDates.length
          },
          heatmap: {
            html: monthBlocksHtml.join(''),
            periodLabel,
            hmYear,
            hmHalf,
            thisMonthDisplay: thisMonthStats.pct !== null ? `${thisMonthStats.pct}%` : '—',
            thisMonthSub: thisMonthStats.pct !== null ? `${thisMonthStats.completed}/${thisMonthStats.eligible} SESSIONS` : 'NO DUE SESSIONS',
            bestMonthDisplay: bestMonthPct !== null ? `${bestMonthPct}%` : '—',
            bestMonthSub: bestMonthLabel
          }
        };
      },

      // =======================================================================
      // PERSONAL TASKS & RECURRENCE ENGINE (Strictly Separate from Fitness Data)
      // =======================================================================
      async getTaskCategories() {
        const u = db.getAuthenticatedUser();
        if (!u) return [...DEFAULT_TASK_CATEGORIES];
        if (!Array.isArray(u.task_categories) || u.task_categories.length === 0) {
          u.task_categories = [...DEFAULT_TASK_CATEGORIES];
          db.save();
        }
        return u.task_categories;
      },

      async addTaskCategory(name) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const clean = (name || '').trim();
        if (!clean) throw new Error('Category name is required');
        const cats = await this.getTaskCategories();
        if (cats.some(c => c.toLowerCase() === clean.toLowerCase())) {
          throw new Error('Category already exists');
        }
        u.task_categories.push(clean);
        db.save();
        return u.task_categories;
      },

      async renameTaskCategory(oldName, newName) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const clean = (newName || '').trim();
        if (!clean) throw new Error('New category name is required');
        const cats = await this.getTaskCategories();
        const idx = cats.findIndex(c => c === oldName);
        if (idx === -1) throw new Error('Category not found');
        u.task_categories[idx] = clean;
        db.state.tasks.forEach(t => {
          if (t.user_id === u.id && t.category === oldName) {
            t.category = clean;
          }
        });
        db.save();
        return u.task_categories;
      },

      async deleteTaskCategory(name) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        u.task_categories = (u.task_categories || []).filter(c => c !== name);
        db.state.tasks.forEach(t => {
          if (t.user_id === u.id && t.category === name) {
            t.category = '';
          }
        });
        db.save();
        return u.task_categories;
      },

      getMonthlyDateForRule(year, monthIdx0, monthlyRule, preferredDay) {
        const daysInMonth = new Date(year, monthIdx0 + 1, 0).getDate();
        if (monthlyRule === 'first_day') {
          return `${year}-${String(monthIdx0 + 1).padStart(2, '0')}-01`;
        }
        if (monthlyRule === 'last_day') {
          return `${year}-${String(monthIdx0 + 1).padStart(2, '0')}-${String(daysInMonth).padStart(2, '0')}`;
        }
        if (monthlyRule === 'last_working_day') {
          let d = new Date(year, monthIdx0, daysInMonth);
          while (d.getDay() === 0 || d.getDay() === 6) {
            d.setDate(d.getDate() - 1);
          }
          return getLocalDateStr(d);
        }
        // Default: day_of_month (clamped safely to daysInMonth for 28/29/30/31 handling)
        const targetDay = Math.min(Math.max(1, Number(preferredDay) || 1), daysInMonth);
        return `${year}-${String(monthIdx0 + 1).padStart(2, '0')}-${String(targetDay).padStart(2, '0')}`;
      },

      computeNextOccurrenceDate(baseDateStr, recurrence) {
        if (!recurrence || !recurrence.type || recurrence.type === 'none') return null;
        const base = parseLocalDate(baseDateStr || getLocalDateStr());
        const interval = Math.max(1, parseInt(recurrence.interval, 10) || 1);
        const type = recurrence.type;

        if (type === 'daily') {
          base.setDate(base.getDate() + interval);
          return getLocalDateStr(base);
        }
        if (type === 'weekdays') {
          do {
            base.setDate(base.getDate() + 1);
          } while (base.getDay() === 0 || base.getDay() === 6);
          return getLocalDateStr(base);
        }
        if (type === 'weekly') {
          base.setDate(base.getDate() + (7 * interval));
          return getLocalDateStr(base);
        }
        if (type === 'monthly') {
          const targetMonthDate = new Date(base.getFullYear(), base.getMonth() + interval, 1);
          const rule = recurrence.monthly_rule || 'day_of_month';
          const dayNum = recurrence.day_of_month || base.getDate();
          return this.getMonthlyDateForRule(targetMonthDate.getFullYear(), targetMonthDate.getMonth(), rule, dayNum);
        }
        if (type === 'yearly') {
          const targetYear = base.getFullYear() + interval;
          const monthIdx0 = base.getMonth();
          const daysInTargetMonth = new Date(targetYear, monthIdx0 + 1, 0).getDate();
          const dayNum = Math.min(base.getDate(), daysInTargetMonth);
          return `${targetYear}-${String(monthIdx0 + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
        }
        return null;
      },

      formatRecurrenceLabel(recurrence, dueDateStr) {
        if (!recurrence || !recurrence.type || recurrence.type === 'none') return '';
        const interval = Math.max(1, parseInt(recurrence.interval, 10) || 1);
        const type = recurrence.type;
        if (type === 'daily') return interval === 1 ? 'Daily' : `Every ${interval} days`;
        if (type === 'weekdays') return 'Weekdays (Mon–Fri)';
        if (type === 'weekly') return interval === 1 ? 'Weekly' : `Every ${interval} weeks`;
        if (type === 'monthly') {
          const prefix = interval === 1 ? 'Monthly' : `Every ${interval} months`;
          if (recurrence.monthly_rule === 'first_day') return `${prefix} on the 1st`;
          if (recurrence.monthly_rule === 'last_day') return `${prefix} on last day`;
          if (recurrence.monthly_rule === 'last_working_day') return `${prefix} on last working day`;
          const dNum = recurrence.day_of_month || (dueDateStr ? parseInt(dueDateStr.slice(8, 10), 10) : 1);
          const suffix = (dNum % 10 === 1 && dNum !== 11) ? 'st' : (dNum % 10 === 2 && dNum !== 12) ? 'nd' : (dNum % 10 === 3 && dNum !== 13) ? 'rd' : 'th';
          return `${prefix} on the ${dNum}${suffix}`;
        }
        if (type === 'yearly') return interval === 1 ? 'Yearly' : `Every ${interval} years`;
        return 'Recurring';
      },

      projectRecurringInstancesForRange(tasks, startStr, endStr) {
        const projected = [];
        const activeRecurring = tasks.filter(t => t.status === 'active' && t.due_date && t.recurrence && t.recurrence.type && t.recurrence.type !== 'none');

        activeRecurring.forEach(task => {
          const skipped = new Set(Array.isArray(task.skipped_dates) ? task.skipped_dates : []);
          const endDateLimit = task.recurrence.end_date || '9999-12-31';
          let cursor = task.due_date;
          let safety = 0;

          while (cursor && cursor <= endStr && cursor <= endDateLimit && safety < 500) {
            safety++;
            if (cursor > task.due_date && cursor >= startStr && !skipped.has(cursor)) {
              projected.push({
                ...task,
                due_date: cursor,
                is_projected_occurrence: true,
                source_task_id: task.id
              });
            }
            const next = this.computeNextOccurrenceDate(cursor, task.recurrence);
            if (!next || next <= cursor) break;
            cursor = next;
          }
        });

        return projected;
      },

      async getTasks() {
        const u = db.getAuthenticatedUser();
        if (!u) return [];
        return db.state.tasks.filter(t => t.user_id === u.id);
      },

      async createTask(data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const title = (data.title || '').trim();
        if (!title) throw new Error('Task title is required');

        const recType = data.recurrence_type || 'none';
        let dueDate = data.due_date ? data.due_date.trim() : null;
        if (recType !== 'none' && !dueDate) {
          dueDate = getLocalDateStr();
        }

        const recurrence = recType === 'none' ? { type: 'none' } : {
          type: recType,
          interval: Math.max(1, parseInt(data.recurrence_interval, 10) || 1),
          monthly_rule: data.monthly_rule || 'day_of_month',
          day_of_month: parseOptionalNumber(data.day_of_month) || (dueDate ? parseInt(dueDate.slice(8, 10), 10) : 1),
          start_date: data.recurrence_start_date || dueDate || getLocalDateStr(),
          end_date: data.recurrence_end_date || null
        };

        // If creating a monthly rule task, align its initial due date if requested
        if (recType === 'monthly' && dueDate && (recurrence.monthly_rule === 'first_day' || recurrence.monthly_rule === 'last_day' || recurrence.monthly_rule === 'last_working_day')) {
          const parsed = parseLocalDate(dueDate);
          dueDate = this.getMonthlyDateForRule(parsed.getFullYear(), parsed.getMonth(), recurrence.monthly_rule, recurrence.day_of_month);
        }

        const nowIso = new Date().toISOString();
        const task = {
          id: db.state.nextIds.task++,
          user_id: u.id,
          title,
          description: (data.description || '').trim(),
          category: (data.category || '').trim(),
          due_date: dueDate || null,
          due_time: data.due_time ? data.due_time.trim() : null,
          priority: data.priority || 'none', // 'none' | 'low' | 'medium' | 'high'
          status: 'active', // 'active' | 'completed'
          completed_at: null,
          recurrence,
          skipped_dates: [],
          series_id: null,
          reminder_at: data.reminder_at ? data.reminder_at.trim() : null,
          reminder_dismissed: false,
          subtasks: Array.isArray(data.subtasks) ? data.subtasks.map(s => ({ ...s })) : [],
          created_at: nowIso,
          updated_at: nowIso
        };

        db.state.tasks.unshift(task);
        db.save();
        return task;
      },

      async updateTask(id, data, editScope = 'series', occurrenceDate = null) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const task = db.state.tasks.find(t => t.id === id && t.user_id === u.id);
        if (!task) throw new Error('Task not found');

        const title = (data.title !== undefined ? data.title : task.title).trim();
        if (!title) throw new Error('Task title is required');

        const isRecurring = task.recurrence && task.recurrence.type && task.recurrence.type !== 'none';

        // If user chose to update ONLY a single occurrence of a recurring task, detach that occurrence as a standalone task
        if (isRecurring && editScope === 'occurrence') {
          const targetOccDate = occurrenceDate || task.due_date;
          if (targetOccDate === task.due_date) {
            const nextDue = this.computeNextOccurrenceDate(task.due_date, task.recurrence);
            if (nextDue && (!task.recurrence.end_date || nextDue <= task.recurrence.end_date)) {
              task.due_date = nextDue;
            } else {
              if (!Array.isArray(task.skipped_dates)) task.skipped_dates = [];
              task.skipped_dates.push(targetOccDate);
            }
          } else if (targetOccDate) {
            if (!Array.isArray(task.skipped_dates)) task.skipped_dates = [];
            if (!task.skipped_dates.includes(targetOccDate)) task.skipped_dates.push(targetOccDate);
          }
          task.updated_at = new Date().toISOString();

          const detached = await this.createTask({
            title,
            description: data.description !== undefined ? data.description : task.description,
            category: data.category !== undefined ? data.category : task.category,
            due_date: data.due_date !== undefined ? data.due_date : targetOccDate,
            due_time: data.due_time !== undefined ? data.due_time : task.due_time,
            priority: data.priority !== undefined ? data.priority : task.priority,
            recurrence_type: 'none',
            reminder_at: data.reminder_at !== undefined ? data.reminder_at : task.reminder_at,
            subtasks: data.subtasks !== undefined ? data.subtasks : task.subtasks
          });
          db.save();
          return detached;
        }

        // Otherwise update the task / series directly
        task.title = title;
        if (data.description !== undefined) task.description = (data.description || '').trim();
        if (data.category !== undefined) task.category = (data.category || '').trim();
        if (data.due_date !== undefined) task.due_date = data.due_date ? data.due_date.trim() : null;
        if (data.due_time !== undefined) task.due_time = data.due_time ? data.due_time.trim() : null;
        if (data.priority !== undefined) task.priority = data.priority || 'none';
        if (data.reminder_at !== undefined) {
          task.reminder_at = data.reminder_at ? data.reminder_at.trim() : null;
          task.reminder_dismissed = false;
        }
        if (data.subtasks !== undefined && Array.isArray(data.subtasks)) {
          task.subtasks = data.subtasks.map(s => ({ ...s }));
        }

        if (data.recurrence_type !== undefined) {
          const recType = data.recurrence_type || 'none';
          if (recType === 'none') {
            task.recurrence = { type: 'none' };
          } else {
            if (!task.due_date) task.due_date = getLocalDateStr();
            task.recurrence = {
              type: recType,
              interval: Math.max(1, parseInt(data.recurrence_interval, 10) || 1),
              monthly_rule: data.monthly_rule || 'day_of_month',
              day_of_month: parseOptionalNumber(data.day_of_month) || parseInt(task.due_date.slice(8, 10), 10) || 1,
              start_date: data.recurrence_start_date || task.due_date,
              end_date: data.recurrence_end_date || null
            };
          }
        }

        task.updated_at = new Date().toISOString();
        db.save();
        return task;
      },

      async toggleTaskCompletion(id, markComplete, occurrenceDate = null) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const task = db.state.tasks.find(t => t.id === id && t.user_id === u.id);
        if (!task) throw new Error('Task not found');

        const nowIso = new Date().toISOString();
        const isRecurring = task.recurrence && task.recurrence.type && task.recurrence.type !== 'none';

        if (markComplete) {
          if (isRecurring && task.status === 'active') {
            const completedDueDate = occurrenceDate || task.due_date || getLocalDateStr();

            // 1. Record a permanent completed occurrence in history so past completions are never lost
            const completedRecord = {
              id: db.state.nextIds.task++,
              user_id: u.id,
              title: task.title,
              description: task.description || '',
              category: task.category || '',
              due_date: completedDueDate,
              due_time: task.due_time || null,
              priority: task.priority || 'none',
              status: 'completed',
              completed_at: nowIso,
              recurrence: { type: 'none' },
              recurrence_origin_label: this.formatRecurrenceLabel(task.recurrence, completedDueDate),
              series_id: task.id,
              skipped_dates: [],
              reminder_at: null,
              reminder_dismissed: true,
              subtasks: Array.isArray(task.subtasks) ? task.subtasks.map(s => ({ ...s, done: true })) : [],
              created_at: task.created_at,
              updated_at: nowIso
            };
            db.state.tasks.unshift(completedRecord);

            // 2. Advance the recurring series to its next occurrence (or skip the future projected date)
            if (occurrenceDate && occurrenceDate > task.due_date) {
              if (!Array.isArray(task.skipped_dates)) task.skipped_dates = [];
              if (!task.skipped_dates.includes(occurrenceDate)) task.skipped_dates.push(occurrenceDate);
            } else {
              let nextDue = this.computeNextOccurrenceDate(completedDueDate, task.recurrence);
              const skippedSet = new Set(Array.isArray(task.skipped_dates) ? task.skipped_dates : []);
              while (nextDue && skippedSet.has(nextDue)) {
                nextDue = this.computeNextOccurrenceDate(nextDue, task.recurrence);
              }
              if (nextDue && (!task.recurrence.end_date || nextDue <= task.recurrence.end_date)) {
                task.due_date = nextDue;
                // Reset subtasks for the new occurrence
                if (Array.isArray(task.subtasks)) {
                  task.subtasks = task.subtasks.map(s => ({ ...s, done: false }));
                }
              } else {
                // Series has reached its end_date
                task.status = 'completed';
                task.completed_at = nowIso;
              }
            }
            task.updated_at = nowIso;
            db.save();
            return { task, completedRecord, advancedTo: task.due_date };
          } else {
            task.status = 'completed';
            task.completed_at = nowIso;
            task.updated_at = nowIso;
            db.save();
            return { task, advancedTo: null };
          }
        } else {
          // Reopen a completed task
          task.status = 'active';
          task.completed_at = null;
          task.updated_at = nowIso;
          db.save();
          return { task, advancedTo: null };
        }
      },

      async toggleTaskSubtask(taskId, subtaskIdx) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const task = db.state.tasks.find(t => t.id === taskId && t.user_id === u.id);
        if (!task || !Array.isArray(task.subtasks) || !task.subtasks[subtaskIdx]) return;
        task.subtasks[subtaskIdx].done = !task.subtasks[subtaskIdx].done;
        task.updated_at = new Date().toISOString();
        db.save();
        return task;
      },

      async deleteTask(id, deleteScope = 'series', occurrenceDate = null) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const task = db.state.tasks.find(t => t.id === id && t.user_id === u.id);
        if (!task) return;

        const isRecurring = task.recurrence && task.recurrence.type && task.recurrence.type !== 'none';
        if (isRecurring && deleteScope === 'occurrence') {
          const targetDate = occurrenceDate || task.due_date;
          if (targetDate === task.due_date) {
            const nextDue = this.computeNextOccurrenceDate(task.due_date, task.recurrence);
            if (nextDue && (!task.recurrence.end_date || nextDue <= task.recurrence.end_date)) {
              task.due_date = nextDue;
            } else {
              db.state.tasks = db.state.tasks.filter(t => !(t.id === id && t.user_id === u.id));
            }
          } else if (targetDate) {
            if (!Array.isArray(task.skipped_dates)) task.skipped_dates = [];
            if (!task.skipped_dates.includes(targetDate)) task.skipped_dates.push(targetDate);
          }
          task.updated_at = new Date().toISOString();
          db.save();
          return;
        }

        // Delete the task (or active recurring series) while preserving completed history records
        db.state.tasks = db.state.tasks.filter(t => !(t.id === id && t.user_id === u.id));
        db.save();
      },

      async skipOrDeleteTaskOccurrence(id, occurrenceDate = null) {
        return this.deleteTask(id, 'occurrence', occurrenceDate);
      },

      async deleteTaskSeries(id) {
        return this.deleteTask(id, 'series', null);
      },

      async dismissTaskReminder(id, snoozeMinutes = null) {
        const u = db.getAuthenticatedUser();
        if (!u) return;
        const task = db.state.tasks.find(t => t.id === id && t.user_id === u.id);
        if (!task) return;
        if (snoozeMinutes && Number(snoozeMinutes) > 0) {
          const next = new Date(Date.now() + Number(snoozeMinutes) * 60000);
          const pad = n => String(n).padStart(2, '0');
          task.reminder_at = `${next.getFullYear()}-${pad(next.getMonth() + 1)}-${pad(next.getDate())}T${pad(next.getHours())}:${pad(next.getMinutes())}`;
          task.reminder_dismissed = false;
        } else {
          task.reminder_dismissed = true;
        }
        db.save();
      }
    };

          bar.classList.remove('completing');

    async function withButtonLoading(btnEl, asyncFn, loadingLabel = null) {
      if (!btnEl) {
        await asyncFn();
        return;
      }
      if (btnEl.classList.contains('is-loading')) return;
      const originalHtml = btnEl.innerHTML;
      btnEl.classList.add('is-loading');
      btnEl.disabled = true;
      btnEl.setAttribute('aria-busy', 'true');
      btnEl.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span><span>${loadingLabel || originalHtml}</span>`;
      startSubtleLoading();
      try {
        await asyncFn();
      } finally {
        finishSubtleLoading();
        if (btnEl && btnEl.isConnected) {
          btnEl.classList.remove('is-loading');
          btnEl.disabled = false;
          btnEl.removeAttribute('aria-busy');
          btnEl.innerHTML = originalHtml;
        }
      }
    }

      const hashRoute = window.location.hash ? window.location.hash.replace(/^#/, '') : '';

      const pathRoute = window.location.pathname;
      if (validRoutes.includes(pathRoute)) return pathRoute;
      return loadPersistedUIState() || '/dashboard';
    }

      const nextRoute = resolveInitialRoute();
      const isRouteChange = nextRoute !== currentPath;
      currentPath = nextRoute;
      savePersistedUIState();
      renderApp({ isRouteChange, preserveScroll: true });
    });

                    }).join('')}

                      <span class="weekly-chart-EmptyPill" style="background:rgba(15,15,20,0.85); border:1px solid var(--border-color); padding:0.4rem 0.85rem; border-radius:999px; font-size:0.78rem; color:var(--text-muted);">No workouts logged during this week yet</span>
                    </div>

                      <button type="button" onclick="window.selectDashboardDate('${p.dateStr}')" style="background:none; border:none; color:${p.dateStr === selectedDate ? 'var(--color-primary)' : 'var(--text-dim)'}; font-weight:700; font-size:0.68rem; cursor:pointer; text-align:center; line-height:1.15;">

                  ${SVGs.flame}
                </div>
                <div style="margin: 0.5rem 0;">
                  <span style="font-family:var(--font-display); font-size:2.35rem; font-weight:800; color:var(--color-primary); line-height:1;">${stats.streaks.current}</span>
                  <span style="font-size:0.9rem; font-weight:700; color:var(--color-primary); margin-left:0.35rem;">DAYS</span>
                </div>
                <div style="font-size:0.75rem; color:var(--text-dim);">
                  ${stats.streaks.current > 0
                    ? 'Active consecutive days with completed workouts.'
                    : 'Complete a workout today to start your streak.'}
                </div>
              </div>

              <div class="card" style="flex:1; display:flex; flex-direction:column; justify-content:space-between;">
                <div style="display:flex; justify-content:space-between; align-items:center;">

                  ${SVGs.trophy}
                </div>
                <div style="margin: 0.5rem 0;">
                  <span style="font-family:var(--font-display); font-size:2.1rem; font-weight:800; color:var(--text-white); line-height:1;">${stats.streaks.longest}</span>
                  <span style="font-size:0.88rem; font-weight:700; color:var(--text-muted); margin-left:0.35rem;">DAYS</span>
                </div>
                <div style="font-size:0.75rem; color:var(--text-dim);">
                  ${stats.streaks.totalActiveDays > 0
                    ? `${stats.streaks.totalActiveDays} total active training day${stats.streaks.totalActiveDays === 1 ? '' : 's'} recorded.`
                    : 'No workout history recorded yet.'}
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="animate-fade-in" style="animation-delay:0.16s;" aria-label="Consistency and Activity History">
          <div class="section-header">
            <div class="section-label">Consistency & Activity History</div>
            <div style="display:flex; align-items:center; gap:0.85rem; font-size:0.73rem; color:var(--text-muted); flex-wrap:wrap;">
              <span style="display:inline-flex; align-items:center; gap:0.35rem;"><span style="width:11px; height:11px; border-radius:3px; background:rgba(255,255,255,0.09); display:inline-block;"></span> Past / No Activity</span>
              <span style="display:inline-flex; align-items:center; gap:0.35rem;"><span style="width:11px; height:11px; border-radius:3px; background:rgba(0,229,153,0.58); border:1px solid rgba(0,229,153,0.85); display:inline-block;"></span> 1 Workout</span>
              <span style="display:inline-flex; align-items:center; gap:0.35rem;"><span style="width:11px; height:11px; border-radius:3px; background:#00e599; display:inline-block;"></span> 2+ Workouts / 45m+</span>
              <span style="display:inline-flex; align-items:center; gap:0.35rem;"><span style="width:11px; height:11px; border-radius:3px; border:1px dashed rgba(255,255,255,0.2); display:inline-block;"></span> Future Date</span>

          </div>

              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.9rem; flex-wrap:wrap; gap:0.5rem;">

                  <span>6-MONTH ACTIVITY GRID</span>
                  <span class="hm-inspect-subtext">(CLICK ANY DAY TO INSPECT)</span>
                </div>
                <div style="display:flex; align-items:center; gap:0.4rem;">
                  <button class="btn btn-secondary btn-sm" aria-label="Previous 6 Months" style="padding:0.25rem 0.5rem;" onclick="window.changeConsistencyPeriod(-1)" title="Previous 6 Months">${SVGs.chevronLeft}</button>
                  <span style="font-size:0.78rem; font-weight:700; color:var(--color-primary); min-width:115px; text-align:center;">${stats.heatmap.periodLabel}</span>
                  <button class="btn btn-secondary btn-sm" aria-label="Next 6 Months" style="padding:0.25rem 0.5rem;" onclick="window.changeConsistencyPeriod(1)" title="Next 6 Months">${SVGs.chevronRight}</button>
                </div>
              </div>
              <div class="hm-months-row" id="hm-months-row">
                ${stats.heatmap.html}
              </div>
              <div style="margin-top:1rem; padding-top:0.85rem; border-top:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; font-size:0.82rem;">
                <div>
                  <span style="color:var(--text-muted);">Selected Date:</span>
                  <strong style="color:var(--text-white); margin-left:0.35rem;">${selectedDate}</strong>
                  <span style="margin-left:0.65rem; color:var(--text-muted);">
                    ${stats.selectedDateWorkouts.length > 0
                      ? `✓ ${stats.selectedDateWorkouts.length} workout${stats.selectedDateWorkouts.length === 1 ? '' : 's'} (${stats.selectedDateWorkouts.map(w => escapeHtml(w.name)).join(', ')}${stats.selectedDateDuration > 0 ? ` • ${stats.selectedDateDuration} min` : ''})`
                      : (selectedDate > todayStr ? 'Upcoming future date' : 'No completed workouts recorded on this date')}
                  </span>
                </div>
              </div>
            </div>
            <div class="heatmap-right">
              <div>
                <div style="font-size:0.72rem; font-weight:700; color:var(--text-muted); margin-bottom:0.25rem; letter-spacing:0.05em;">THIS MONTH</div>
                <div style="font-family:var(--font-display); font-size:2rem; font-weight:800; color:var(--color-primary); line-height:1; margin-bottom:0.25rem;">${stats.heatmap.thisMonthDisplay}</div>
                <div style="font-size:0.68rem; color:var(--text-dim); letter-spacing:0.04em;">${stats.heatmap.thisMonthSub}</div>
              </div>
              <div>
                <div style="font-size:0.72rem; font-weight:700; color:var(--text-muted); margin-bottom:0.25rem; letter-spacing:0.05em;">BEST MONTH</div>
                <div style="font-family:var(--font-display); font-size:1.45rem; font-weight:800; color:var(--color-primary); line-height:1; margin-bottom:0.2rem;">${stats.heatmap.bestMonthDisplay}</div>
                <div style="font-size:0.68rem; color:var(--text-dim); letter-spacing:0.04em;">${stats.heatmap.bestMonthSub}</div>
              </div>
            </div>
          </div>
        </section>
        
        <section class="animate-fade-in" style="animation-delay:0.2s;" aria-label="Recent Activity and Upcoming Sessions">

                    ${stats.recentWorkouts.map(w => {
                      const vol = (Number(w.sets) || 0) * (Number(w.reps) || 0) * (Number(w.weight) || 0);
                      const perf = [
                        w.sets && w.reps ? `${w.sets}×${w.reps}` : (w.sets ? `${w.sets} sets` : null),
                        w.weight !== null && w.weight !== undefined ? `@ ${w.weight} lbs` : null,
                        vol > 0 ? `(${Math.round(vol).toLocaleString()} lbs vol)` : null,
                        w.duration_minutes ? `${w.duration_minutes} min` : null

                          </div>

                        </div>

        <div class="card animate-fade-in" style="animation-delay:0.2s;">
          <div class="card-title">Completed Workout History</div>

              w.sets !== null ? `${w.sets} sets` : null,
              w.reps !== null ? `${w.reps} reps` : null,
              w.weight !== null ? `@ ${w.weight} lbs` : null,
              w.duration_minutes !== null ? `${w.duration_minutes} min` : null
            ].filter(Boolean).join(' • ') || 'Completed session';
            return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem 0; border-bottom:1px solid var(--border-color); flex-wrap:wrap; gap:0.75rem;">

                <div style="display:flex; align-items:center; gap:0.6rem;">
                  <span style="font-weight:700; font-size:1rem;">${escapeHtml(w.name)}</span>

                </div>
