                <button type="button" class="btn btn-primary btn-sm" onclick="closeModal(); window.openQuickScheduleModal('${getLocalDateStr()}', '${escapeHtml(r.name).replace(/'/g, "\\'")}', '${r.estimated_duration || ''}')">Start Workout</button>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    window.renderRoutineExercisesPreview = () => {
      const container = document.getElementById('routine-exercises-preview');
      if (!container) return;
      container.innerHTML = (window.tempRoutineExercises || []).map((ex, idx) => `
        <div style="background:var(--bg-input); padding:0.8rem 1rem; border-radius:12px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--border-color);">
          <div><span style="font-weight:600;">${escapeHtml(ex.name)}</span><span style="color:var(--text-muted); margin-left:0.5rem; font-size:0.84rem;">${formatExerciseSummary(ex)}</span></div>
          <button type="button" style="background:transparent; border:none; color:var(--color-danger); cursor:pointer; font-size:1.2rem; line-height:1;" onclick="window.removeRoutineExercise(${idx})" aria-label="Remove exercise">&times;</button>
        </div>
      `).join('');
    };

    window.addRoutineExercise = () => {
      const nEl = document.getElementById('add-ex-name');
      if (!nEl) return;
      const n = nEl.value.trim();
      if (!n) return showToast('Exercise name required.', 'error');
      const stepsVal = parseOptionalNumber(document.getElementById('add-ex-steps')?.value);
      const setsVal = parseOptionalNumber(document.getElementById('add-ex-sets').value);
      const repsVal = parseOptionalNumber(document.getElementById('add-ex-reps').value);
      const weightVal = parseOptionalNumber(document.getElementById('add-ex-weight').value, true);

      window.tempRoutineExercises = window.tempRoutineExercises || [];
      window.tempRoutineExercises.push({
        name: n,
        sets: setsVal !== null ? setsVal : (stepsVal ? 0 : 3),
        reps: repsVal !== null ? repsVal : (stepsVal ? 0 : 10),
        weight: weightVal !== null ? weightVal : 0,
        steps: stepsVal || null
      });
      nEl.value = '';
      document.getElementById('add-ex-sets').value = '';
      document.getElementById('add-ex-reps').value = '';
      document.getElementById('add-ex-weight').value = '';
      if (document.getElementById('add-ex-steps')) document.getElementById('add-ex-steps').value = '';
      window.renderRoutineExercisesPreview();
    };

    window.removeRoutineExercise = (idx) => {
      window.tempRoutineExercises = window.tempRoutineExercises || [];
      window.tempRoutineExercises.splice(idx, 1);
      window.renderRoutineExercisesPreview();
    };

    async function renderRoutines() {
      const routines = await api.getRoutines();
      window.tempRoutineExercises = window.tempRoutineExercises || [];
      return `
        <div class="page-header animate-fade-in">
          <div>
            <h1 class="page-title">Routines</h1>
            <p class="page-subtitle">Build and manage your workout plans. Changes to templates never overwrite historical workout logs.</p>
          </div>
        </div>

        <div class="card animate-fade-in" style="animation-delay:0.05s;">
          <div class="card-title">Create New Routine</div>
          <form id="routine-form">
            <div class="form-row">
              <div class="form-group" style="flex:2;">
                <div class="form-label-wrap"><label for="r-name">Routine Name <span class="label-required">*</span></label></div>
                <input type="text" id="r-name" required />
              </div>
              <div class="form-group" style="flex:1;">
                <div class="form-label-wrap"><label for="r-est-duration">Estimated Duration (min)</label><span class="label-optional">(Optional)</span></div>
                <input type="number" id="r-est-duration" min="5" />
              </div>
            </div>
            <div class="form-group" style="border-top: 1px solid var(--border-color); padding-top: 1.1rem; margin-top: 0.4rem;">
              <div class="form-label-wrap" style="margin-bottom:0.75rem;"><label>Add Exercises to Routine</label><span class="label-optional">(Optional, you can also add exercises later)</span></div>
              <div id="routine-exercises-preview" style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.85rem;">
                ${window.tempRoutineExercises.map((ex, idx) => `
                  <div style="background:var(--bg-input); padding:0.8rem 1rem; border-radius:12px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--border-color);">
                    <div><span style="font-weight:600;">${escapeHtml(ex.name)}</span><span style="color:var(--text-muted); margin-left:0.5rem; font-size:0.84rem;">${formatExerciseSummary(ex)}</span></div>
                    <button type="button" style="background:transparent; border:none; color:var(--color-danger); cursor:pointer; font-size:1.2rem; line-height:1;" onclick="window.removeRoutineExercise(${idx})" aria-label="Remove exercise">&times;</button>
                  </div>
                `).join('')}
              </div>
              <div class="form-row" style="align-items:flex-end; background:var(--bg-input); padding:1rem; border-radius:14px; border:1px solid var(--border-color);">
                <div class="form-group" style="flex:2; margin-bottom:0;"><label for="add-ex-name">Exercise Name</label><input type="text" id="add-ex-name" /></div>
                <div class="form-group" style="flex:0.9; margin-bottom:0;"><label for="add-ex-sets">Sets</label><input type="number" id="add-ex-sets" min="0" /></div>
                <div class="form-group" style="flex:0.9; margin-bottom:0;"><label for="add-ex-reps">Reps</label><input type="number" id="add-ex-reps" min="0" /></div>
                <div class="form-group" style="flex:0.9; margin-bottom:0;"><label for="add-ex-weight">Lbs</label><input type="number" id="add-ex-weight" min="0" step="0.5" /></div>
                <div class="form-group" style="flex:1.1; margin-bottom:0;"><label for="add-ex-steps">Steps</label><input type="number" id="add-ex-steps" min="0" step="1" /></div>
                <button type="button" class="btn btn-secondary" onclick="window.addRoutineExercise()" style="margin-bottom:0; height:44px;">+ Add</button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">+ Create Routine</button>
          </form>
        </div>
        
        <div class="routines-cards-grid animate-fade-in" style="animation-delay:0.1s;">
          ${routines.length ? routines.map(r => {
            const totalSets = (r.exercises || []).reduce((acc, ex) => acc + (Number(ex.sets) || 0), 0);
            const totalSteps = (r.exercises || []).reduce((acc, ex) => acc + (Number(ex.steps) || 0), 0);
            return `
            <div class="card" style="cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; gap:1rem; padding:1.25rem 1.4rem;" onclick="window.openRoutineDetailModal(${r.id})">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.75rem;">
                <h3 style="font-size:1.15rem; font-weight:800; margin:0; line-height:1.3; font-family:var(--font-display); word-break:break-word; color:var(--text-white); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${escapeHtml(r.name)}</h3>
                <button type="button" aria-label="Delete routine" title="Delete routine" style="background:rgba(239, 68, 68, 0.12); border:1px solid rgba(239, 68, 68, 0.28); color:var(--color-danger); border-radius:8px; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; font-size:1.1rem; font-weight:700; cursor:pointer; flex-shrink:0; transition:var(--transition);" onclick="event.stopPropagation(); window.handleDeleteRoutine(${r.id})" onmouseover="this.style.background='var(--color-danger)'; this.style.color='#fff'" onmouseout="this.style.background='rgba(239, 68, 68, 0.12)'; this.style.color='var(--color-danger)'">
                  &times;
                </button>
              </div>
              <div style="color:var(--text-muted); font-size:0.84rem; display:flex; flex-wrap:wrap; gap:0.65rem;">
                <span><strong style="color:var(--text-white);">${r.exercises ? r.exercises.length : 0}</strong> exercises</span>
                ${totalSets > 0 || totalSteps === 0 ? `<span>&bull; <strong style="color:var(--text-white);">${totalSets}</strong> sets</span>` : ''}
                ${totalSteps > 0 ? `<span>&bull; <strong style="color:var(--color-primary);">${totalSteps.toLocaleString()}</strong> steps</span>` : ''}
                ${r.estimated_duration ? `<span>&bull; <strong style="color:var(--text-white);">~${r.estimated_duration}m</strong></span>` : ''}
              </div>
              <div style="display:flex; gap:0.55rem; margin-top:0.2rem;">
                <button type="button" class="btn btn-primary btn-sm" style="flex:1.4;" onclick="event.stopPropagation(); window.openQuickScheduleModal('${getLocalDateStr()}', '${escapeHtml(r.name).replace(/'/g, "\\'")}', '${r.estimated_duration || ''}')">Start Routine</button>
                <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="event.stopPropagation(); window.openRoutineEditorModal(${r.id}, true)">+ Exercise</button>
              </div>
            </div>
          `;}).join('') : '<div class="card" style="grid-column: 1 / -1; text-align:center; padding:2.5rem 1.5rem; border-style:dashed;"><p style="color:var(--text-white); font-weight:700; font-size:1.05rem; margin-bottom:0.35rem;">No saved routines yet.</p><p style="color:var(--text-muted); font-size:0.88rem;">Use the Create New Routine card above to save your first workout split.</p></div>'}
        </div>
      `;
    }

    async function renderCalendar() {
      const events = await api.getEvents();
      const routines = await api.getRoutines();
      const allWorkouts = await api.getWorkouts();
      let selectedMonth = window.calendarSelectedMonth || new Date();
      const year = selectedMonth.getFullYear(), month = selectedMonth.getMonth();
      const monthName = selectedMonth.toLocaleString('default', { month: 'long' });
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const defaultDate = window.dashboardSelectedDate || getLocalDateStr();

      let daysHtml = '';
      for (let i = 0; i < firstDay; i++) daysHtml += `<div class="calendar-cell" style="background:transparent; border-color:transparent; cursor:default;"></div>`;

      for (let i = 1; i <= daysInMonth; i++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        const evts = events.filter(e => e.date === dStr);
        const activeEvts = evts.filter(e => e.status !== 'cancelled');
        const dayWorkouts = allWorkouts.filter(w => w.date === dStr);
        let cellBg = 'var(--bg-input)';
        let textColor = 'var(--text-white)';
        let isClickable = evts.length > 0;

        if (activeEvts.length > 0) {
          const allDone = activeEvts.every(e => api.isEventCompleted(e, allWorkouts, routines));
          if (allDone) {
            cellBg = 'var(--color-primary)';
            textColor = '#000';
          }
        } else if (dayWorkouts.length > 0) {
          cellBg = 'rgba(0, 229, 153, 0.14)';
        }

        daysHtml += `
          <div ${isClickable ? `onclick="window.openEventManageModal(${evts[0].id})"` : `onclick="window.openQuickScheduleModal('${dStr}')"`} 
               class="calendar-cell" style="background:${cellBg}; color:${textColor};">
            <div class="calendar-cell-date">
              <span>${i}</span>
              ${dStr === getLocalDateStr() ? `<span class="calendar-today-badge">TODAY</span>` : ''}
            </div>
            ${evts.map(e => {
              const done = api.isEventCompleted(e, allWorkouts, routines);
              return `<div onclick="event.stopPropagation(); window.openEventManageModal(${e.id})" class="calendar-event-pill" style="color:${e.status === 'cancelled' ? '#fca5a5' : 'inherit'}; text-decoration:${e.status === 'cancelled' ? 'line-through' : 'none'};">${done ? '✓ ' : ''}${escapeHtml(e.title)}</div>`;
            }).join('')}
          </div>`;
      }

      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthEvents = events.filter(e => e.date.startsWith(monthPrefix));
      const monthWorkouts = allWorkouts.filter(w => w.date && w.date.startsWith(monthPrefix));
      const activeDaysInSelectedMonth = new Set(monthWorkouts.map(w => w.date)).size;

      const recordedMonthsSet = new Set([
        ...allWorkouts.map(w => w.date ? w.date.slice(0, 7) : null),
        ...events.map(e => e.date ? e.date.slice(0, 7) : null),
        monthPrefix
      ].filter(Boolean));
      const sortedRecordedMonths = Array.from(recordedMonthsSet).sort().reverse();

      return `
        <div class="page-header animate-fade-in">
          <div><h1 class="page-title">Calendar</h1><p class="page-subtitle">Schedule routine templates, manage sessions, and browse saved monthly consistency history.</p></div>
        </div>
        <div class="calendar-layout-grid animate-fade-in" style="animation-delay:0.1s;">
          <div class="card">
            <div class="card-title">Schedule Session</div>
            <form id="calendar-event-form">
              <div class="form-group">
                <div class="form-label-wrap"><label for="ce-title">Routine Template</label></div>
                <select id="ce-title">
                  ${routines.length ? routines.map(r => `<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)}</option>`).join('') : '<option value="">-- Or enter custom title below --</option>'}
                </select>
              </div>
              <div class="form-group">
                <div class="form-label-wrap"><label for="ce-custom">Custom Session Title</label><span class="label-optional">(Optional override)</span></div>
                <input type="text" id="ce-custom" />
              </div>
              <div class="form-group">
                <div class="form-label-wrap"><label for="ce-date">Scheduled Date <span class="label-required">*</span></label></div>
                <input type="date" id="ce-date" value="${defaultDate}" required />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <div class="form-label-wrap"><label for="ce-time">Time</label><span class="label-optional">(Optional)</span></div>
                  <input type="time" id="ce-time" />
                </div>
                <div class="form-group">
                  <div class="form-label-wrap"><label for="ce-duration">Est. Min</label><span class="label-optional">(Optional)</span></div>
                  <input type="number" id="ce-duration" min="5" />
                </div>
              </div>
              <button type="submit" class="btn btn-primary" style="width:100%;">Add to Calendar</button>
            </form>

            <div style="margin-top:1.5rem; padding-top:1.15rem; border-top:1px solid var(--border-color);">
              <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted); margin-bottom:0.75rem;">${monthName} ${year} Sessions (${monthEvents.length})</div>
              ${monthEvents.length ? `<div style="display:flex; flex-direction:column; gap:0.5rem; max-height:190px; overflow-y:auto;">
                ${monthEvents.map(e => {
                  const done = api.isEventCompleted(e, allWorkouts, routines);
                  const bClass = e.status === 'cancelled' ? 'badge-cancelled' : (done ? 'badge-completed' : (e.status === 'in_progress' ? 'badge-inprogress' : 'badge-scheduled'));
                  const bText = e.status === 'cancelled' ? 'Cancelled' : (done ? 'Completed' : (e.status === 'in_progress' ? 'In Progress' : 'Scheduled'));
                  return `
                    <div onclick="window.openEventManageModal(${e.id})" style="padding:0.65rem 0.85rem; background:var(--bg-input); border:1px solid var(--border-color); border-radius:10px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-size:0.82rem;">
                      <div>
                        <div style="font-weight:700;">${escapeHtml(e.title)}</div>
                        <div style="color:var(--text-dim); font-size:0.75rem;">${e.date}${e.scheduled_time ? ` • ${e.scheduled_time}` : ''}</div>
                      </div>
                      <span class="badge ${bClass}">${bText}</span>
                    </div>
                  `;
                }).join('')}
              </div>` : `<p style="font-size:0.82rem; color:var(--text-dim);">No sessions scheduled in ${monthName}.</p>`}
            </div>

            <div style="margin-top:1.5rem; padding-top:1.15rem; border-top:1px solid var(--border-color);">
              <div style="font-size:0.82rem; font-weight:700; color:var(--text-muted); margin-bottom:0.6rem; text-transform:uppercase; letter-spacing:0.04em;">Saved Consistency Archive</div>
              <div style="display:flex; flex-direction:column; gap:0.45rem; max-height:180px; overflow-y:auto;">
                ${sortedRecordedMonths.map(mPref => {
                  const [yStr, mStr] = mPref.split('-');
                  const mNum = parseInt(mStr, 10);
                  const totalDays = new Date(parseInt(yStr, 10), mNum, 0).getDate();
                  const mWorkouts = allWorkouts.filter(w => w.date && w.date.startsWith(mPref));
                  const activeDays = new Set(mWorkouts.map(w => w.date)).size;
                  return `
                    <div onclick="window.jumpCalendarToMonth(${parseInt(yStr, 10)}, ${mNum - 1})" style="padding:0.55rem 0.75rem; background:var(--bg-input); border:1px solid ${mPref === monthPrefix ? 'var(--color-primary)' : 'var(--border-color)'}; border-radius:10px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-size:0.8rem;">
                      <span style="font-weight:700;">${mPref}</span>
                      <span style="color:var(--color-primary); font-weight:600;">${activeDays}/${totalDays} active days (${mWorkouts.length} logs)</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:0.75rem;">
              <div>
                <h2 style="font-size:1.25rem;">${monthName} ${year}</h2>
                <div style="font-size:0.8rem; color:var(--text-muted); margin-top:0.15rem;">${activeDaysInSelectedMonth} of ${daysInMonth} days active &bull; <a onclick="window.viewHalfYearOnDashboard(${year}, ${month < 6 ? 0 : 1})" style="color:var(--color-primary); cursor:pointer; font-weight:600;">View ${month < 6 ? 'Jan–Jun' : 'Jul–Dec'} ${year} on Overview &rarr;</a></div>
              </div>
              <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-secondary" aria-label="Previous Month" style="padding:0.5rem;" onclick="window.changeMonth(-1)">${SVGs.chevronLeft}</button>
                <button class="btn btn-secondary" aria-label="Next Month" style="padding:0.5rem;" onclick="window.changeMonth(1)">${SVGs.chevronRight}</button>
              </div>
            </div>
            <div class="calendar-month-grid">
              ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="calendar-day-header">${d}</div>`).join('')}
              ${daysHtml}
            </div>
          </div>
        </div>
      `;
    }

    function getPriorityWeight(p) {
      if (p === 'high') return 3;
      if (p === 'medium') return 2;
      if (p === 'low') return 1;
      return 0;
    }

    function renderTaskRowHTML(task, todayStr, options = {}) {
      const isCompleted = task.status === 'completed';
      const isProjected = !!task.is_projected_occurrence;
      const isOverdue = !isCompleted && task.due_date && task.due_date < todayStr;
      const isDueToday = !isCompleted && task.due_date === todayStr;
      const recLabel = task.recurrence && task.recurrence.type && task.recurrence.type !== 'none'
        ? api.formatRecurrenceLabel(task.recurrence, task.due_date)
        : (task.recurrence_origin_label || '');

      const nowLocalIso = (() => {
        const n = new Date();
        const pad = v => String(v).padStart(2, '0');
        return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}T${pad(n.getHours())}:${pad(n.getMinutes())}`;
      })();
      const isReminderDue = !isCompleted && task.reminder_at && !task.reminder_dismissed && task.reminder_at <= nowLocalIso;

      const subtasks = Array.isArray(task.subtasks) ? task.subtasks : [];
      const subtasksDone = subtasks.filter(s => s.done).length;
      const realTaskId = task.source_task_id || task.id;
      const occDateAttr = task.due_date || '';

      const priorityBadge = task.priority && task.priority !== 'none' ? `
        <span class="task-pill priority-pill priority-${task.priority}" title="Priority: ${task.priority}">
          <span class="priority-dot priority-${task.priority}"></span>
          ${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}
        </span>
      ` : '';

      const dueDateBadge = task.due_date ? `
        <span class="task-pill ${isOverdue ? 'pill-overdue' : (isDueToday ? 'pill-today' : '')}">
          ${isOverdue ? 'Overdue • ' : ''}${formatReadableDate(task.due_date, todayStr)}${task.due_time ? ` at ${task.due_time}` : ''}
        </span>
      ` : `<span class="task-pill">No due date</span>`;

      return `
        <div class="task-row ${isOverdue ? 'task-overdue' : ''} ${isCompleted ? 'task-completed' : ''}"
             ${!isCompleted ? `draggable="true" ondragstart="window.handleTaskDragStart(event, ${realTaskId}, '${occDateAttr}')"` : ''}>
          <div class="task-row-main">
            <input type="checkbox"
                   class="custom-checkbox"
                   style="margin-top:0.12rem;"
                   aria-label="Mark ${escapeHtml(task.title)} as ${isCompleted ? 'incomplete' : 'complete'}"
                   ${isCompleted ? 'checked' : ''}
                   onchange="window.handleToggleTaskCheckbox(${realTaskId}, this.checked, '${occDateAttr}')" />
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                <span class="task-title-text" style="cursor:pointer;" onclick="window.openTaskModal(${realTaskId}, '${occDateAttr}')">${escapeHtml(task.title)}</span>
                ${isProjected ? `<span class="badge badge-scheduled" title="Scheduled future occurrence of a recurring task">Scheduled Occurrence</span>` : ''}
              </div>
              ${task.description ? `<div style="font-size:0.8rem; color:var(--text-muted); margin-top:0.2rem; line-height:1.4;">${escapeHtml(task.description)}</div>` : ''}
              <div class="task-meta-row">
                ${dueDateBadge}
                ${task.category ? `<span class="task-pill">${escapeHtml(task.category)}</span>` : ''}
                ${priorityBadge}
                ${recLabel ? `<span class="task-pill pill-recurrence" title="Recurring schedule">↻ ${escapeHtml(recLabel)}</span>` : ''}
                ${task.reminder_at ? `<span class="task-pill ${isReminderDue ? 'pill-reminder-due' : ''}" title="Reminder: ${task.reminder_at.replace('T', ' ')}">${SVGs.bell} <span>${task.reminder_at.replace('T', ' ')}</span></span>` : ''}
                ${subtasks.length > 0 ? `<span class="task-pill">${SVGs.checkSquare} <span>${subtasksDone}/${subtasks.length} subtasks</span></span>` : ''}
                ${isCompleted && task.completed_at ? `<span class="task-pill" style="color:var(--color-primary);">✓ Completed ${new Date(task.completed_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>` : ''}
              </div>
              ${subtasks.length > 0 && !isCompleted && !isProjected ? `
                <div style="margin-top:0.5rem; display:flex; flex-wrap:wrap; gap:0.4rem;">
                  ${subtasks.map((st, sIdx) => `
                    <label style="display:inline-flex; align-items:center; gap:0.35rem; font-size:0.75rem; background:rgba(255,255,255,0.03); border:1px solid var(--border-color); padding:0.2rem 0.55rem; border-radius:7px; cursor:pointer; color:${st.done ? 'var(--color-primary)' : 'var(--text-muted)'}; text-decoration:${st.done ? 'line-through' : 'none'};">
                      <input type="checkbox" ${st.done ? 'checked' : ''} style="width:13px; height:13px; accent-color:var(--color-primary);" onchange="window.handleToggleSubtask(${realTaskId}, ${sIdx})" />
                      <span>${escapeHtml(st.title)}</span>
                    </label>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
          <div class="task-row-actions">
            ${!isCompleted ? `
              <button type="button" class="task-icon-btn" title="Change Due Date" onclick="window.openTaskRescheduleModal(${realTaskId}, '${occDateAttr}')">Date</button>
            ` : `
              <button type="button" class="task-icon-btn" title="Reopen Task" onclick="window.handleToggleTaskCheckbox(${realTaskId}, false, '${occDateAttr}')">Reopen</button>
            `}
            <button type="button" class="task-icon-btn" onclick="window.openTaskModal(${realTaskId}, '${occDateAttr}')">Edit</button>
            <button type="button" class="task-icon-btn" style="color:var(--color-danger); border-color:rgba(239,68,68,0.25);" onclick="window.handleDeleteTaskPrompt(${realTaskId}, '${occDateAttr}')">Delete</button>
          </div>
        </div>
      `;
    }

    async function renderTasks() {
      const todayStr = getLocalDateStr();
      const subView = window.tasksSubView || 'today';
      const selectedDate = window.tasksSelectedDate || todayStr;
      const allTasks = await api.getTasks();
      const categories = await api.getTaskCategories();

      const activeTasks = allTasks.filter(t => t.status === 'active');
      const completedTasks = allTasks
        .filter(t => t.status === 'completed')
        .sort((a, b) => new Date(b.completed_at || b.updated_at) - new Date(a.completed_at || a.updated_at));

      const overdueTasks = activeTasks
        .filter(t => t.due_date && t.due_date < todayStr)
        .sort((a, b) => a.due_date.localeCompare(b.due_date) || getPriorityWeight(b.priority) - getPriorityWeight(a.priority));

      const dueTodayActive = activeTasks
        .filter(t => t.due_date === todayStr)
        .sort((a, b) => (a.due_time || '99:99').localeCompare(b.due_time || '99:99') || getPriorityWeight(b.priority) - getPriorityWeight(a.priority));

      const completedToday = completedTasks.filter(t => {
        const compDateStr = t.completed_at ? getLocalDateStr(new Date(t.completed_at)) : '';
        return compDateStr === todayStr || t.due_date === todayStr;
      });

      const totalTodayPool = dueTodayActive.length + completedToday.length;
      const todayProgressPct = totalTodayPool > 0 ? Math.round((completedToday.length / totalTodayPool) * 100) : 0;

      const nowLocalIso = (() => {
        const n = new Date();
        const pad = v => String(v).padStart(2, '0');
        return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}T${pad(n.getHours())}:${pad(n.getMinutes())}`;
      })();
      const dueReminders = activeTasks.filter(t => t.reminder_at && !t.reminder_dismissed && t.reminder_at <= nowLocalIso);

      let viewBodyHTML = '';

      if (subView === 'today') {
        const isViewingToday = selectedDate === todayStr;
        const projectedForSelected = selectedDate > todayStr
          ? api.projectRecurringInstancesForRange(activeTasks, selectedDate, selectedDate)
          : [];

        const dayOverdue = isViewingToday ? overdueTasks : activeTasks.filter(t => t.due_date && t.due_date < selectedDate);
        const dayDueActive = [
          ...activeTasks.filter(t => t.due_date === selectedDate),
          ...projectedForSelected
        ].sort((a, b) => (a.due_time || '99:99').localeCompare(b.due_time || '99:99') || getPriorityWeight(b.priority) - getPriorityWeight(a.priority));

        const dayCompleted = completedTasks.filter(t => {
          const compDateStr = t.completed_at ? getLocalDateStr(new Date(t.completed_at)) : '';
          return t.due_date === selectedDate || (isViewingToday && compDateStr === todayStr);
        });

        const dayTotalPool = dayDueActive.length + dayCompleted.length;
        const dayPct = dayTotalPool > 0 ? Math.round((dayCompleted.length / dayTotalPool) * 100) : 0;
        const showCompletedToday = window.tasksShowCompletedToday !== false;

        viewBodyHTML = `
          <div class="card" style="padding:1.1rem 1.35rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.85rem;">
              <div>
                <div style="display:flex; align-items:center; gap:0.65rem; flex-wrap:wrap;">
                  <span style="font-family:var(--font-display); font-size:1.2rem; font-weight:800; color:var(--text-white);">
                    ${formatReadableDate(selectedDate, todayStr)} (${selectedDate})
                  </span>
                  ${dayTotalPool > 0 && dayDueActive.length === 0 ? `<span class="badge badge-completed">✓ All tasks completed!</span>` : ''}
                </div>
                <div style="font-size:0.83rem; color:var(--text-muted); margin-top:0.2rem;">
                  ${dayTotalPool > 0
                    ? `${dayCompleted.length} of ${dayTotalPool} task${dayTotalPool === 1 ? '' : 's'} completed ${isViewingToday ? 'today' : `for ${selectedDate}`} (${dayPct}%)`
                    : `No tasks scheduled for ${isViewingToday ? 'today' : selectedDate} yet.`}
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap;">
                <button type="button" class="btn btn-secondary btn-sm" onclick="window.selectTasksDate('${addDays(selectedDate, -1)}')" title="Previous Day">${SVGs.chevronLeft}</button>
                <input type="date" aria-label="Select Task Date" value="${selectedDate}" onchange="window.selectTasksDate(this.value)" style="width:auto; padding:0.35rem 0.65rem; font-size:0.8rem; border-radius:9px;" />
                <button type="button" class="btn btn-secondary btn-sm" onclick="window.selectTasksDate('${addDays(selectedDate, 1)}')" title="Next Day">${SVGs.chevronRight}</button>
                ${!isViewingToday ? `<button type="button" class="btn btn-secondary btn-sm" onclick="window.selectTasksDate('${todayStr}')">Today</button>` : ''}
              </div>
            </div>
            ${dayTotalPool > 0 ? `
              <div class="progress-track" style="margin-top:0.75rem;">
                <div class="progress-fill" style="width:${dayPct}%;"></div>
              </div>
            ` : ''}
          </div>

          ${isViewingToday && dayOverdue.length > 0 ? `
            <div class="task-group-section">
              <div class="task-group-header">
                <span style="color:#fca5a5;">Overdue (${dayOverdue.length})</span>
                <span style="font-size:0.72rem; text-transform:none; color:var(--text-dim);">Past due date • Complete or reschedule</span>
              </div>
              <div class="task-list">
                ${dayOverdue.map(t => renderTaskRowHTML(t, todayStr)).join('')}
              </div>
            </div>
          ` : ''}

          <div class="task-group-section">
            <div class="task-group-header">
              <span>Due ${isViewingToday ? 'Today' : selectedDate} (${dayDueActive.length})</span>
              <button class="section-link" onclick="window.openTaskModal(null, '${selectedDate}')">+ Add for ${isViewingToday ? 'Today' : selectedDate}</button>
            </div>
            ${dayDueActive.length > 0 ? `
              <div class="task-list">
                ${dayDueActive.map(t => renderTaskRowHTML(t, todayStr)).join('')}
              </div>
            ` : `
              <div class="card" style="text-align:center; padding:2rem 1.25rem; border-style:dashed;">
                <div style="font-weight:700; font-size:1rem; color:var(--text-white); margin-bottom:0.3rem;">
                  ${dayCompleted.length > 0 ? `Everything scheduled for ${isViewingToday ? 'today' : selectedDate} is complete!` : `No tasks scheduled for ${isViewingToday ? 'today' : selectedDate}.`}
                </div>
                <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">
                  Add a daily errand, bill reminder, or personal responsibility to stay on track.
                </p>
                <button type="button" class="btn btn-primary btn-sm" onclick="window.openTaskModal(null, '${selectedDate}')">+ Add Task</button>
              </div>
            `}
          </div>

          ${dayCompleted.length > 0 ? `
            <div class="task-group-section">
              <div class="task-group-header" style="cursor:pointer;" onclick="window.tasksShowCompletedToday = !${showCompletedToday}; renderApp({ isRouteChange: false, preserveScroll: true });">
                <span>Completed ${isViewingToday ? 'Today' : selectedDate} (${dayCompleted.length})</span>
                <span class="section-link">${showCompletedToday ? 'Hide ▲' : 'Show ▼'}</span>
              </div>
              ${showCompletedToday ? `
                <div class="task-list">
                  ${dayCompleted.map(t => renderTaskRowHTML(t, todayStr)).join('')}
                </div>
              ` : ''}
            </div>
          ` : ''}
        `;
      } else if (subView === 'upcoming') {
        const upCat = window.tasksUpcomingCategory || 'all';
        const upPri = window.tasksUpcomingPriority || 'all';
        const upRange = window.tasksUpcomingRange || 'all';
        const upIncCompleted = !!window.tasksUpcomingIncludeCompleted;

        const tomorrowStr = addDays(todayStr, 1);
        const endOfThisWeekStr = addDays(getMondayOfWeek(todayStr), 6);
        const endOfNextWeekStr = addDays(endOfThisWeekStr, 7);

        let rangeLimitStr = '9999-12-31';
        if (upRange === '7d') rangeLimitStr = addDays(todayStr, 7);
        else if (upRange === '30d') rangeLimitStr = addDays(todayStr, 30);
        else if (upRange === '90d') rangeLimitStr = addDays(todayStr, 90);

        const projHorizon = upRange === '7d' ? addDays(todayStr, 7) : upRange === '30d' ? addDays(todayStr, 30) : addDays(todayStr, 90);
        const projectedUpcoming = api.projectRecurringInstancesForRange(activeTasks, tomorrowStr, projHorizon);

        const pool = [
          ...activeTasks,
          ...projectedUpcoming,
          ...(upIncCompleted ? completedTasks : [])
        ].filter(t => {
          if (upCat !== 'all' && (t.category || '') !== upCat) return false;
          if (upPri !== 'all' && (t.priority || 'none') !== upPri) return false;
          if (t.due_date && t.due_date > rangeLimitStr) return false;
          return true;
        });

        const sortChrono = (a, b) => (a.due_date || '9999-12-31').localeCompare(b.due_date || '9999-12-31') || (a.due_time || '99:99').localeCompare(b.due_time || '99:99') || getPriorityWeight(b.priority) - getPriorityWeight(a.priority);

        const grpOverdue = pool.filter(t => t.status === 'active' && t.due_date && t.due_date < todayStr).sort(sortChrono);
        const grpToday = pool.filter(t => t.due_date === todayStr).sort(sortChrono);
        const grpTomorrow = pool.filter(t => t.due_date === tomorrowStr).sort(sortChrono);
        const grpThisWeek = pool.filter(t => t.due_date && t.due_date > tomorrowStr && t.due_date <= endOfThisWeekStr).sort(sortChrono);
        const grpNextWeek = pool.filter(t => t.due_date && t.due_date > endOfThisWeekStr && t.due_date <= endOfNextWeekStr).sort(sortChrono);
        const grpLater = pool.filter(t => t.due_date && t.due_date > endOfNextWeekStr).sort(sortChrono);
        const grpUnscheduled = pool.filter(t => !t.due_date && t.status === 'active');

        const renderGroupBlock = (label, items, accentColor = null) => {
          if (items.length === 0) return '';
          return `
            <div class="task-group-section">
              <div class="task-group-header">
                <span style="${accentColor ? `color:${accentColor};` : ''}">${label} (${items.length})</span>
              </div>
              <div class="task-list">
                ${items.map(t => renderTaskRowHTML(t, todayStr)).join('')}
              </div>
            </div>
          `;
        };

        const totalShown = grpOverdue.length + grpToday.length + grpTomorrow.length + grpThisWeek.length + grpNextWeek.length + grpLater.length + grpUnscheduled.length;

        viewBodyHTML = `
          <div class="tasks-filter-bar">
            <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Filters:</span>
            <select aria-label="Filter by Category" onchange="window.tasksUpcomingCategory = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="all" ${upCat === 'all' ? 'selected' : ''}>All Categories</option>
              ${categories.map(c => `<option value="${escapeHtml(c)}" ${upCat === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
            </select>
            <select aria-label="Filter by Priority" onchange="window.tasksUpcomingPriority = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="all" ${upPri === 'all' ? 'selected' : ''}>All Priorities</option>
              <option value="high" ${upPri === 'high' ? 'selected' : ''}>High Priority</option>
              <option value="medium" ${upPri === 'medium' ? 'selected' : ''}>Medium Priority</option>
              <option value="low" ${upPri === 'low' ? 'selected' : ''}>Low Priority</option>
              <option value="none" ${upPri === 'none' ? 'selected' : ''}>No Priority</option>
            </select>
            <select aria-label="Filter by Date Horizon" onchange="window.tasksUpcomingRange = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="all" ${upRange === 'all' ? 'selected' : ''}>All Upcoming (90d projection)</option>
              <option value="7d" ${upRange === '7d' ? 'selected' : ''}>Next 7 Days</option>
              <option value="30d" ${upRange === '30d' ? 'selected' : ''}>Next 30 Days</option>
              <option value="90d" ${upRange === '90d' ? 'selected' : ''}>Next 90 Days</option>
            </select>
            <label style="display:inline-flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--text-muted); cursor:pointer; margin-left:auto;">
              <input type="checkbox" ${upIncCompleted ? 'checked' : ''} style="width:15px; height:15px; accent-color:var(--color-primary);" onchange="window.tasksUpcomingIncludeCompleted = this.checked; renderApp({ isRouteChange: false, preserveScroll: true });" />
              <span>Include Completed</span>
            </label>
          </div>

          ${totalShown > 0 ? `
            ${renderGroupBlock('Overdue', grpOverdue, '#fca5a5')}
            ${renderGroupBlock('Today', grpToday, 'var(--color-primary)')}
            ${renderGroupBlock('Tomorrow', grpTomorrow)}
            ${renderGroupBlock('Later This Week', grpThisWeek)}
            ${renderGroupBlock('Next Week', grpNextWeek)}
            ${renderGroupBlock('Later', grpLater)}
            ${renderGroupBlock('Unscheduled (No Due Date)', grpUnscheduled)}
          ` : `
            <div class="card" style="text-align:center; padding:2.25rem 1.25rem; border-style:dashed;">
              <div style="font-weight:700; font-size:1.05rem; color:var(--text-white); margin-bottom:0.35rem;">No upcoming tasks match your filters.</div>
              <p style="font-size:0.86rem; color:var(--text-muted); margin-bottom:1rem;">Schedule future errands, recurring monthly bills, or work deadlines.</p>
              <button type="button" class="btn btn-primary btn-sm" onclick="window.openTaskModal(null, '${tomorrowStr}')">+ Schedule Upcoming Task</button>
            </div>
          `}
        `;
      } else if (subView === 'calendar') {
        const calMode = window.tasksCalendarMode || 'month';
        const calCat = window.tasksCalCategory || 'all';
        const calStatus = window.tasksCalStatus || 'all';

        const selDateObj = parseLocalDate(selectedDate);
        const calYear = window.tasksCalYear !== undefined ? window.tasksCalYear : selDateObj.getFullYear();
        const calMonth = window.tasksCalMonth !== undefined ? window.tasksCalMonth : selDateObj.getMonth();

        const firstDayOfWeek = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const monthName = new Date(calYear, calMonth, 1).toLocaleString('default', { month: 'long' });
        const monthStartStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-01`;
        const monthEndStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(daysInMonth).padStart(2, '0')}`;

        const projectedMonthTasks = api.projectRecurringInstancesForRange(activeTasks, monthStartStr, monthEndStr);

        const combinedCalPool = [
          ...activeTasks,
          ...projectedMonthTasks,
          ...completedTasks
        ].filter(t => {
          if (!t.due_date) return false;
          if (calCat !== 'all' && (t.category || '') !== calCat) return false;
          if (calStatus === 'active' && t.status !== 'active') return false;
          if (calStatus === 'completed' && t.status !== 'completed') return false;
          return true;
        });

        let calCellsHTML = '';
        for (let i = 0; i < firstDayOfWeek; i++) {
          calCellsHTML += `<div style="min-height:96px; border-radius:12px; background:rgba(255,255,255,0.01); border:1px dashed rgba(255,255,255,0.03);"></div>`;
        }

        for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
          const dStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
          const isTodayCell = dStr === todayStr;
          const isSelectedCell = dStr === selectedDate;
          const dayTasks = combinedCalPool
            .filter(t => t.due_date === dStr)
            .sort((a, b) => (a.status === 'completed' ? 1 : -1) || getPriorityWeight(b.priority) - getPriorityWeight(a.priority));

          const visiblePills = dayTasks.slice(0, 3);
          const overflowCount = Math.max(0, dayTasks.length - 3);

          calCellsHTML += `
            <div class="tasks-cal-cell ${isSelectedCell ? 'cal-selected' : ''}"
                 onclick="window.selectTasksDate('${dStr}')"
                 ondragover="event.preventDefault(); this.classList.add('cal-dragover');"
                 ondragleave="this.classList.remove('cal-dragover');"
                 ondrop="window.handleTaskCalendarDrop(event, '${dStr}'); this.classList.remove('cal-dragover');">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
                  <span style="font-size:0.8rem; font-weight:700; color:${isTodayCell ? 'var(--color-primary)' : 'var(--text-white)'};">${dayNum}</span>
                  ${isTodayCell ? `<span style="font-size:0.58rem; font-weight:800; background:var(--color-primary-dim); color:var(--color-primary); padding:1px 5px; border-radius:4px;">TODAY</span>` : ''}
                </div>
                ${visiblePills.map(t => {
                  const isComp = t.status === 'completed';
                  const isOvr = !isComp && t.due_date < todayStr;
                  const cls = isComp ? 'cal-item-completed' : (isOvr ? 'cal-item-overdue' : (t.is_projected_occurrence ? 'cal-item-projected' : ''));
                  return `<div class="tasks-cal-item ${cls}" title="${escapeHtml(t.title)}">${isComp ? '✓ ' : (t.recurrence && t.recurrence.type !== 'none' ? '↻ ' : '')}${escapeHtml(t.title)}</div>`;
                }).join('')}
              </div>
              ${overflowCount > 0 ? `<div style="font-size:0.68rem; font-weight:700; color:var(--color-primary); margin-top:2px;">+${overflowCount} more</div>` : ''}
            </div>
          `;
        }

        const projectedForSelected = selectedDate > todayStr
          ? api.projectRecurringInstancesForRange(activeTasks, selectedDate, selectedDate)
          : [];
        const selectedDateTasks = [
          ...activeTasks.filter(t => t.due_date === selectedDate),
          ...projectedForSelected.filter(p => !projectedMonthTasks.some(pm => pm.source_task_id === p.source_task_id && pm.due_date === p.due_date && selectedDate >= monthStartStr && selectedDate <= monthEndStr)),
          ...(selectedDate >= monthStartStr && selectedDate <= monthEndStr ? projectedMonthTasks.filter(p => p.due_date === selectedDate) : []),
          ...completedTasks.filter(t => t.due_date === selectedDate)
        ].filter(t => {
          if (calCat !== 'all' && (t.category || '') !== calCat) return false;
          if (calStatus === 'active' && t.status !== 'active') return false;
          if (calStatus === 'completed' && t.status !== 'completed') return false;
          return true;
        });

        const seenKeys = new Set();
        const uniqueSelectedDateTasks = selectedDateTasks.filter(t => {
          const k = `${t.source_task_id || t.id}_${t.due_date}_${t.status}`;
          if (seenKeys.has(k)) return false;
          seenKeys.add(k);
          return true;
        });

        viewBodyHTML = `
          <div class="tasks-filter-bar">
            <div style="display:flex; align-items:center; gap:0.5rem;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="window.changeTasksCalMonth(-1)" aria-label="Previous Month">${SVGs.chevronLeft}</button>
              <span style="font-family:var(--font-display); font-size:1.05rem; font-weight:800; min-width:145px; text-align:center;">${monthName} ${calYear}</span>
              <button type="button" class="btn btn-secondary btn-sm" onclick="window.changeTasksCalMonth(1)" aria-label="Next Month">${SVGs.chevronRight}</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="window.jumpTasksCalendarToToday()">Today</button>
            </div>
            <div style="display:flex; align-items:center; gap:0.5rem; margin-left:auto; flex-wrap:wrap;">
              <select aria-label="Filter Calendar Category" onchange="window.tasksCalCategory = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
                <option value="all" ${calCat === 'all' ? 'selected' : ''}>All Categories</option>
                ${categories.map(c => `<option value="${escapeHtml(c)}" ${calCat === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
              </select>
              <select aria-label="Filter Calendar Status" onchange="window.tasksCalStatus = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
                <option value="all" ${calStatus === 'all' ? 'selected' : ''}>All Statuses</option>
                <option value="active" ${calStatus === 'active' ? 'selected' : ''}>Active Only</option>
                <option value="completed" ${calStatus === 'completed' ? 'selected' : ''}>Completed Only</option>
              </select>
              <div class="metric-tabs">
                <button type="button" class="metric-tab ${calMode === 'month' ? 'active' : ''}" onclick="window.tasksCalendarMode='month'; renderApp({ isRouteChange: false, preserveScroll: true });">Month Grid</button>
                <button type="button" class="metric-tab ${calMode === 'agenda' ? 'active' : ''}" onclick="window.tasksCalendarMode='agenda'; renderApp({ isRouteChange: false, preserveScroll: true });">Daily Agenda</button>
              </div>
            </div>
          </div>

          <div class="tasks-calendar-layout">
            <div class="card">
              ${calMode === 'month' ? `
                <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:0.45rem; margin-bottom:0.45rem;">
                  ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div style="text-align:center; font-size:0.76rem; font-weight:700; color:var(--text-muted);">${d}</div>`).join('')}
                </div>
                <div class="tasks-cal-grid">
                  ${calCellsHTML}
                </div>
                <div style="margin-top:0.85rem; padding-top:0.65rem; border-top:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; color:var(--text-dim); flex-wrap:wrap; gap:0.5rem;">
                  <span>Tip: Click any date to inspect its tasks on the right, or drag a task onto a date to reschedule.</span>
                  <span>Dashed border = projected recurring responsibility</span>
                </div>
              ` : `
                <div class="card-title">
                  <span>Daily Agenda for ${monthName} ${calYear}</span>
                </div>
                ${(() => {
                  const monthDates = Array.from(new Set(combinedCalPool.filter(t => t.due_date && t.due_date.startsWith(`${calYear}-${String(calMonth + 1).padStart(2, '0')}`)).map(t => t.due_date))).sort();
                  if (monthDates.length === 0) {
                    return `<p style="color:var(--text-dim); font-size:0.88rem; padding:1rem 0;">No tasks scheduled in ${monthName} ${calYear}.</p>`;
                  }
                  return monthDates.map(dStr => {
                    const items = combinedCalPool.filter(t => t.due_date === dStr);
                    return `
                      <div style="margin-bottom:1rem; padding-bottom:0.85rem; border-bottom:1px solid var(--border-color);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                          <strong style="color:${dStr === todayStr ? 'var(--color-primary)' : 'var(--text-white)'}; font-size:0.9rem;">${formatReadableDate(dStr, todayStr)} (${dStr})</strong>
                          <button type="button" class="section-link" onclick="window.openTaskModal(null, '${dStr}')">+ Add</button>
                        </div>
                        <div class="task-list">
                          ${items.map(t => renderTaskRowHTML(t, todayStr)).join('')}
                        </div>
                      </div>
                    `;
                  }).join('');
                })()}
              `}
            </div>

            <div class="card" style="position:sticky; top:1.5rem;">
              <div class="card-title" style="margin-bottom:0.35rem;">
                <span>${formatReadableDate(selectedDate, todayStr)}</span>
                <button type="button" class="btn btn-primary btn-sm" onclick="window.openTaskModal(null, '${selectedDate}')">+ Add Task</button>
              </div>
              <div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:1rem;">Selected Date: <strong>${selectedDate}</strong> (${uniqueSelectedDateTasks.length} item${uniqueSelectedDateTasks.length === 1 ? '' : 's'})</div>
              ${uniqueSelectedDateTasks.length > 0 ? `
                <div class="task-list">
                  ${uniqueSelectedDateTasks.map(t => renderTaskRowHTML(t, todayStr)).join('')}
                </div>
              ` : `
                <div style="padding:1.5rem 1rem; text-align:center; background:var(--bg-input); border-radius:12px; border:1px dashed var(--border-color);">
                  <p style="font-size:0.84rem; color:var(--text-muted); margin-bottom:0.75rem;">No tasks scheduled on ${selectedDate}.</p>
                  <button type="button" class="btn btn-secondary btn-sm" onclick="window.openTaskModal(null, '${selectedDate}')">+ Schedule Task for ${selectedDate}</button>
                </div>
              `}
            </div>
          </div>
        `;
      } else if (subView === 'all') {
        const searchQ = (window.tasksSearchQuery || '').trim().toLowerCase();
        const filterCat = window.tasksFilterCategory || 'all';
        const filterStatus = window.tasksFilterStatus || 'active';
        const filterPri = window.tasksFilterPriority || 'all';
        const filterDateRange = window.tasksFilterDateRange || 'all';
        const sortBy = window.tasksSortBy || 'due_date';

        const next7Str = addDays(todayStr, 7);
        const currentMonthPrefix = todayStr.slice(0, 7);

        const filteredAll = allTasks.filter(t => {
          if (filterStatus === 'active' && t.status !== 'active') return false;
          if (filterStatus === 'completed' && t.status !== 'completed') return false;
          if (filterCat !== 'all') {
            if (filterCat === '__none__' && t.category) return false;
            if (filterCat !== '__none__' && (t.category || '') !== filterCat) return false;
          }
          if (filterPri !== 'all' && (t.priority || 'none') !== filterPri) return false;
          if (filterDateRange === 'overdue' && !(t.status === 'active' && t.due_date && t.due_date < todayStr)) return false;
          if (filterDateRange === 'today' && t.due_date !== todayStr) return false;
          if (filterDateRange === 'next7' && !(t.due_date && t.due_date >= todayStr && t.due_date <= next7Str)) return false;
          if (filterDateRange === 'month' && !(t.due_date && t.due_date.startsWith(currentMonthPrefix))) return false;
          if (filterDateRange === 'unscheduled' && t.due_date) return false;

          if (searchQ) {
            const hay = `${t.title} ${t.description || ''} ${t.category || ''} ${(t.subtasks || []).map(s => s.title).join(' ')}`.toLowerCase();
            if (!hay.includes(searchQ)) return false;
          }
          return true;
        });

        filteredAll.sort((a, b) => {
          if (sortBy === 'priority') {
            return getPriorityWeight(b.priority) - getPriorityWeight(a.priority) || (a.due_date || '9999-12-31').localeCompare(b.due_date || '9999-12-31');
          }
          if (sortBy === 'created_at') {
            return new Date(b.created_at) - new Date(a.created_at);
          }
          if (sortBy === 'category') {
            return (a.category || 'zzz').localeCompare(b.category || 'zzz') || (a.due_date || '9999-12-31').localeCompare(b.due_date || '9999-12-31');
          }
          return (a.due_date || '9999-12-31').localeCompare(b.due_date || '9999-12-31') || getPriorityWeight(b.priority) - getPriorityWeight(a.priority);
        });

        viewBodyHTML = `
          <div class="tasks-filter-bar">
            <input type="search" id="tasks-search-input" aria-label="Search tasks by title, notes, or subtasks" value="${escapeHtml(window.tasksSearchQuery || '')}" oninput="window.tasksSearchQuery = this.value; renderApp({ isRouteChange: false, preserveScroll: true });" style="flex:1; min-width:180px;" />
            <select aria-label="Filter Status" onchange="window.tasksFilterStatus = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="active" ${filterStatus === 'active' ? 'selected' : ''}>Active Tasks</option>
              <option value="all" ${filterStatus === 'all' ? 'selected' : ''}>All Tasks</option>
              <option value="completed" ${filterStatus === 'completed' ? 'selected' : ''}>Completed Only</option>
            </select>
            <select aria-label="Filter Category" onchange="window.tasksFilterCategory = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="all" ${filterCat === 'all' ? 'selected' : ''}>All Categories</option>
              ${categories.map(c => `<option value="${escapeHtml(c)}" ${filterCat === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
              <option value="__none__" ${filterCat === '__none__' ? 'selected' : ''}>Uncategorized</option>
            </select>
            <select aria-label="Filter Priority" onchange="window.tasksFilterPriority = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="all" ${filterPri === 'all' ? 'selected' : ''}>All Priorities</option>
              <option value="high" ${filterPri === 'high' ? 'selected' : ''}>High</option>
              <option value="medium" ${filterPri === 'medium' ? 'selected' : ''}>Medium</option>
              <option value="low" ${filterPri === 'low' ? 'selected' : ''}>Low</option>
              <option value="none" ${filterPri === 'none' ? 'selected' : ''}>No Priority</option>
            </select>
            <select aria-label="Filter Due Date Range" onchange="window.tasksFilterDateRange = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="all" ${filterDateRange === 'all' ? 'selected' : ''}>Any Due Date</option>
              <option value="overdue" ${filterDateRange === 'overdue' ? 'selected' : ''}>Overdue</option>
              <option value="today" ${filterDateRange === 'today' ? 'selected' : ''}>Due Today</option>
              <option value="next7" ${filterDateRange === 'next7' ? 'selected' : ''}>Next 7 Days</option>
              <option value="month" ${filterDateRange === 'month' ? 'selected' : ''}>This Month</option>
              <option value="unscheduled" ${filterDateRange === 'unscheduled' ? 'selected' : ''}>No Due Date</option>
            </select>
            <select aria-label="Sort Tasks By" onchange="window.tasksSortBy = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="due_date" ${sortBy === 'due_date' ? 'selected' : ''}>Sort: Due Date</option>
              <option value="priority" ${sortBy === 'priority' ? 'selected' : ''}>Sort: Priority</option>
              <option value="created_at" ${sortBy === 'created_at' ? 'selected' : ''}>Sort: Newly Created</option>
              <option value="category" ${sortBy === 'category' ? 'selected' : ''}>Sort: Category</option>
            </select>
          </div>

          <div class="task-group-section">
            <div class="task-group-header">
              <span>Matching Tasks (${filteredAll.length})</span>
              ${(searchQ || filterCat !== 'all' || filterPri !== 'all' || filterDateRange !== 'all' || filterStatus !== 'active') ? `
                <button type="button" class="section-link" onclick="window.resetAllTasksFilters()">Reset Filters</button>
              ` : ''}
            </div>
            ${filteredAll.length > 0 ? `
              <div class="task-list">
                ${filteredAll.map(t => renderTaskRowHTML(t, todayStr)).join('')}
              </div>
            ` : `
              <div class="card" style="text-align:center; padding:2.25rem 1.25rem; border-style:dashed;">
                <div style="font-weight:700; font-size:1.05rem; color:var(--text-white); margin-bottom:0.35rem;">No tasks found.</div>
                <p style="font-size:0.86rem; color:var(--text-muted); margin-bottom:1rem;">Create a new personal task, recurring monthly bill, or work deadline.</p>
                <button type="button" class="btn btn-primary btn-sm" onclick="window.openTaskModal()">+ Add Task</button>
              </div>
            `}
          </div>
        `;
      } else if (subView === 'completed') {
        const compCat = window.tasksCompCategory || 'all';
        const compRange = window.tasksCompRange || 'all';
        const sevenDaysAgoStr = addDays(todayStr, -7);
        const currentMonthPrefix = todayStr.slice(0, 7);

        const filteredComp = completedTasks.filter(t => {
          if (compCat !== 'all' && (t.category || '') !== compCat) return false;
          const compDateStr = t.completed_at ? getLocalDateStr(new Date(t.completed_at)) : (t.due_date || '');
          if (compRange === 'today' && compDateStr !== todayStr) return false;
          if (compRange === '7d' && compDateStr < sevenDaysAgoStr) return false;
          if (compRange === 'month' && !compDateStr.startsWith(currentMonthPrefix)) return false;
          return true;
        });

        viewBodyHTML = `
          <div class="tasks-filter-bar">
            <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Completed History Filters:</span>
            <select aria-label="Completed Category Filter" onchange="window.tasksCompCategory = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="all" ${compCat === 'all' ? 'selected' : ''}>All Categories</option>
              ${categories.map(c => `<option value="${escapeHtml(c)}" ${compCat === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
            </select>
            <select aria-label="Completed Date Filter" onchange="window.tasksCompRange = this.value; renderApp({ isRouteChange: false, preserveScroll: true });">
              <option value="all" ${compRange === 'all' ? 'selected' : ''}>All Time</option>
              <option value="today" ${compRange === 'today' ? 'selected' : ''}>Completed Today</option>
              <option value="7d" ${compRange === '7d' ? 'selected' : ''}>Last 7 Days</option>
              <option value="month" ${compRange === 'month' ? 'selected' : ''}>This Month</option>
            </select>
          </div>

          <div class="task-group-section">
            <div class="task-group-header">
              <span>Completed Tasks (${filteredComp.length})</span>
              <span style="font-size:0.72rem; text-transform:none; color:var(--text-dim);">Uncheck or click Reopen to restore any task</span>
            </div>
            ${filteredComp.length > 0 ? `
              <div class="task-list">
                ${filteredComp.map(t => renderTaskRowHTML(t, todayStr)).join('')}
              </div>
            ` : `
              <div class="card" style="text-align:center; padding:2.25rem 1.25rem; border-style:dashed;">
                <div style="font-weight:700; font-size:1.05rem; color:var(--text-white); margin-bottom:0.35rem;">No completed tasks in this range yet.</div>
                <p style="font-size:0.86rem; color:var(--text-muted);">When you check off tasks or recurring bills, their completion history is preserved here.</p>
              </div>
            `}
          </div>
        `;
      }

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Tasks</h1>
            <p class="page-subtitle">Keep track of your daily responsibilities and everything coming up.</p>
          </div>
          <div style="display:flex; align-items:center; gap:0.55rem; flex-wrap:wrap;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="window.openManageTaskCategoriesModal()">Lists & Categories</button>
          </div>
        </div>

        ${dueReminders.length > 0 ? `
          <div class="card" style="background:rgba(245, 158, 11, 0.1); border-color:rgba(245, 158, 11, 0.35); padding:0.95rem 1.25rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem;">
              <div style="display:flex; align-items:center; gap:0.65rem;">
                <span style="color:var(--color-warning); display:inline-flex;">${SVGs.bell}</span>
                <div>
                  <div style="font-weight:700; font-size:0.9rem; color:var(--text-white);">In-App Reminder${dueReminders.length > 1 ? `s (${dueReminders.length})` : ''}: ${escapeHtml(dueReminders[0].title)}</div>
                  <div style="font-size:0.78rem; color:var(--text-muted);">Scheduled reminder time reached (${dueReminders[0].reminder_at.replace('T', ' ')})</div>
                </div>
              </div>
              <div style="display:flex; gap:0.45rem; flex-wrap:wrap;">
                <button type="button" class="btn btn-primary btn-sm" onclick="window.handleToggleTaskCheckbox(${dueReminders[0].id}, true)">Mark Done</button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="window.handleDismissReminder(${dueReminders[0].id}, 60)">Snooze 1h</button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="window.handleDismissReminder(${dueReminders[0].id}, null)">Dismiss</button>
              </div>
            </div>
          </div>
        ` : ''}

        <div class="tasks-summary-strip">
          <div class="tasks-stat-card">
            <div style="font-size:0.73rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Due Today</div>
            <div style="display:flex; align-items:baseline; justify-content:space-between; margin-top:0.3rem;">
              <span style="font-family:var(--font-display); font-size:1.75rem; font-weight:800; color:var(--text-white); line-height:1;">${dueTodayActive.length}</span>
              <span style="font-size:0.75rem; color:var(--text-dim);">active</span>
            </div>
          </div>
          <div class="tasks-stat-card">
            <div style="font-size:0.73rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Overdue</div>
            <div style="display:flex; align-items:baseline; justify-content:space-between; margin-top:0.3rem;">
              <span style="font-family:var(--font-display); font-size:1.75rem; font-weight:800; color:${overdueTasks.length > 0 ? 'var(--color-danger)' : 'var(--text-white)'}; line-height:1;">${overdueTasks.length}</span>
              <span style="font-size:0.75rem; color:var(--text-dim);">${overdueTasks.length > 0 ? 'needs attention' : 'all clear'}</span>
            </div>
          </div>
          <div class="tasks-stat-card">
            <div style="font-size:0.73rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Completed Today</div>
            <div style="display:flex; align-items:baseline; justify-content:space-between; margin-top:0.3rem;">
              <span style="font-family:var(--font-display); font-size:1.75rem; font-weight:800; color:var(--color-primary); line-height:1;">${completedToday.length} <span style="font-size:0.9rem; font-weight:600; color:var(--text-muted);">/ ${totalTodayPool}</span></span>
              <span style="font-size:0.75rem; color:var(--color-primary); font-weight:700;">${todayProgressPct}%</span>
            </div>
          </div>
          <div class="tasks-stat-card">
            <div style="font-size:0.73rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Recurring Series</div>
            <div style="display:flex; align-items:baseline; justify-content:space-between; margin-top:0.3rem;">
              <span style="font-family:var(--font-display); font-size:1.75rem; font-weight:800; color:var(--text-white); line-height:1;">${activeTasks.filter(t => t.recurrence && t.recurrence.type && t.recurrence.type !== 'none').length}</span>
              <span style="font-size:0.75rem; color:var(--text-dim);">active rules</span>
            </div>
          </div>
        </div>

        <form id="quick-task-form" class="quick-add-bar" onsubmit="event.preventDefault(); window.handleQuickAddTask();">
          <span style="color:var(--color-primary); font-weight:800; font-size:1.1rem; padding-left:0.25rem;">+</span>
          <input type="text" id="qt-title" aria-label="New task title" class="quick-add-input" required />
          <select id="qt-category" aria-label="Quick Task Category" style="width:auto; padding:0.4rem 0.65rem; font-size:0.78rem; border-radius:8px;">
            <option value="">Category (Optional)</option>
            ${categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
          </select>
          <input type="date" id="qt-date" aria-label="Quick Task Due Date" value="${subView === 'calendar' || subView === 'today' ? selectedDate : todayStr}" style="width:auto; padding:0.4rem 0.65rem; font-size:0.78rem; border-radius:8px;" title="Due Date (Optional)" />
          <select id="qt-priority" aria-label="Quick Task Priority" style="width:auto; padding:0.4rem 0.65rem; font-size:0.78rem; border-radius:8px;">
            <option value="none">Priority</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <button type="submit" class="btn btn-primary btn-sm">Add</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="window.openTaskModal(null, document.getElementById('qt-date').value, document.getElementById('qt-title').value)">More Options</button>
        </form>

        <div class="tasks-subnav">
          <div class="tasks-tabs" role="tablist" aria-label="Task Views">
            <button type="button" role="tab" aria-selected="${subView === 'today'}" class="tasks-tab-btn ${subView === 'today' ? 'active' : ''}" onclick="window.setTasksSubView('today')">
              <span>Today</span>
              <span class="tasks-tab-count">${dueTodayActive.length + overdueTasks.length}</span>
            </button>
            <button type="button" role="tab" aria-selected="${subView === 'upcoming'}" class="tasks-tab-btn ${subView === 'upcoming' ? 'active' : ''}" onclick="window.setTasksSubView('upcoming')">
              <span>Upcoming</span>
              <span class="tasks-tab-count">${activeTasks.filter(t => t.due_date && t.due_date > todayStr).length}</span>
            </button>
            <button type="button" role="tab" aria-selected="${subView === 'calendar'}" class="tasks-tab-btn ${subView === 'calendar' ? 'active' : ''}" onclick="window.setTasksSubView('calendar')">
              <span>Calendar</span>
            </button>
            <button type="button" role="tab" aria-selected="${subView === 'all'}" class="tasks-tab-btn ${subView === 'all' ? 'active' : ''}" onclick="window.setTasksSubView('all')">
              <span>All Tasks</span>
              <span class="tasks-tab-count">${activeTasks.length}</span>
            </button>
            <button type="button" role="tab" aria-selected="${subView === 'completed'}" class="tasks-tab-btn ${subView === 'completed' ? 'active' : ''}" onclick="window.setTasksSubView('completed')">
              <span>Completed</span>
              <span class="tasks-tab-count">${completedTasks.length}</span>
            </button>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:1rem;">
          ${viewBodyHTML}
        </div>
      `;
    }

    async function renderAccount(user) {
      const createdAt = new Date(user.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      const targets = await api.getUserTargets();
      return `
        <div class="page-header animate-fade-in">
          <div><h1 class="page-title">Account</h1><p class="page-subtitle">Manage your personal profile and daily fitness targets.</p></div>
        </div>
        <div class="card animate-fade-in" style="animation-delay:0.1s; display:flex; flex-direction:column; align-items:center; text-align:center; padding: 3rem 2rem;">
          <div style="width:110px; height:110px; border-radius:50%; background:var(--bg-input); border:2px solid var(--border-color); display:flex; align-items:center; justify-content:center; margin-bottom:1.25rem; color:var(--color-primary); box-shadow: 0 0 30px var(--color-primary-dim);">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
          <h2 style="font-family:var(--font-display); font-size:1.85rem; font-weight:800; color:var(--text-white); margin-bottom:0.25rem;">${escapeHtml(user.name)}</h2>
          <p style="color:var(--text-muted); margin-bottom:2rem;">Member since ${createdAt}</p>
          <div style="width:100%; max-width:480px; text-align:left; background:var(--bg-input); padding:1.5rem; border-radius:16px; border:1px solid var(--border-color);">
            <div style="margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:0.82rem; color:var(--text-dim); margin-bottom:0.2rem;">Username</div>
                <div style="font-weight:600; font-size:1.05rem;">${escapeHtml(user.name)}</div>
              </div>
              <button class="section-link" onclick="window.openChangeUsernameModal()">Change</button>
            </div>
            <hr style="border:none; border-top:1px solid var(--border-color); margin:0.9rem 0;" />
            <div style="margin-bottom:1rem;"><div style="font-size:0.82rem; color:var(--text-dim); margin-bottom:0.2rem;">Email</div><div style="font-weight:600; font-size:1.05rem;">${escapeHtml(user.email)}</div></div>
            <hr style="border:none; border-top:1px solid var(--border-color); margin:0.9rem 0;" />
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                <span style="font-size:0.82rem; color:var(--text-dim);">Configured Targets</span>
                <button class="section-link" onclick="window.openGoalsModal()">Update</button>
              </div>
              <div style="font-size:0.88rem; color:var(--text-white); line-height:1.6;">
                Steps: <strong>${targets.steps ? targets.steps.toLocaleString() : '10,000'}</strong> &bull;
                Calories: <strong>${targets.calories ? `${targets.calories} kcal` : 'Not set'}</strong> &bull;
                Protein: <strong>${targets.protein ? `${targets.protein}g` : 'Not set'}</strong> &bull;
                Carbs: <strong>${targets.carbs ? `${targets.carbs}g` : 'Not set'}</strong> &bull;
                Fat: <strong>${targets.fat ? `${targets.fat}g` : 'Not set'}</strong> &bull;
                Weekly Workouts: <strong>${targets.weekly_workouts ? `${targets.weekly_workouts}/wk` : 'Not set'}</strong>
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-danger" style="margin-top:1.75rem; width:100%; max-width:480px;" onclick="api.logout().then(() => renderApp({ isRouteChange: true }))">Sign Out of Account</button>
          <div class="legal-links-row" style="margin-top:1.35rem;">
            <button type="button" class="legal-link-btn" onclick="window.navigate('/terms')">Terms & Conditions</button>
            <span>&bull;</span>
            <button type="button" class="legal-link-btn" onclick="window.navigate('/privacy')">Privacy Policy</button>
          </div>
        </div>
      `;
    }

    function getLegalDocumentContentHTML(docType) {
      if (docType === 'privacy') {
        return `
          <div class="legal-doc-section">
            <h4>1. Information We Collect</h4>
            <p>HENCH collects only the information you explicitly provide to operate your fitness, nutrition, and personal task tracking workspace:</p>
            <ul>

          <p>HENCH is a self-directed logging and organization tool and does not provide medical advice, clinical diagnosis, or certified nutritional counseling. Always consult a qualified healthcare professional before beginning a new exercise program or making significant dietary changes.</p>
        </div>
        <div class="legal-doc-section">
          <h4>3. Account Security & Accuracy</h4>
          <p>You are responsible for maintaining the confidentiality of your login credentials and for the accuracy of the workouts, meals, and tasks you record in your account.</p>

          <h4>4. Service Availability</h4>
          <p>HENCH is provided on an "as-is" and "as-available" basis. While we synchronize your data across local browser storage and cloud persistence, we recommend keeping your account credentials secure to prevent unauthorized access.</p>

    async function renderLegalPage(docType) {
      const isPrivacy = docType === 'privacy';
      const title = isPrivacy ? 'Privacy Policy' : 'Terms and Conditions';
      const subtitle = isPrivacy
        ? 'How HENCH collects, stores, and protects your account and activity data.'
        : 'Terms governing your use of the HENCH fitness, nutrition, and task tracking platform.';
      return `
        <div class="page-header animate-fade-in">

            <button type="button" class="btn btn-secondary btn-sm" onclick="window.navigate('${isPrivacy ? '/terms' : '/privacy'}')">View ${isPrivacy ? 'Terms & Conditions' : 'Privacy Policy'}</button>
