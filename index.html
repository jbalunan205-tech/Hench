        </div>
        <div class="card animate-fade-in" style="max-width:820px;">
          ${getLegalDocumentContentHTML(docType)}
        </div>
      `;
    }

    window.openLegalModal = (docType) => {
      const isPrivacy = docType === 'privacy';
      const title = isPrivacy ? 'Privacy Policy' : 'Terms and Conditions';
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="legal-modal-title" onclick="event.stopPropagation()" style="max-width:580px;">
            <h3 class="card-title" id="legal-modal-title" style="margin-top:0; padding-right:2.2rem; font-size:1.3rem; font-family:var(--font-display);">${title}</h3>
            <div style="max-height:60vh; overflow-y:auto; padding-right:0.35rem; margin-bottom:1.25rem;">
              ${getLegalDocumentContentHTML(docType)}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; padding-top:0.85rem; border-top:1px solid var(--border-color);">
              <button type="button" class="section-link" onclick="window.openLegalModal('${isPrivacy ? 'terms' : 'privacy'}')">Switch to ${isPrivacy ? 'Terms & Conditions' : 'Privacy Policy'}</button>
              <button type="button" class="btn btn-primary btn-sm" onclick="closeModal()">Close</button>
            </div>
          </div>
        </div>

    };

    function getAuthFormHTML(mode) {
      if (mode === 'forgot') {
        return `
          <form onsubmit="event.preventDefault(); window.handleResetPassword()">
            <p style="color:var(--text-muted); font-size:0.86rem; margin-bottom:1.25rem; line-height:1.45;">

            <div class="form-group">
              <label for="reset-identifier" style="margin-bottom:0.5rem; display:block;">Email or Username</label>
              <input type="text" id="reset-identifier" autocomplete="username" required />
            </div>
            <div class="form-group">
              <label for="reset-new-password" style="margin-bottom:0.5rem; display:block;">New Password</label>
              <div class="password-field-wrapper">
                <input type="password" id="reset-new-password" autocomplete="new-password" required />
                <button type="button" class="password-eye-btn" aria-label="Show password" aria-pressed="false" onclick="window.togglePasswordVisibility('reset-new-password', this)">

            <div class="form-group">
              <label for="reset-confirm-password" style="margin-bottom:0.5rem; display:block;">Confirm New Password</label>

                <button type="button" class="password-eye-btn" aria-label="Show password" aria-pressed="false" onclick="window.togglePasswordVisibility('reset-confirm-password', this)">
                  ${SVGs.eye}
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:1rem; margin-top:0.5rem; font-size:1rem;">Update Password</button>

            <div style="text-align:center; font-size:0.85rem; color:var(--text-dim); margin-top:1.1rem;">Hench by John Balunan</div>
            <div class="legal-links-row">
              <button type="button" class="legal-link-btn" onclick="window.openLegalModal('terms')">Terms & Conditions</button>
              <span>&bull;</span>
              <button type="button" class="legal-link-btn" onclick="window.openLegalModal('privacy')">Privacy Policy</button>

      const isRegister = mode === true || mode === 'register';
      return `
        <form onsubmit="event.preventDefault(); window.handleAuth(${isRegister})">

            ? `<div class="form-group"><label for="auth-email" style="margin-bottom:0.5rem; display:block;">Email Address</label><input type="email" id="auth-email" autocomplete="email" required /></div>
               <div class="form-group"><label for="auth-username" style="margin-bottom:0.5rem; display:block;">Username</label><input type="text" id="auth-username" autocomplete="username" maxlength="40" required /></div>`
            : `<div class="form-group"><label for="auth-identifier" style="margin-bottom:0.5rem; display:block;">Email or Username</label><input type="text" id="auth-identifier" autocomplete="username" required /></div>`
          }
          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
              <label for="auth-password" style="margin:0;">Password</label>
              ${!isRegister ? `<button type="button" class="forgot-password-link" onclick="window.openForgotPasswordView()">Forgot password?</button>` : ''}
            </div>
            <div class="password-field-wrapper">
              <input type="password" id="auth-password" autocomplete="${isRegister ? 'new-password' : 'current-password'}" required />
              <button type="button" class="password-eye-btn" aria-label="Show password" aria-pressed="false" onclick="window.togglePasswordVisibility('auth-password', this)">
                ${SVGs.eye}
              </button>
            </div>
          </div>
          ${isRegister ? `
            <div class="form-group">
              <label for="auth-confirm" style="margin-bottom:0.5rem; display:block;">Confirm Password</label>
              <div class="password-field-wrapper">
                <input type="password" id="auth-confirm" autocomplete="new-password" required />
                <button type="button" class="password-eye-btn" aria-label="Show password" aria-pressed="false" onclick="window.togglePasswordVisibility('auth-confirm', this)">
                  ${SVGs.eye}
                </button>
              </div>
            </div>
            <div class="auth-consent">
              <input type="checkbox" id="auth-terms-consent" class="custom-checkbox" aria-label="Agree to the Terms and Conditions and Privacy Policy" onchange="window.updateRegisterConsent(this.checked)" />
              <div class="auth-consent-copy">
                I agree to the <button type="button" class="legal-link-btn" onclick="window.openLegalModal('terms')">Terms & Conditions</button> and <button type="button" class="legal-link-btn" onclick="window.openLegalModal('privacy')">Privacy Policy</button>.
              </div>
            </div>
          ` : ''}
          <button type="submit" class="btn btn-primary" ${isRegister ? 'disabled' : ''} style="width:100%; padding:1rem; margin-top:1rem; font-size:1rem;">${isRegister ? 'Create Account' : 'Sign In'}</button>
          <div style="text-align:center; font-size:0.85rem; color:var(--text-dim); margin-top:1.25rem;">Hench by John Balunan</div>
          ${!isRegister ? `<div class="legal-links-row">
            <button type="button" class="legal-link-btn" onclick="window.openLegalModal('terms')">Terms & Conditions</button>
            <span>&bull;</span>
            <button type="button" class="legal-link-btn" onclick="window.openLegalModal('privacy')">Privacy Policy</button>
          </div>` : ''}
        </form>
      `;
    }

    // =========================================================================
    // INTERACTIVE HANDLERS & SYNCHRONIZED MODALS
    // =========================================================================
    window.togglePasswordVisibility = (inputId, btnEl) => {
      const input = document.getElementById(inputId);
      if (!input || !btnEl) return;
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btnEl.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      btnEl.setAttribute('aria-pressed', String(isHidden));
      btnEl.innerHTML = isHidden ? SVGs.eyeOff : SVGs.eye;
      input.focus({ preventScroll: true });
    };

    window.switchAuthTab = (toRegister) => {
      const tabsWrap = document.querySelector('.auth-tabs');
      if (tabsWrap) tabsWrap.style.display = 'flex';
      document.getElementById('auth-dynamic-form').innerHTML = getAuthFormHTML(toRegister);
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById(toRegister ? 'tab-register' : 'tab-login');
      if (activeTab) activeTab.classList.add('active');
    };

    window.updateRegisterConsent = (isAccepted) => {
      const submitBtn = document.querySelector('#auth-dynamic-form button[type="submit"]');
      if (submitBtn) submitBtn.disabled = !isAccepted;
    };

    window.openForgotPasswordView = () => {
      const currentIdentifier = document.getElementById('auth-identifier')?.value || '';
      const tabsWrap = document.querySelector('.auth-tabs');
      if (tabsWrap) tabsWrap.style.display = 'none';
      document.getElementById('auth-dynamic-form').innerHTML = getAuthFormHTML('forgot');
      const resetInput = document.getElementById('reset-identifier');
      if (resetInput && currentIdentifier) resetInput.value = currentIdentifier;
    };

    window.openPasswordRecoveryModal = () => {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="password-recovery-title" onclick="event.stopPropagation()" style="max-width:420px;">
            <div style="width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:var(--color-primary); background:var(--color-primary-dim); border:1px solid rgba(0,229,153,0.35); margin-bottom:1rem;">${SVGs.lock}</div>
            <h3 class="card-title" id="password-recovery-title" style="margin:0 0 0.45rem;">Choose a new password</h3>
            <p style="color:var(--text-muted); font-size:0.85rem; line-height:1.5; margin-bottom:1.25rem;">Your password reset link is verified. Set a new password to finish securing your account.</p>
            <form id="password-recovery-form">
              <div class="form-group"><label for="recovery-new-password">New Password</label><input type="password" id="recovery-new-password" autocomplete="new-password" minlength="6" required /></div>
              <div class="form-group"><label for="recovery-confirm-password">Confirm New Password</label><input type="password" id="recovery-confirm-password" autocomplete="new-password" minlength="6" required /></div>
              <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Save New Password</button>
            </form>
          </div>
        </div>
      `;
      document.getElementById('password-recovery-form').onsubmit = async (event) => {
        event.preventDefault();
        const password = document.getElementById('recovery-new-password').value;
        const confirm = document.getElementById('recovery-confirm-password').value;
        if (password !== confirm) return showToast("Passwords don't match", 'error');
        const submitBtn = document.querySelector('#password-recovery-form button[type="submit"]');
        await withButtonLoading(submitBtn, async () => {
          try {
            await api.resetPassword('', password);
            closeModal();
            showToast('Password updated successfully!');
          } catch (error) {
            showToast(error.message, 'error');
          }
        }, 'Saving...');
      };
    };

    window.handleResetPassword = async () => {
      const identifier = document.getElementById('reset-identifier').value;
      const newPass = document.getElementById('reset-new-password').value;
      const confirmPass = document.getElementById('reset-confirm-password').value;
      const submitBtn = document.querySelector('#auth-dynamic-form button[type="submit"]');

      await withButtonLoading(submitBtn, async () => {
        try {
          if (newPass !== confirmPass) throw new Error("Passwords don't match");
          await api.resetPassword(identifier, newPass);
          showToast('Password updated! You can now sign in.');
          window.switchAuthTab(false);
          const loginInput = document.getElementById('auth-identifier');
          if (loginInput) loginInput.value = identifier;
        } catch (err) {
          showToast(err.message, 'error');
        }
      }, 'Updating...');
    };

    window.handleAuth = async (isRegister) => {
      const p = document.getElementById('auth-password').value;
      const submitBtn = document.querySelector('#auth-dynamic-form button[type="submit"]');
      await withButtonLoading(submitBtn, async () => {
        try {
          if (isRegister) {
            const e = document.getElementById('auth-email').value;
            const username = document.getElementById('auth-username').value;
            if (!document.getElementById('auth-terms-consent')?.checked) throw new Error('Please agree to the Terms & Conditions and Privacy Policy to create an account.');
            if (p !== document.getElementById('auth-confirm').value) throw new Error("Passwords don't match");
            await api.register(e, p, username);
          } else {
            const identifier = document.getElementById('auth-identifier').value;
            await api.login(identifier, p);
          }
          currentPath = '/dashboard';
          window.mobileActiveTab = 'home';
          window.dashboardSelectedDate = getLocalDateStr();
          savePersistedUIState();
          try {
            window.history.replaceState({ path: '/dashboard' }, '', '#/dashboard');
          } catch (e) {
            window.location.hash = '#/dashboard';
          }
          await renderApp({ isRouteChange: true, preserveScroll: false });
        } catch (e) {
          showToast(e.message, 'error');
        }
      }, isRegister ? 'Creating Account...' : 'Signing In...');
    };

    window.setWeeklyChartMetric = (metric) => {
      if (window.weeklyChartMetric === metric) return;
      window.weeklyChartMetric = metric;
      savePersistedUIState();
      renderApp({ isRouteChange: false, preserveScroll: true });
    };

    window.selectDashboardDate = (d) => {
      if (!d) return;
      window.dashboardSelectedDate = d;
      const parsed = parseLocalDate(d);
      window.consistencyYear = parsed.getFullYear();
      window.consistencyHalf = parsed.getMonth() < 6 ? 0 : 1;
      savePersistedUIState();
      renderApp({ isRouteChange: false, preserveScroll: true });
    };

    window.changeConsistencyPeriod = (delta) => {
      const refDateObj = parseLocalDate(window.dashboardSelectedDate || getLocalDateStr());
      let y = window.consistencyYear !== undefined ? window.consistencyYear : refDateObj.getFullYear();
      let h = window.consistencyHalf !== undefined ? window.consistencyHalf : (refDateObj.getMonth() < 6 ? 0 : 1);
      h += delta;
      if (h > 1) { h = 0; y += 1; }
      else if (h < 0) { h = 1; y -= 1; }
      window.consistencyYear = y;
      window.consistencyHalf = h;
      savePersistedUIState();
      renderApp({ isRouteChange: false, preserveScroll: true });
    };

    window.jumpCalendarToMonth = (year, monthIdx) => {
      window.calendarSelectedMonth = new Date(year, monthIdx, 1);
      renderApp({ isRouteChange: false, preserveScroll: true });
    };

    window.viewHalfYearOnDashboard = (year, half) => {
      window.consistencyYear = year;
      window.consistencyHalf = half;
      savePersistedUIState();
      window.navigate('/dashboard');
    };

    window.changeMonth = (dir) => {
      let d = window.calendarSelectedMonth || new Date();
      window.calendarSelectedMonth = new Date(d.getFullYear(), d.getMonth() + dir, 1);
      renderApp({ isRouteChange: false, preserveScroll: true });
    };

    window.openChangeUsernameModal = () => {
      const user = db.getAuthenticatedUser();
      if (!user) return;
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-overlay" onclick="document.getElementById('modal-root').innerHTML = ''">
          <div class="modal-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()" style="max-width:400px;">

                <label for="new-username">Username</label>
                <input type="text" id="new-username" value="${escapeHtml(user.name)}" required />

              <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:1rem;">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal-root').innerHTML = ''">Cancel</button>
                <button type="submit" class="btn btn-primary" id="save-username-btn">Save</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.getElementById('change-username-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('save-username-btn');
        await withButtonLoading(btn, async () => {
          try {
            const newName = document.getElementById('new-username').value;
            await api.updateUsername(newName);
            document.getElementById('modal-root').innerHTML = '';
            showToast('Username updated successfully!');
            renderApp({ isRouteChange: false, preserveScroll: true });
          } catch (err) {
            showToast(err.message, 'error');
          }
        }, 'Saving...');
      };
    };

    window.openGoalsModal = async () => {
      const targets = await api.getUserTargets();
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-overlay" onclick="document.getElementById('modal-root').innerHTML = ''">
          <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="goals-modal-title" onclick="event.stopPropagation()">
            <h3 class="card-title" id="goals-modal-title" style="margin-top:0;">Configure Nutrition & Training Goals</h3>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1.25rem;">Set your personal daily nutrition targets and weekly workout goal. Leave any field blank if you prefer not to track a target for it.</p>

              <div class="form-row">

                  <label for="g-weekly">Weekly Workouts Goal</label>

                </div>
                <div class="form-group">
                  <label for="g-steps">Daily Steps Target</label>
                  <input type="number" id="g-steps" min="0" step="100" value="${targets.steps !== null ? targets.steps : 10000}" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">

                <div class="form-group">
                  <label for="g-carbs">Daily Carbs (g)</label>

                </div>
                <div class="form-group">

                <button type="submit" class="btn btn-primary">Save Targets</button>
              </div>
            </form>
          </div>
        </div>

      document.getElementById('goals-form').onsubmit = async (e) => {

          await api.updateUserTargets({

        }

    window.openQuickScheduleModal = async (defaultDateStr = getLocalDateStr(), prefillTitle = '', prefillDuration = '') => {

      root.innerHTML = `

              <div class="form-row">

          });
          root.innerHTML = '';
          showToast('Meal updated!');
          renderApp();
        } catch (err) {
          showToast(err.message, 'error');

    window.handleDeleteWorkout = (id) => {

    window.openEditWorkoutModal = async (id) => {

    window.handleDeleteRoutine = (id) => showConfirmModal('Delete this routine template? Historical completed workouts will be preserved.', async () => {
      await api.deleteRoutine(id);
      showToast('Routine template deleted.');
      renderApp({ isRouteChange: false, preserveScroll: true });
    }, 'Delete Routine');

    window.updateLoggedExerciseSteps = async (stepInputEl) => {
      const row = stepInputEl.closest('.routine-ex-row');
      if (!row) return;
      const checkbox = row.querySelector('.custom-checkbox');
      if (!checkbox) return;
      const newSteps = parseOptionalNumber(stepInputEl.value);
      checkbox.setAttribute('data-steps', newSteps !== null ? newSteps : '');
      const wId = checkbox.dataset.workoutId ? parseInt(checkbox.dataset.workoutId, 10) : null;
      if (checkbox.checked && wId) {
        const workouts = await api.getWorkouts();
        const w = workouts.find(x => x.id === wId);
        if (w) {
          await api.updateWorkout(wId, {
            name: w.name,
            date: w.date,
            sets: w.sets,
            reps: w.reps,
            weight: w.weight,
            steps: newSteps,
            duration_minutes: w.duration_minutes
          });
          const summarySpan = row.querySelector('.routine-ex-summary');
          if (summarySpan) {
            summarySpan.textContent = formatExerciseCompact({
              name: w.name,
              sets: w.sets,
              reps: w.reps,
              weight: w.weight,
              steps: newSteps
            });
          }
          showToast(`Updated steps for ${w.name}!`);
          await renderApp({ isRouteChange: false, preserveScroll: true, silentBackground: true });
        }
      }
    };

    window.syncOpenEventModalProgressInPlace = async (eventId) => {
      const events = await api.getEvents();
      const evt = events.find(e => e.id === eventId);
      if (!evt) return;
      const routines = await api.getRoutines();
      const workouts = await api.getWorkouts();
      const prog = api.getEventProgress(evt, workouts, routines);

      const headerEl = document.getElementById('evt-routine-progress-header');
      if (headerEl) {
        headerEl.textContent = `Routine Exercises (${prog.done}/${prog.total} Completed)`;
      }

      const badgeEl = document.getElementById('evt-modal-status-badge');
      if (badgeEl) {
        const badgeCls = evt.status === 'cancelled'
          ? 'badge-cancelled'
          : prog.isCompleted
            ? 'badge-completed'
            : prog.isInProgress
              ? 'badge-inprogress'
              : 'badge-scheduled';
        const badgeTxt = evt.status === 'cancelled'
          ? 'Cancelled'
          : prog.isCompleted
            ? 'Completed'
            : prog.isInProgress
              ? 'In Progress'
              : 'Scheduled';
        badgeEl.className = `badge ${badgeCls}`;
        badgeEl.textContent = badgeTxt;
      }

      const completeBtn = document.getElementById('evt-complete-session-btn');
      if (completeBtn) {
        completeBtn.className = `btn ${prog.isCompleted ? 'btn-secondary' : 'btn-primary'}`;
        completeBtn.textContent = prog.isCompleted ? 'Mark Uncompleted' : '✓ Complete Session';
        completeBtn.setAttribute('onclick', `window.handleToggleEventComplete(${evt.id}, ${!prog.isCompleted})`);
      }
    };

    window.toggleRoutineExercise = async (checkbox) => {
      const exName = (checkbox.getAttribute('data-name') || '').trim();
      const exSets = checkbox.getAttribute('data-sets');
      const exReps = checkbox.getAttribute('data-reps');
      const exWeight = checkbox.getAttribute('data-weight');
      const row = checkbox.closest('.routine-ex-row');
      const stepInput = row ? row.querySelector('.routine-ex-step-input') : null;
      const exSteps = stepInput ? stepInput.value : checkbox.getAttribute('data-steps');
      const dateStr = checkbox.getAttribute('data-date') || getLocalDateStr();
      const eventIdAttr = checkbox.getAttribute('data-event-id');
      const routineIdAttr = checkbox.getAttribute('data-routine-id');
      const exIdxAttr = checkbox.getAttribute('data-ex-idx');
      const exIdAttr = checkbox.getAttribute('data-ex-id');
      const durInput = document.getElementById('modal-routine-duration') || document.getElementById('evt-complete-duration');
      const durationMin = durInput && durInput.value ? durInput.value : null;

      checkbox.disabled = true;
      try {
        if (checkbox.checked) {
          const w = await api.createWorkout({
            name: exName,
            sets: exSets,
            reps: exReps,
            weight: exWeight,
            steps: exSteps,
            duration_minutes: durationMin,
            event_id: eventIdAttr ? parseInt(eventIdAttr, 10) : null,
            routine_id: routineIdAttr ? parseInt(routineIdAttr, 10) : null,
            routine_exercise_idx: exIdxAttr !== null && exIdxAttr !== '' ? parseInt(exIdxAttr, 10) : null,
            routine_exercise_id: exIdAttr || null,
            date: dateStr
          });
          checkbox.dataset.workoutId = w.id;
          if (row) row.style.borderColor = 'rgba(0, 229, 153, 0.35)';
          const titleEl = row ? row.querySelector('.routine-ex-title') : checkbox.nextElementSibling;
          if (titleEl) titleEl.style.color = 'var(--color-primary)';
          if (w._stepGoalReached) {
            const target = (await api.getUserTargets()).steps || 10000;
            window.showCelebrationModal("Step Goal Reached!", `Amazing! Logging ${exName} pushed you past your daily goal of ${target.toLocaleString()} steps!`);
          } else {
            showToast(`Logged ${exName}${Number(exSteps) > 0 ? ` (${Number(exSteps).toLocaleString()} steps)` : ''} for ${dateStr}!`);
          }
        } else {
          let targetWorkoutId = checkbox.dataset.workoutId ? parseInt(checkbox.dataset.workoutId, 10) : null;
          if (!targetWorkoutId) {
            const u = db.getAuthenticatedUser();
            if (u) {
              const matched = api.findSessionWorkoutForExercise(
                u.id,
                dateStr,
                eventIdAttr,
                routineIdAttr,
                exIdxAttr,
                exIdAttr,
                exName
              );
              if (matched) targetWorkoutId = matched.id;
            }
          }
          if (targetWorkoutId) {
            await api.deleteWorkout(targetWorkoutId);
          }
          checkbox.dataset.workoutId = '';
          if (row) row.style.borderColor = 'var(--border-color)';
          const titleEl = row ? row.querySelector('.routine-ex-title') : checkbox.nextElementSibling;
          if (titleEl) titleEl.style.color = 'var(--text-white)';
          showToast(`Removed ${exName} from ${dateStr}.`);
        }

        if (eventIdAttr) {
          await window.syncOpenEventModalProgressInPlace(parseInt(eventIdAttr, 10));
        }
        await renderApp({ isRouteChange: false, preserveScroll: true, silentBackground: true });
      } catch (e) {
        showToast(e.message, 'error');
        checkbox.checked = !checkbox.checked;
      } finally {
        if (checkbox && checkbox.isConnected) checkbox.disabled = false;
      }
    };

    function renderChecklistExerciseRowHTML(ex, matchedWorkout, dateStr, eventId = null, routineId = null, exIdx = null) {
      const checked = !!matchedWorkout;
      const wId = matchedWorkout ? matchedWorkout.id : '';
      // A Steps control is only useful when this exercise was explicitly given a step target.
      // Do not infer it from the exercise name: "Decline Bench Crunches" and other
      // non-step exercises must remain compact on every screen size.
      const isStepBased = Number(ex.steps) > 0;
      const currentStepsVal = matchedWorkout && matchedWorkout.steps !== null && matchedWorkout.steps !== undefined
        ? matchedWorkout.steps
        : (ex.steps || '');
      const displayEx = matchedWorkout ? {
        name: matchedWorkout.name,
        sets: matchedWorkout.sets !== null && matchedWorkout.sets !== undefined ? matchedWorkout.sets : ex.sets,
        reps: matchedWorkout.reps !== null && matchedWorkout.reps !== undefined ? matchedWorkout.reps : ex.reps,
        weight: matchedWorkout.weight !== null && matchedWorkout.weight !== undefined ? matchedWorkout.weight : ex.weight,
        steps: currentStepsVal
      } : ex;

      return `
        <div class="routine-ex-row" style="display:flex; align-items:center; justify-content:space-between; gap:0.65rem; padding:0.75rem 0.9rem; background:var(--bg-input); border:1px solid ${checked ? 'rgba(0, 229, 153, 0.35)' : 'var(--border-color)'}; border-radius:12px; transition:var(--transition); flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:0.75rem; cursor:pointer; flex:1; min-width:165px;">
            <input type="checkbox" class="custom-checkbox" ${checked ? 'checked' : ''}
                   data-workout-id="${wId}"
                   ${eventId !== null && eventId !== undefined ? `data-event-id="${eventId}"` : ''}
                   ${routineId !== null && routineId !== undefined ? `data-routine-id="${routineId}"` : ''}
                   ${exIdx !== null && exIdx !== undefined ? `data-ex-idx="${exIdx}"` : ''}
                   ${ex.id ? `data-ex-id="${escapeHtml(ex.id)}"` : ''}
                   data-name="${escapeHtml(ex.name)}"
                   data-sets="${displayEx.sets !== null && displayEx.sets !== undefined ? displayEx.sets : ''}"
                   data-reps="${displayEx.reps !== null && displayEx.reps !== undefined ? displayEx.reps : ''}"
                   data-weight="${displayEx.weight !== null && displayEx.weight !== undefined ? displayEx.weight : ''}"
                   data-steps="${currentStepsVal}"
                   data-date="${dateStr}"
                   onchange="window.toggleRoutineExercise(this)" />
            <div class="routine-ex-title" style="font-weight:600; font-size:0.9rem; transition:color 0.2s; color:${checked ? 'var(--color-primary)' : 'var(--text-white)'}">
              ${escapeHtml(ex.name)}
              <span class="routine-ex-summary" style="font-weight:400; font-size:0.78rem; color:var(--text-muted); margin-left:0.35rem;">${formatExerciseCompact(displayEx)}</span>
            </div>
          </label>
          ${isStepBased ? `
            <div class="routine-ex-steps-control" style="display:flex; align-items:center; gap:0.35rem;" onclick="event.stopPropagation();">
              <span style="font-size:0.72rem; color:var(--text-muted); font-weight:600;">Steps:</span>
              <input type="number" class="routine-ex-step-input" min="0" step="100" value="${currentStepsVal}"
                     aria-label="Steps for ${escapeHtml(ex.name)}"
                     onchange="window.updateLoggedExerciseSteps(this)"
                     style="width:88px !important; padding:0.3rem 0.5rem !important; font-size:0.8rem !important; border-radius:8px !important; text-align:right;" />
            </div>
          ` : ''}
        </div>
      `;
    }

    window.openRoutineModal = async (routine, dateStr) => {
      if (!routine) return;
      const workouts = await api.getWorkouts();
      const dayWorkouts = workouts.filter(w => w.date === dateStr);
      const matchMap = api.matchRoutineExercisesToWorkouts(routine, dayWorkouts, null);

      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="document.getElementById('modal-root').innerHTML = ''">
          <div class="modal-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
            <h3 class="card-title" style="margin-top:0; padding-right:2.2rem; font-size:1.35rem; font-family:var(--font-display);">${escapeHtml(routine.name)}</h3>

            <div class="form-group" style="margin-bottom:1rem;">
              <div class="form-label-wrap"><label for="modal-routine-duration">Duration per Exercise (min)</label><span class="label-optional">(Optional)</span></div>
              <input type="number" id="modal-routine-duration" min="1" />
            </div>
            <div style="display:flex; flex-direction:column; gap:0.55rem;">
              ${routine.exercises && routine.exercises.length ? routine.exercises.map((ex, idx) => {
                const matched = matchMap.get(idx) || null;
                return renderChecklistExerciseRowHTML(ex, matched, dateStr, null, routine.id || null, idx);
              }).join('') : '<p style="color:var(--text-dim)">No exercises added to this split template.</p>'}
            </div>
          </div>
        </div>`;
    };

    window.viewRoutine = async (id) => {

      window.openRoutineModal(r, targetDate);

    window.openEventManageModal = async (eventId) => {
      const events = await api.getEvents();
      const evt = events.find(e => e.id === eventId);
      if (!evt) return;

      const routines = await api.getRoutines();
      const workouts = await api.getWorkouts();
      const prog = api.getEventProgress(evt, workouts, routines);
      const { routine, isCompleted, isInProgress } = prog;
      const dayWorkouts = workouts.filter(w => w.date === evt.date);
      const matchMap = routine ? api.matchRoutineExercisesToWorkouts(routine, dayWorkouts, evt.id) : new Map();

      const badgeCls = evt.status === 'cancelled'
        ? 'badge-cancelled'
        : isCompleted
          ? 'badge-completed'
          : isInProgress
            ? 'badge-inprogress'
            : 'badge-scheduled';
      const badgeTxt = evt.status === 'cancelled'
        ? 'Cancelled'
        : isCompleted
          ? 'Completed'
          : isInProgress
            ? 'In Progress'
            : 'Scheduled';

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-overlay" onclick="document.getElementById('modal-root').innerHTML = ''">
          <div class="modal-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem; margin-bottom:0.4rem; padding-right:2.2rem;">
              <h3 class="card-title" style="margin:0; font-size:1.3rem; font-family:var(--font-display);">${escapeHtml(evt.title)}</h3>
              <span id="evt-modal-status-badge" class="badge ${badgeCls}">${badgeTxt}</span>
            </div>
            <p style="color:var(--text-dim); margin-bottom:1rem; font-size:0.82rem;">
              Scheduled Date: <strong>${evt.date}</strong>${evt.scheduled_time ? ` at <strong>${evt.scheduled_time}</strong>` : ''}${evt.estimated_duration ? ` &bull; Est. ${evt.estimated_duration} min` : ''}
            </p>

            ${evt.status !== 'cancelled' ? `
              ${routine && routine.exercises && routine.exercises.length > 0 ? `
                <div style="margin-bottom:1.1rem;">
                  <div id="evt-routine-progress-header" style="font-size:0.76rem; font-weight:700; color:var(--text-muted); margin-bottom:0.5rem; text-transform:uppercase;">Routine Exercises (${prog.done}/${prog.total} Completed)</div>
                  <div style="display:flex; flex-direction:column; gap:0.5rem;">
                    ${routine.exercises.map((ex, idx) => {
                      const matched = matchMap.get(idx) || null;
                      return renderChecklistExerciseRowHTML(ex, matched, evt.date, evt.id, routine.id || null, idx);
                    }).join('')}
                  </div>
                </div>
              ` : ''}

              <div style="background:var(--bg-input); padding:1rem; border-radius:14px; border:1px solid var(--border-color); margin-bottom:1.15rem;">
                <div class="form-row" style="align-items:flex-end;">
                  <div class="form-group" style="margin-bottom:0; flex:1;">
                    <label for="evt-complete-duration" style="font-size:0.8rem;">Session Duration (min) <span class="label-optional">(Optional)</span></label>
                    <input type="number" id="evt-complete-duration" min="1" value="${evt.estimated_duration || ''}" />
                  </div>
                  <button type="button" id="evt-complete-session-btn" class="btn ${isCompleted ? 'btn-secondary' : 'btn-primary'}" onclick="window.handleToggleEventComplete(${evt.id}, ${!isCompleted})">
                    ${isCompleted ? 'Mark Uncompleted' : '✓ Complete Session'}
                  </button>
                </div>
              </div>
            ` : ''}

            <div style="background:var(--bg-input); padding:1rem; border-radius:14px; border:1px solid var(--border-color); margin-bottom:1.15rem;">

    window.playCelebrationSound = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.09);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + i * 0.09 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.09 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.09);
          osc.stop(ctx.currentTime + i * 0.09 + 0.46);
        });
      } catch (e) {}
    };

      const particles = Array.from({ length: 28 }).map((_, i) => {
        const angle = (i / 28) * Math.PI * 2;
        const dist = 70 + Math.random() * 110;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 20;
        const colors = ['#00e599', '#38bdf8', '#f59e0b', '#a855f7', '#ffffff'];
        const color = colors[i % colors.length];
        return `<span style="position:absolute; left:50%; top:45%; width:7px; height:7px; border-radius:50%; background:${color}; box-shadow:0 0 8px ${color}; pointer-events:none; animation:celebParticle 1.2s cubic-bezier(0.16,1,0.3,1) forwards; --tx:${tx}px; --ty:${ty}px;"></span>`;
      }).join('');

      root.innerHTML = `
        <style>
          @keyframes celebParticle {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
            80% { opacity: 0.95; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
          }
          @keyframes celebFadeInOut {
            0% { opacity: 0; transform: scale(0.92) translateY(10px); }
            12% { opacity: 1; transform: scale(1) translateY(0); }

            ${particles}
            <div style="width:56px; height:56px; margin:0 auto 0.9rem auto; border-radius:50%; background:var(--color-primary-dim); border:1px solid rgba(0,229,153,0.4); display:flex; align-items:center; justify-content:center; color:var(--color-primary);">

        renderApp({ isRouteChange: false, preserveScroll: true });
      } catch (err) {
        showToast(err.message, 'error');

    window.openTaskModal = async (taskId = null, prefillDate = '', prefillTitle = '') => {

      const tasks = await api.getTasks();

      window.tempModalSubtasks = task && Array.isArray(task.subtasks)
        ? task.subtasks.map(s => ({ ...s }))

      const defaultDayNum = initialDueDate ? parseInt(initialDueDate.slice(8, 10), 10) : 1;
      const isEditingRecurring = task && rec.type && rec.type !== 'none';

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-overlay" onclick="document.getElementById('modal-root').innerHTML = ''">
          <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="task-modal-heading" onclick="event.stopPropagation()" style="max-width:560px;">

              <div class="form-row">

                    ${categories.map(c => `<option value="${escapeHtml(c)}" ${task && task.category === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
                  </select>
                </div>
                <div class="form-group">
                  <div class="form-label-wrap"><label for="tm-priority">Priority</label><span class="label-optional">(Optional)</span></div>
                  <select id="tm-priority">
                    <option value="none" ${!task || task.priority === 'none' ? 'selected' : ''}>No Priority</option>
                    <option value="high" ${task && task.priority === 'high' ? 'selected' : ''}>High</option>
                    <option value="medium" ${task && task.priority === 'medium' ? 'selected' : ''}>Medium</option>
                    <option value="low" ${task && task.priority === 'low' ? 'selected' : ''}>Low</option>
                  </select>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <div class="form-label-wrap"><label for="tm-due-date">Due Date</label><span class="label-optional">(Optional)</span></div>

                  <div class="form-label-wrap"><label for="tm-due-time">Due Time</label><span class="label-optional">(Optional)</span></div>

                </div>
              </div>

              <div style="background:var(--bg-input); border:1px solid var(--border-color); border-radius:14px; padding:1rem; margin-bottom:1.1rem;">
                <div class="form-row" style="align-items:flex-end;">
                  <div class="form-group" style="margin-bottom:0; flex:1.5;">
                    <div class="form-label-wrap"><label for="tm-rec-type">Recurrence / Repeat Schedule</label></div>
                    <select id="tm-rec-type" onchange="window.toggleTaskModalRecurrenceFields()">
                      <option value="none" ${rec.type === 'none' ? 'selected' : ''}>Does not repeat</option>
                      <option value="daily" ${rec.type === 'daily' ? 'selected' : ''}>Daily</option>
                      <option value="weekdays" ${rec.type === 'weekdays' ? 'selected' : ''}>Weekdays (Mon–Fri)</option>
                      <option value="weekly" ${rec.type === 'weekly' ? 'selected' : ''}>Weekly</option>
                      <option value="monthly" ${rec.type === 'monthly' ? 'selected' : ''}>Monthly (Bills, Rent, Reports)</option>
                      <option value="yearly" ${rec.type === 'yearly' ? 'selected' : ''}>Yearly</option>
                    </select>
                  </div>
                  <div class="form-group" id="tm-rec-interval-wrap" style="margin-bottom:0; flex:1; display:${rec.type !== 'none' && rec.type !== 'weekdays' ? 'block' : 'none'};">
                    <div class="form-label-wrap"><label for="tm-rec-interval">Repeat Every (Interval)</label></div>
                    <input type="number" id="tm-rec-interval" min="1" max="365" value="${rec.interval || 1}" />
                  </div>

                <div id="tm-monthly-options" style="margin-top:0.85rem; display:${rec.type === 'monthly' ? 'block' : 'none'};">
                  <div class="form-row">
                    <div class="form-group" style="margin-bottom:0; flex:2;">
                      <label for="tm-monthly-rule">Monthly Rule</label>
                      <select id="tm-monthly-rule" onchange="document.getElementById('tm-dom-group').style.display = this.value === 'day_of_month' ? 'block' : 'none';">
                        <option value="day_of_month" ${(!rec.monthly_rule || rec.monthly_rule === 'day_of_month') ? 'selected' : ''}>Fixed day of month (clamps safely in short months)</option>
                        <option value="first_day" ${rec.monthly_rule === 'first_day' ? 'selected' : ''}>First day of every month (1st)</option>
                        <option value="last_day" ${rec.monthly_rule === 'last_day' ? 'selected' : ''}>Last calendar day of every month (28–31)</option>
                        <option value="last_working_day" ${rec.monthly_rule === 'last_working_day' ? 'selected' : ''}>Last working day of every month (Mon–Fri)</option>
                      </select>

                    <div class="form-group" id="tm-dom-group" style="margin-bottom:0; flex:1; display:${(!rec.monthly_rule || rec.monthly_rule === 'day_of_month') ? 'block' : 'none'};">

                      <input type="number" id="tm-day-of-month" min="1" max="31" value="${rec.day_of_month || defaultDayNum}" />

                <div id="tm-rec-bounds" style="margin-top:0.85rem; display:${rec.type !== 'none' ? 'block' : 'none'};">
                  <div class="form-row">
                    <div class="form-group" style="margin-bottom:0;">
                      <label for="tm-rec-end">End Date <span class="label-optional">(Optional)</span></label>
                      <input type="date" id="tm-rec-end" value="${rec.end_date || ''}" />
                    </div>

              <div class="form-group">
                <div class="form-label-wrap"><label for="tm-desc">Notes / Description</label><span class="label-optional">(Optional)</span></div>

                  <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.83rem; color:var(--text-white); margin-bottom:0.3rem; cursor:pointer;">
                    <input type="radio" name="tm-edit-scope" value="series" checked style="width:auto; accent-color:var(--color-primary);" />
                    <span>Entire recurring series</span>
                  </label>
                  <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.83rem; color:var(--text-white); cursor:pointer;">
                    <input type="radio" name="tm-edit-scope" value="occurrence" style="width:auto; accent-color:var(--color-primary);" />
                    <span>Only this occurrence (${prefillDate || task.due_date})</span>
                  </label>
                </div>
              ` : ''}

              <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:1.25rem;">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal-root').innerHTML = ''">Cancel</button>
                <button type="submit" class="btn btn-primary">${task ? 'Save Changes' : 'Create Task'}</button>
              </div>
            </form>
          </div>
        </div>
      `;

      window.renderModalSubtasks();

      document.getElementById('task-modal-form').onsubmit = async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        await withButtonLoading(submitBtn, async () => {
          try {
            const payload = {
              title: document.getElementById('tm-title').value,
              category: document.getElementById('tm-category').value,
              priority: document.getElementById('tm-priority').value,
              due_date: document.getElementById('tm-due-date').value,
              due_time: document.getElementById('tm-due-time').value,
              recurrence_type: document.getElementById('tm-rec-type').value,
              recurrence_interval: document.getElementById('tm-rec-interval').value,
              monthly_rule: document.getElementById('tm-monthly-rule').value,
              day_of_month: document.getElementById('tm-day-of-month').value,
              recurrence_end_date: document.getElementById('tm-rec-end').value,
              description: document.getElementById('tm-desc').value,
              reminder_at: document.getElementById('tm-reminder').value,
              subtasks: window.tempModalSubtasks || []
            };

            if (task) {
              const scopeRadio = document.querySelector('input[name="tm-edit-scope"]:checked');
              const editScope = scopeRadio ? scopeRadio.value : 'series';
              await api.updateTask(task.id, payload, editScope, prefillDate || task.due_date);
              showToast('Task updated!');
            } else {
              await api.createTask(payload);
              showToast('Task created!');
            }
            root.innerHTML = '';
            await renderApp({ isRouteChange: false, preserveScroll: true });
          } catch (err) {
            showToast(err.message, 'error');
          }
        }, 'Saving...');
      };
    };

    window.toggleTaskModalRecurrenceFields = () => {
      const type = document.getElementById('tm-rec-type').value;
      document.getElementById('tm-rec-interval-wrap').style.display = (type !== 'none' && type !== 'weekdays') ? 'block' : 'none';
      document.getElementById('tm-monthly-options').style.display = type === 'monthly' ? 'block' : 'none';
      document.getElementById('tm-rec-bounds').style.display = type !== 'none' ? 'block' : 'none';
    };

    window.renderModalSubtasks = () => {
      const list = document.getElementById('tm-subtasks-list');
      if (!list) return;
      list.innerHTML = (window.tempModalSubtasks || []).map((st, idx) => `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:0.45rem 0.75rem; background:var(--bg-input); border:1px solid var(--border-color); border-radius:9px;">
          <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.84rem; color:var(--text-white); cursor:pointer;">
            <input type="checkbox" ${st.done ? 'checked' : ''} style="width:15px; height:15px; accent-color:var(--color-primary);" onchange="window.tempModalSubtasks[${idx}].done = this.checked;" />
            <span>${escapeHtml(st.title)}</span>
          </label>
          <button type="button" style="background:none; border:none; color:var(--color-danger); cursor:pointer; font-size:1.1rem;" onclick="window.tempModalSubtasks.splice(${idx}, 1); window.renderModalSubtasks();">&times;</button>
        </div>
      `).join('');
    };

    window.addModalSubtask = () => {
      const inp = document.getElementById('tm-new-subtask');
      if (!inp || !inp.value.trim()) return;
      window.tempModalSubtasks = window.tempModalSubtasks || [];
      window.tempModalSubtasks.push({ title: inp.value.trim(), done: false });
      inp.value = '';
      window.renderModalSubtasks();
    };

    // =========================================================================
    // MAIN APPLICATION RENDER LOOP (PERSISTENT SHELL & ZERO-FLICKER UPDATES)
    // =========================================================================
    let isInitialRender = true;
    window.isMobileQuickActionsOpen = false;

    function getMobileActiveTab() {
      if (window.mobileActiveTab === 'notifications' && (currentPath === '/dashboard' || currentPath === '/calendar')) {
        return 'notifications';
      }
      if (currentPath === '/nutrition') return 'food';
      if (currentPath === '/workouts' || currentPath === '/routines') return 'workouts';
      if (currentPath === '/calendar') return 'notifications';
      return 'home';
    }

    function updateMobileDockActiveState() {
      const dock = document.getElementById('mobile-nav-dock');
      if (!dock) return;
      const activeTab = getMobileActiveTab();
      const tabOrder = ['home', 'food', 'workouts', 'notifications'];
      const activeIdx = Math.max(0, tabOrder.indexOf(activeTab));

      const pill = document.getElementById('mobile-dock-active-pill');
      if (pill) {
        pill.style.transform = `translateX(calc(${activeIdx} * 100%))`;
      }

      const buttons = dock.querySelectorAll('.mobile-dock-btn');
      buttons.forEach(btn => {
        const isCurrent = btn.getAttribute('data-dock-tab') === activeTab;
        btn.classList.toggle('active', isCurrent);
        if (isCurrent) {
          btn.setAttribute('aria-current', 'page');
        } else {
          btn.removeAttribute('aria-current');
        }
      });
    }

    window.handleMobileDockNav = async (tab) => {
      window.closeMobileQuickActions();
      window.mobileActiveTab = tab;

      if (tab === 'home') {
        if (currentPath !== '/dashboard') {
          window.navigate('/dashboard', { mobileTab: 'home' });
        } else {
          updateMobileDockActiveState();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } else if (tab === 'food') {
        window.navigate('/nutrition', { mobileTab: 'food' });
      } else if (tab === 'workouts') {
        window.navigate('/workouts', { mobileTab: 'workouts' });
      } else if (tab === 'notifications') {
        if (currentPath !== '/dashboard') {
          currentPath = '/dashboard';
          window.mobileActiveTab = 'notifications';
          savePersistedUIState();
          await renderApp({ isRouteChange: true, preserveScroll: false });
        } else {
          updateMobileDockActiveState();
        }
        requestAnimationFrame(() => {
          const upcomingEl = document.getElementById('upcoming-sessions-card');
          if (upcomingEl) {
            upcomingEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      }
    };

    window.toggleMobileQuickActions = (event) => {
      if (event) event.stopPropagation();
      window.isMobileQuickActionsOpen = !window.isMobileQuickActionsOpen;
      const panel = document.getElementById('mobile-quick-actions-panel');
      const plusBtn = document.getElementById('mobile-dock-plus-btn');
      const backdrop = document.getElementById('mobile-quick-actions-backdrop');
      if (panel) panel.classList.toggle('is-open', window.isMobileQuickActionsOpen);
      if (plusBtn) {
        plusBtn.classList.toggle('is-open', window.isMobileQuickActionsOpen);
        plusBtn.setAttribute('aria-expanded', String(window.isMobileQuickActionsOpen));
      }
      if (backdrop) backdrop.classList.toggle('is-open', window.isMobileQuickActionsOpen);
    };

    window.closeMobileQuickActions = () => {
      if (!window.isMobileQuickActionsOpen) return;
      window.isMobileQuickActionsOpen = false;
      const panel = document.getElementById('mobile-quick-actions-panel');
      const plusBtn = document.getElementById('mobile-dock-plus-btn');
      const backdrop = document.getElementById('mobile-quick-actions-backdrop');
      if (panel) panel.classList.remove('is-open');
      if (plusBtn) {
        plusBtn.classList.remove('is-open');
        plusBtn.setAttribute('aria-expanded', 'false');
      }
      if (backdrop) backdrop.classList.remove('is-open');
    };

    window.handleMobileQuickAction = async (actionType) => {
      window.closeMobileQuickActions();
      if (actionType === 'routine') {
        if (currentPath !== '/routines') {
          window.navigate('/routines', { mobileTab: 'workouts' });
        }
        setTimeout(() => {
          const inp = document.getElementById('r-name');
          if (inp) {
            inp.scrollIntoView({ behavior: 'smooth', block: 'center' });
            inp.focus();
          }
        }, 100);
      } else if (actionType === 'task') {
        window.navigate('/tasks');
        setTimeout(() => {
          const inp = document.getElementById('qt-title');
          if (inp) {
            inp.scrollIntoView({ behavior: 'smooth', block: 'center' });
            inp.focus();
          }
        }, 120);
      } else if (actionType === 'goals') {
        if (typeof window.openGoalsModal === 'function') {
          window.openGoalsModal();
        }
      } else if (actionType === 'calendar') {
        window.navigate('/calendar', { mobileTab: 'notifications' });
      } else if (actionType === 'account') {
        window.navigate('/account');
      }
    };

    document.addEventListener('click', (e) => {
      if (!window.isMobileQuickActionsOpen) return;
      const dock = document.getElementById('mobile-nav-dock');
      if (dock && !dock.contains(e.target)) {
        window.closeMobileQuickActions();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.isMobileQuickActionsOpen) {
          window.closeMobileQuickActions();
        }
        const modalRoot = document.getElementById('modal-root');
        if (modalRoot && modalRoot.innerHTML.trim() !== '') {
          closeModal();
        }
      }

                  </div>
                  <button onclick="api.logout().then(() => renderApp({ isRouteChange: true }))" style="background:rgba(239, 68, 68, 0.1); border:1px solid rgba(239, 68, 68, 0.2); color:var(--color-danger); padding:0.4rem 0.75rem; border-radius:8px; font-size:0.8rem; font-weight:700; cursor:pointer; transition:var(--transition);" onmouseover="this.style.background='var(--color-danger)'; this.style.color='white'" onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'; this.style.color='var(--color-danger)'">

                  <button type="button" class="legal-link-btn" style="padding:0;" onclick="window.navigate('/privacy')">Privacy</button>

                </button>

                  <span class="mobile-quick-action-title">Set a Goal and Target</span>
                </button>
                <button type="button" class="mobile-quick-action-card" role="menuitem" onclick="window.handleMobileQuickAction('calendar')">
                  <span class="mobile-quick-action-title">Calendar</span>
                </button>
                <button type="button" class="mobile-quick-action-card" role="menuitem" onclick="window.handleMobileQuickAction('account')">
                  <span class="mobile-quick-action-title">Account</span>
                </button>

                <div id="mobile-dock-active-pill" class="mobile-dock-active-pill" aria-hidden="true"></div>

                  ${LucideDockIcons.House}
                </button>
                <button type="button" class="mobile-dock-btn" data-dock-tab="food" aria-label="Food (Nutrition)" onclick="window.handleMobileDockNav('food')">
                  ${LucideDockIcons.Ham}
                </button>
                <button type="button" class="mobile-dock-btn" data-dock-tab="workouts" aria-label="Workouts" onclick="window.handleMobileDockNav('workouts')">
                  ${LucideDockIcons.Dumbbell}
                </button>
                <button type="button" class="mobile-dock-btn" data-dock-tab="notifications" aria-label="Notifications (Upcoming Sessions)" onclick="window.handleMobileDockNav('notifications')">
                  ${LucideDockIcons.BellRing}
                </button>
              </div>

              <button type="button" id="mobile-dock-plus-btn" class="mobile-dock-plus-btn" aria-label="Quick Actions" aria-expanded="false" aria-controls="mobile-quick-actions-panel" onclick="window.toggleMobileQuickActions(event)">
                <span class="mobile-dock-plus-icon">${LucideDockIcons.Plus}</span>
                <span class="mobile-dock-close-icon">${LucideDockIcons.X}</span>
              </button>
            </nav>
          </div>
        `;
      } else {
        const links = shell.querySelectorAll('#sidebar-nav-links .nav-link');
        links.forEach(link => {
          const route = link.getAttribute('data-route');
          link.classList.toggle('active', route === currentPath);
          if (route === currentPath) {
            link.setAttribute('aria-current', 'page');
          } else {
            link.removeAttribute('aria-current');
          }
        });
        const nameEl = shell.querySelector('#sidebar-user-firstname');
        if (nameEl) nameEl.textContent = user.name.split(' ')[0];
      }

      updateMobileDockActiveState();
      return document.getElementById('main-content');
    }

    async function renderApp(options = { isRouteChange: false, preserveScroll: true }) {
      const user = db.getAuthenticatedUser();
      const app = document.getElementById('app');

      if (!user) {
        isInitialRender = false;
        const logoSrc = window._henchTransparentLogoUrl || HENCH_LOGO_ASSET;
        app.innerHTML = `
          <div class="auth-container">
            <div class="auth-card">
              <div class="auth-logo-wrap">
                <img src="${logoSrc}" alt="Hench" class="auth-brand-logo" onerror="if(window._henchTransparentLogoUrl && this.src !== window._henchTransparentLogoUrl){this.src = window._henchTransparentLogoUrl;}" />
              </div>
              <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="window.switchAuthTab(false)">Log In</div>
                <div class="auth-tab" id="tab-register" onclick="window.switchAuthTab(true)">Register</div>
              </div>
              <div id="auth-dynamic-form">${getAuthFormHTML(false)}</div>
            </div>
          </div>
        `;
        return;
      }

      const savedScrollY = window.scrollY || 0;
      const navItems = ['Dashboard', 'Nutrition', 'Workouts', 'Routines', 'Calendar', 'Tasks', 'Account'];
      const mainEl = ensurePersistentShell(app, user, navItems);

      if (options.isRouteChange && viewCache[currentPath] && !mainEl.innerHTML) {
        mainEl.innerHTML = viewCache[currentPath];
      }

      if (!options.silentBackground) {
        startSubtleLoading();
        mainEl.setAttribute('aria-busy', 'true');
      }

      try {
        let contentHTML = '';
        if (currentPath === '/dashboard') contentHTML = await renderDashboard(user);
        else if (currentPath === '/nutrition') contentHTML = await renderNutrition();
        else if (currentPath === '/workouts') contentHTML = await renderWorkouts();
        else if (currentPath === '/routines') contentHTML = await renderRoutines();
        else if (currentPath === '/calendar') contentHTML = await renderCalendar();
        else if (currentPath === '/tasks') contentHTML = await renderTasks(user);
        else if (currentPath === '/account') contentHTML = await renderAccount(user);
        else if (currentPath === '/terms') contentHTML = await renderLegalPage('terms');
        else if (currentPath === '/privacy') contentHTML = await renderLegalPage('privacy');
        else contentHTML = await renderDashboard(user);

        viewCache[currentPath] = contentHTML;
        mainEl.innerHTML = contentHTML;

        if (options.isRouteChange && !isInitialRender && !options.silentBackground) {
          mainEl.classList.remove('route-transitioning');
          void mainEl.offsetWidth;
          mainEl.classList.add('route-transitioning');
        } else {
          mainEl.classList.remove('route-transitioning');
        }
      } catch (err) {
        console.error('Error rendering view:', err);
        showToast('Could not refresh view data. Showing last available state.', 'error');
      } finally {
        if (!options.silentBackground) {
          mainEl.removeAttribute('aria-busy');
          finishSubtleLoading();
        }
        isInitialRender = false;
      }

      if (!options.silentBackground) {
        if (options.preserveScroll && (!options.isRouteChange || routeDirtyState[currentPath])) {
          const targetY = options.isRouteChange ? (routeScrollPositions[currentPath] || 0) : savedScrollY;
          window.scrollTo(0, targetY);
        } else if (!options.isRouteChange && routeScrollPositions[currentPath] !== undefined) {
          window.scrollTo(0, savedScrollY);
        } else {
          window.scrollTo(0, 0);
        }
      }

      restoreCurrentRouteFormDraft(currentPath);
      const mainInputs = mainEl.querySelectorAll('input:not([type="date"]):not([type="checkbox"]):not([type="radio"]), textarea');
      mainInputs.forEach(inp => {
        inp.addEventListener('input', () => {
          captureCurrentRouteFormDraft(currentPath);
          routeScrollPositions[currentPath] = window.scrollY || 0;
        });
      });

      if (currentPath === '/dashboard') {
        requestAnimationFrame(() => scrollMobileHeatmapToActiveMonth());
      }

      window.showWelcomeModalIfNeeded();

      if (currentPath === '/nutrition') {
        const mealForm = document.getElementById('meal-form');
        if (mealForm) mealForm.onsubmit = async (e) => {
          e.preventDefault();
          const submitBtn = mealForm.querySelector('button[type="submit"]');
          await withButtonLoading(submitBtn, async () => {
            try {
              const mealDate = document.getElementById('m-date').value;
              await api.createMeal({
                name: document.getElementById('m-name').value,
                servings: document.getElementById('m-servings').value,
                date: mealDate,
                calories: document.getElementById('m-cals').value,
                protein: document.getElementById('m-pro').value,
                carbs: document.getElementById('m-carbs').value,
                fat: document.getElementById('m-fat').value
              });
              clearRouteFormDraft('/nutrition');
              window.dashboardSelectedDate = mealDate;
              savePersistedUIState();
              showToast('Meal saved & overview synced!');
              await renderApp({ isRouteChange: false, preserveScroll: true });
            } catch (err) {
              showToast(err.message, 'error');
            }
          }, 'Saving Meal...');
        };
      }

      if (currentPath === '/workouts') {
        const workoutForm = document.getElementById('workout-form');
        if (workoutForm) workoutForm.onsubmit = async (e) => {
          e.preventDefault();
          const submitBtn = workoutForm.querySelector('button[type="submit"]');
          await withButtonLoading(submitBtn, async () => {
            try {
              const wDate = window.dashboardSelectedDate || getLocalDateStr();
              const w = await api.createWorkout({
                name: document.getElementById('w-name').value,
                date: wDate,
                sets: document.getElementById('w-sets').value,
                reps: document.getElementById('w-reps').value,
                weight: document.getElementById('w-weight').value,
                steps: document.getElementById('w-steps').value,
                duration_minutes: document.getElementById('w-duration').value
              });
              clearRouteFormDraft('/workouts');
              window.selectDashboardDate(wDate);
              if (w._stepGoalReached) {
                const target = (await api.getUserTargets()).steps || 10000;
                window.showCelebrationModal("Workout & Step Goal Reached!", `Awesome session! Logging those steps also pushed you past your ${target.toLocaleString()} daily step goal!`);
              } else {
                window.showCelebrationModal("Workout Logged!", "Great job getting your session in today!");
              }
            } catch (err) {
              showToast(err.message, 'error');
            }
          }, 'Saving Workout...');
        };
      }

      if (currentPath === '/routines') {
        const routineForm = document.getElementById('routine-form');
        if (routineForm) routineForm.onsubmit = async (e) => {
          e.preventDefault();
          const submitBtn = routineForm.querySelector('button[type="submit"]');
          await withButtonLoading(submitBtn, async () => {
            try {
              await api.createRoutine({
                name: document.getElementById('r-name').value,
                estimated_duration: document.getElementById('r-est-duration').value,
                exercises: window.tempRoutineExercises
              });
              showToast('Routine split saved!');
              window.tempRoutineExercises = [];
              await renderApp({ isRouteChange: false, preserveScroll: true });
            } catch (err) {
              showToast(err.message, 'error');
            }
          }, 'Saving Split...');
        };
      }

      if (currentPath === '/calendar') {
        const calForm = document.getElementById('calendar-event-form');
        if (calForm) calForm.onsubmit = async (e) => {
          e.preventDefault();
          const submitBtn = calForm.querySelector('button[type="submit"]');
          await withButtonLoading(submitBtn, async () => {
            try {
              const customTitle = document.getElementById('ce-custom').value.trim();
              const selectTitle = document.getElementById('ce-title').value;
              const finalTitle = customTitle || selectTitle;
              const evtDate = document.getElementById('ce-date').value;
              await api.createEvent({
                title: finalTitle,
                date: evtDate,
                scheduled_time: document.getElementById('ce-time').value,
                estimated_duration: document.getElementById('ce-duration').value
              });
              window.selectDashboardDate(evtDate);
              showToast('Session scheduled & calendar synced!');
            } catch (err) {
              showToast(err.message, 'error');
            }
          }, 'Scheduling...');
        };
      }
    }

    renderApp({ isRouteChange: false, preserveScroll: false });
  </script>
<script>
// Supabase authentication and cross-device data sync.
(async () => {
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const cloud = createClient('https://cpxdahjmqqsafhtwjqhf.supabase.co', 'sb_publishable_mMBZAy4F_3Nt7n3HaLEDrA_NqISlft1');
  const authRedirectUrl = `${window.location.origin}${window.location.pathname}`;
  let cloudUser = null;
  const localSave = db.save.bind(db);
  let pendingCloudSave = Promise.resolve();

  async function syncCloudState() {
    if (!cloudUser) return;
    pendingCloudSave = pendingCloudSave.catch(() => undefined).then(() =>
      cloud.from('hench_user_data').upsert({
        user_id: cloudUser.id,
        state: db.state,
        updated_at: new Date().toISOString()
      })
    );
    const { error } = await pendingCloudSave;
    if (error) {
      console.error('Cloud sync failed:', error);
      throw error;
    }
  }

  db.getAuthenticatedUser = () => cloudUser;
  db.save = () => {
    localSave();
    if (!cloudUser) return;
    syncCloudState().catch(error => console.error('Cloud sync failed:', error));
  };

  async function loadCloudState(session) {
    const user = session.user;
    const { data, error } = await cloud.from('hench_user_data').select('state').eq('user_id', user.id).maybeSingle();
    if (error) throw error;
    
    let savedUser = null;
    if (data?.state) {
      db.state = { ...defaultDbState(), ...data.state };
      savedUser = db.state.users?.find(u => String(u.id) === String(user.id)) || db.state.users?.[0];
    } else {
      db.state = defaultDbState();
      db.state.users = []; db.state.sessions = []; db.state.meals = []; db.state.workouts = [];
      db.state.routines = []; db.state.events = []; db.state.tasks = [];
    }

    cloudUser = {
      id: user.id,
      name: savedUser?.name || user.user_metadata?.name || user.email.split('@')[0],
      email: user.email,
      created_at: user.created_at,
      targets: savedUser?.targets || { calories: null, protein: null, carbs: null, fat: null, weekly_workouts: null, steps: 10000 },
      task_categories: savedUser?.task_categories || [...DEFAULT_TASK_CATEGORIES],
      show_welcome: savedUser?.show_welcome ?? user.user_metadata?.show_welcome ?? false
    };

    db.state.users = [cloudUser];
    db.state.sessions = [{ id: 1, user_id: user.id, token: 'cloud' }];
    localStorage.setItem('hench_session', 'cloud');
    localSave();
    if (!data?.state) db.save();
  }

  api.login = async (identifier, password) => {
    const cleanId = (identifier || '').trim();
    let loginEmail = cleanId;

    // If the input doesn't look like an email, try resolving it as a username locally
    if (!cleanId.includes('@')) {
      const localUser = (db.state.users || []).find(u => u.name.toLowerCase() === cleanId.toLowerCase());
      if (localUser && localUser.email) {
        loginEmail = localUser.email;
      } else {
        throw new Error("Username not recognized on this device. Please sign in with your email address.");
      }
    }

    const { data, error } = await cloud.auth.signInWithPassword({ email: loginEmail, password });
    if (error) throw new Error("Invalid login credentials.");
    await loadCloudState(data.session);
    return { success: true };
  };
  api.register = async (email, password, username) => {
    const cleanEmail = (email || '').trim();
    const cleanName = (username || '').trim();
    if (!cleanEmail.includes('@')) throw new Error('Please register with an email address.');
    if (!cleanName) throw new Error('A username is required.');
    if (!password || password.length < 6) throw new Error('Password must be at least 6 characters.');
    const { data, error } = await cloud.auth.signUp({ email: cleanEmail, password, options: { emailRedirectTo: authRedirectUrl, data: { name: cleanName, show_welcome: true } } });
    if (error) throw error;
    if (!data.session) throw new Error('Check your email to confirm your account, then log in.');
    await loadCloudState(data.session);
    return { success: true };
  };
  api.resetPassword = async (identifier, newPassword) => {
    const cleanId = (identifier || '').trim();
    if (!cleanId) throw new Error('Please enter your registered email or username.');
    if (!newPassword || newPassword.length < 6) {
      throw new Error('New password must be at least 6 characters.');
    }
    let targetEmail = cleanId;
    if (!cleanId.includes('@')) {
      const localUser = (db.state.users || []).find(u => u.name.toLowerCase() === cleanId.toLowerCase());
      if (localUser && localUser.email) {
        targetEmail = localUser.email;
      } else {
        throw new Error('Please enter your registered email address to reset your password.');
      }
    }
    const { data: sessionData } = await cloud.auth.getSession();
    if (sessionData?.session) {
      const { error } = await cloud.auth.updateUser({ password: newPassword });
      if (error) throw error;
      return true;
    }
    const { error } = await cloud.auth.resetPasswordForEmail(targetEmail, { redirectTo: authRedirectUrl });
    if (error) throw error;
    throw new Error('Password recovery link sent to your email address. Follow the link to complete your reset.');
  };
  api.logout = async () => {
    await syncCloudState().catch(error => console.error('Final cloud sync failed:', error));
    await cloud.auth.signOut();
    cloudUser = null;
    localStorage.removeItem('hench_session');
    currentPath = '/dashboard';
    renderApp({ isRouteChange: true, preserveScroll: false });
  };

  cloud.auth.onAuthStateChange((event, session) => {
    if (event !== 'PASSWORD_RECOVERY' || !session) return;
    setTimeout(() => {
      loadCloudState(session)
        .then(() => renderApp({ isRouteChange: true, preserveScroll: false }))
        .then(() => window.openPasswordRecoveryModal())
        .catch(error => console.error('Password recovery setup failed:', error));
    }, 0);
  });

  const { data: { session } } = await cloud.auth.getSession();
  if (session) {
    await loadCloudState(session);
    renderApp({ isRouteChange: false, preserveScroll: false });
  }
})().catch(error => console.error('Cloud startup failed:', error));
</script>
<script>
  // Keeps the app shell available after the first successful visit, including on spotty connections.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .catch(error => console.warn('Service worker registration failed:', error));
    });
  }
</script>
