        if (!u) throw new Error('Unauthorized');
        const name = (data.name || '').trim();
        if (!name) throw new Error('Routine Name is required');
        const routineId = db.state.nextIds.routine++;
        const routine = {
          id: routineId,
          user_id: u.id,
          name,
          estimated_duration: parseOptionalNumber(data.estimated_duration),
          exercises: Array.isArray(data.exercises) ? data.exercises.map((ex, idx) => ({
            ...ex,
            id: ex.id || `rex_${routineId}_${idx}_${Math.random().toString(36).slice(2, 7)}`
          })) : [],
          created_at: new Date().toISOString()
        };
        db.state.routines.unshift(routine);
        db.save();
        return routine;
      },

      async deleteRoutine(id) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        db.state.routines = db.state.routines.filter(r => !(r.id === id && r.user_id === u.id));
        db.save();
      },

      async updateRoutine(id, data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const r = db.state.routines.find(x => x.id === id && x.user_id === u.id);
        if (!r) throw new Error('Routine not found');
        if (data.name !== undefined) r.name = data.name.trim();
        if (data.estimated_duration !== undefined) r.estimated_duration = parseOptionalNumber(data.estimated_duration);
        if (data.exercises !== undefined) {
          r.exercises = data.exercises.map((ex, idx) => ({
            ...ex,
            id: ex.id || `rex_${r.id}_${idx}_${Math.random().toString(36).slice(2, 7)}`
          }));
        }
        db.save();
        return r;
      },

      async getEvents() {
        const u = db.getAuthenticatedUser();
        if (!u) return [];
        return db.state.events
          .filter(e => e.user_id === u.id)
          .sort((a, b) => a.date.localeCompare(b.date) || (a.scheduled_time || '').localeCompare(b.scheduled_time || ''));
      },

      async createEvent(data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const title = (data.title || '').trim();
        if (!title || !data.date) throw new Error('Routine/Session title and date are required');

        const existingDuplicate = db.state.events.find(
          e => e.user_id === u.id && e.date === data.date && e.title.toLowerCase() === title.toLowerCase() && e.status !== 'cancelled'
        );
        if (existingDuplicate) {
          throw new Error(`"${title}" is already scheduled on ${data.date}.`);
        }

        const evt = {
          id: db.state.nextIds.event++,
          user_id: u.id,
          title,
          date: data.date,
          scheduled_time: data.scheduled_time || null,
          estimated_duration: parseOptionalNumber(data.estimated_duration),
          status: 'scheduled',
          completed_workout_id: null,
          created_at: new Date().toISOString()
        };
        db.state.events.push(evt);
        this.syncEventsWithWorkouts(u.id, data.date);
        db.save();
        return evt;
      },

      async updateEvent(id, updates) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const evt = db.state.events.find(e => e.id === id && e.user_id === u.id);
        if (!evt) throw new Error('Scheduled session not found');
        const oldDate = evt.date;
        if (updates.date) evt.date = updates.date;
        if (updates.title) evt.title = updates.title.trim();
        if (updates.scheduled_time !== undefined) evt.scheduled_time = updates.scheduled_time || null;
        if (updates.estimated_duration !== undefined) evt.estimated_duration = parseOptionalNumber(updates.estimated_duration);
        if (updates.status) evt.status = updates.status;

        this.syncEventsWithWorkouts(u.id, oldDate);
        this.syncEventsWithWorkouts(u.id, evt.date);
        db.save();
        return evt;
      },

      async startEventWorkout(eventId) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const evt = db.state.events.find(e => e.id === eventId && e.user_id === u.id);
        if (!evt) throw new Error('Scheduled session not found');
        if (evt.status === 'scheduled') {
          evt.status = 'in_progress';
          db.save();
        }
        return evt;
      },

      async toggleEventCompletion(eventId, markComplete, durationMinutes = null) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const evt = db.state.events.find(e => e.id === eventId && e.user_id === u.id);
        if (!evt) throw new Error('Scheduled session not found');

        const norm = s => String(s || '').trim().toLowerCase();
        const routine = db.state.routines.find(r => r.user_id === u.id && norm(r.name) === norm(evt.title));
        const resolvedDuration = parseOptionalNumber(durationMinutes) || evt.estimated_duration || null;

        if (markComplete) {
          if (routine && routine.exercises && routine.exercises.length > 0) {
            // Routine is the source of truth: ONLY finalize exercises that were actually checked off.
            // Never auto-insert unchecked exercises from the routine into the Workout Log.
            const sessionWorkouts = db.state.workouts.filter(w => {
              if (w.user_id !== u.id || w.date !== evt.date) return false;
              if (Number(w.event_id) === Number(evt.id)) return true;
              if (w.event_id === null && Number(w.routine_id) === Number(routine.id)) return true;
              return false;
            });

            if (sessionWorkouts.length === 0) {
              throw new Error('Please check off at least one completed exercise before completing this routine session.');
            }

            // Link any checked exercises on this date/routine to this session event & apply session duration if not already set
            sessionWorkouts.forEach((w, idx) => {
              if (!w.event_id) w.event_id = evt.id;
              if (!w.routine_id) w.routine_id = routine.id;
              if (idx === 0 && resolvedDuration !== null && (w.duration_minutes === null || w.duration_minutes === undefined)) {
                w.duration_minutes = resolvedDuration;
              }
            });

            evt.status = 'completed';
            evt.manual_completed = true;
          } else {
            // Standalone custom session without a routine template: avoid duplicate creation if already logged
            evt.status = 'completed';
            evt.manual_completed = true;
            const existingStandalone = db.state.workouts.find(w =>
              w.user_id === u.id &&
              w.date === evt.date &&
              (Number(w.event_id) === Number(evt.id) || (evt.completed_workout_id && w.id === evt.completed_workout_id))
            );
            if (existingStandalone) {
              if (resolvedDuration !== null) existingStandalone.duration_minutes = resolvedDuration;
              evt.completed_workout_id = existingStandalone.id;
            } else {
              const w = {
                id: db.state.nextIds.workout++,
                user_id: u.id,
                name: evt.title,
                sets: null,
                reps: null,
                weight: null,
                steps: null,
                duration_minutes: resolvedDuration,
                event_id: evt.id,
                routine_id: null,
                routine_exercise_idx: null,
                routine_exercise_id: null,
                completed: true,
                date: evt.date,
                created_at: new Date().toISOString()
              };
              db.state.workouts.unshift(w);
              evt.completed_workout_id = w.id;
            }
          }
        } else {
          evt.manual_completed = false;
          if (routine && routine.exercises && routine.exercises.length > 0) {
            const sessionWorkouts = db.state.workouts.filter(w =>
              w.user_id === u.id && w.date === evt.date && (Number(w.event_id) === Number(evt.id) || (w.event_id === null && Number(w.routine_id) === Number(routine.id)))
            );
            evt.status = sessionWorkouts.length > 0 ? 'in_progress' : 'scheduled';
          } else {
            evt.status = 'scheduled';
            if (evt.completed_workout_id) {
              const removedW = db.state.workouts.find(w => w.id === evt.completed_workout_id && w.user_id === u.id);
              if (removedW && Number(removedW.steps) > 0) {
                await this.adjustStepsDelta(evt.date, -Number(removedW.steps));
              }
              db.state.workouts = db.state.workouts.filter(w => !(w.id === evt.completed_workout_id && w.user_id === u.id));
              evt.completed_workout_id = null;
            }
          }
        }
        db.save();
      },

      async deleteEvent(id) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        db.state.events = db.state.events.filter(e => !(e.id === id && e.user_id === u.id));
        db.save();
      },

      matchRoutineExercisesToWorkouts(routine, dayWorkouts, eventId = null) {
        const matches = new Map();
        if (!routine || !Array.isArray(routine.exercises)) return matches;
        const usedIds = new Set();
        const norm = s => String(s || '').trim().toLowerCase();
        const parsedEvtId = parseOptionalNumber(eventId);

        const sessionWorkouts = dayWorkouts.filter(w => {
          if (parsedEvtId !== null) {
            return Number(w.event_id) === parsedEvtId || (w.event_id === null && (Number(w.routine_id) === Number(routine.id) || w.routine_id === null || w.routine_id === undefined));
          }
          return Number(w.routine_id) === Number(routine.id) || w.routine_id === null || w.routine_id === undefined;
        });

        // Pass 1: Match by explicit routine_exercise_id or routine_exercise_idx
        routine.exercises.forEach((ex, idx) => {
          const found = sessionWorkouts.find(w => {
            if (usedIds.has(w.id)) return false;
            if (ex.id && w.routine_exercise_id && w.routine_exercise_id === ex.id) return true;
            if (w.routine_exercise_idx !== undefined && w.routine_exercise_idx !== null && Number(w.routine_exercise_idx) === idx && norm(w.name) === norm(ex.name)) return true;
            return false;
          });
          if (found) {
            usedIds.add(found.id);
            matches.set(idx, found);
          }
        });

        // Pass 2: Fallback for legacy workouts without index/id
        routine.exercises.forEach((ex, idx) => {
          if (matches.has(idx)) return;
          const found = sessionWorkouts.find(w => {
            if (usedIds.has(w.id)) return false;
            if (w.routine_exercise_idx !== undefined && w.routine_exercise_idx !== null) return false;
            return norm(w.name) === norm(ex.name);
          });
          if (found) {
            usedIds.add(found.id);
            matches.set(idx, found);
          }
        });

        return matches;
      },

      syncEventsWithWorkouts(userId, dateStr) {
        if (!dateStr) return;
        const norm = s => String(s || '').trim().toLowerCase();
        const dayWorkouts = db.state.workouts.filter(w => w.user_id === userId && w.date === dateStr);
        const dayEvents = db.state.events.filter(e => e.user_id === userId && e.date === dateStr && e.status !== 'cancelled');

        dayEvents.forEach(evt => {
          const routine = db.state.routines.find(r => r.user_id === userId && norm(r.name) === norm(evt.title));
          if (routine && routine.exercises && routine.exercises.length > 0) {
            const matchMap = this.matchRoutineExercisesToWorkouts(routine, dayWorkouts, evt.id);
            const completedCount = matchMap.size;
            if (completedCount === routine.exercises.length && routine.exercises.length > 0) {
              evt.status = 'completed';
            } else if (completedCount > 0) {
              if (evt.manual_completed) {
                evt.status = 'completed';
              } else {
                evt.status = 'in_progress';
              }
            } else {
              evt.manual_completed = false;
              if (evt.status === 'completed' || evt.status === 'in_progress') {
                evt.status = 'scheduled';
              }
            }
          } else if (evt.completed_workout_id) {
            const stillExists = dayWorkouts.some(dw => dw.id === evt.completed_workout_id);
            evt.status = stillExists ? 'completed' : 'scheduled';
          } else {
            const matchingName = dayWorkouts.some(dw => Number(dw.event_id) === Number(evt.id) || norm(dw.name) === norm(evt.title));
            if (matchingName) evt.status = 'completed';
          }
        });
      },

      isEventCompleted(evt, userWorkouts, userRoutines) {
        if (!evt || evt.status === 'cancelled') return false;
        const norm = s => String(s || '').trim().toLowerCase();
        const dayWorkouts = userWorkouts.filter(w => w.date === evt.date);
        const routine = userRoutines.find(r => norm(r.name) === norm(evt.title));
        if (routine && routine.exercises && routine.exercises.length > 0) {
          const matchMap = this.matchRoutineExercisesToWorkouts(routine, dayWorkouts, evt.id);
          if (evt.status === 'completed' && matchMap.size > 0) return true;
          return matchMap.size === routine.exercises.length && routine.exercises.length > 0;
        }
        if (evt.status === 'completed') return true;
        return dayWorkouts.some(dw => Number(dw.event_id) === Number(evt.id) || norm(dw.name) === norm(evt.title));
      },

      getEventProgress(evt, userWorkouts, userRoutines) {
        const norm = s => String(s || '').trim().toLowerCase();
        const dayWorkouts = userWorkouts.filter(w => w.date === evt.date);
        const routine = userRoutines.find(r => norm(r.name) === norm(evt.title));
        if (routine && routine.exercises && routine.exercises.length > 0) {
          const total = routine.exercises.length;
          const matchMap = this.matchRoutineExercisesToWorkouts(routine, dayWorkouts, evt.id);
          const done = matchMap.size;
          const isCompleted = (done === total && total > 0) || (evt.status === 'completed' && done > 0);
          return {
            hasRoutine: true,
            routine,
            done,
            total,
            isCompleted,
            isInProgress: !isCompleted && (done > 0 || evt.status === 'in_progress')
          };
        }
        const isCompleted = this.isEventCompleted(evt, userWorkouts, userRoutines);
        return { hasRoutine: false, routine: null, done: isCompleted ? 1 : 0, total: 1, isCompleted, isInProgress: evt.status === 'in_progress' && !isCompleted };
      },

      async getDashboardStats(selectedDateStr) {
        const todayStr = getLocalDateStr();
        const targetDate = selectedDateStr || todayStr;
        const u = db.getAuthenticatedUser();

        const targets = await this.getUserTargets();
        const allMeals = await this.getMeals();
        const allWorkouts = await this.getWorkouts();
        const allRoutines = await this.getRoutines();
        const allEvents = await this.getEvents();
        const allTasks = await this.getTasks();

        const stepLog = (db.state.steps_log || []).find(s => s.user_id === u?.id && s.date === targetDate);
        const dailySteps = stepLog ? stepLog.count : 0;

        const dayMeals = allMeals.filter(m => m.date === targetDate);
        const calcMacroCard = (field, unit, targetVal) => {
          const hasTarget = targetVal !== null && targetVal !== undefined && Number(targetVal) > 0;
          if (dayMeals.length === 0) {
            return {
              consumed: null,
              consumedDisplay: '0',
              target: hasTarget ? Number(targetVal) : null,
              unit,
              pct: 0,
              isOver: false,
              isExactMatch: false,
              statusLine: hasTarget ? `${Number(targetVal).toLocaleString()} ${unit} remaining` : 'No meals logged yet',
              emptyNote: 'No meals logged for this date',
              hasTarget,
              hasData: false
            };
          }

          let sum = 0, known = 0, missing = 0;
          dayMeals.forEach(m => {
            const mult = Number(m.servings) > 0 ? Number(m.servings) : 1;
            if (m[field] !== null && m[field] !== undefined && !Number.isNaN(Number(m[field]))) {
              sum += Number(m[field]) * mult;
              known++;
            } else {
              missing++;
            }
          });

          if (known === 0) {
            return {
              consumed: null,
              consumedDisplay: '--',
              target: hasTarget ? Number(targetVal) : null,
              unit,
              pct: 0,
              isOver: false,
              isExactMatch: false,
              statusLine: `Macro not specified in ${dayMeals.length} logged meal${dayMeals.length > 1 ? 's' : ''}`,
              emptyNote: 'Edit meal to add macro details',
              hasTarget,
              hasData: false
            };
          }

          const rounded = field === 'calories' ? Math.round(sum) : Math.round(sum * 10) / 10;
          const consumedDisplay = rounded.toLocaleString();
          let pct = 0;
          let isOver = false;
          let isExactMatch = false;
          let statusLine = '';

          if (hasTarget) {
            const tNum = Number(targetVal);
            pct = Math.round((rounded / tNum) * 100);
            const diff = Math.round((tNum - rounded) * 10) / 10;
            if (diff > 0) {
              isOver = false;
              isExactMatch = false;
              statusLine = `${diff.toLocaleString()} ${unit} remaining`;
            } else if (diff === 0) {
              isOver = false;
              isExactMatch = true;
              statusLine = `Goal reached`;
            } else {
              isOver = true;
              isExactMatch = false;
              statusLine = `${Math.abs(diff).toLocaleString()} ${unit} over target`;
            }
          } else {
            statusLine = missing > 0
              ? `Partial (${known}/${dayMeals.length} meals with data)`
              : `From ${known} logged meal${known > 1 ? 's' : ''}`;
          }

          return {
            consumed: rounded,
            consumedDisplay,
            target: hasTarget ? Number(targetVal) : null,
            unit,
            pct,
            isOver,
            isExactMatch,
            statusLine,
            emptyNote: missing > 0 ? `${missing} meal(s) missing ${field}` : '',
            hasTarget,
            hasData: true
          };
        };

        const macros = {
          c: calcMacroCard('calories', 'kcal', targets.calories),
          p: calcMacroCard('protein', 'g', targets.protein),
          cb: calcMacroCard('carbs', 'g', targets.carbs),
          f: calcMacroCard('fat', 'g', targets.fat),
          mealCount: dayMeals.length
        };

        const mondayStr = getMondayOfWeek(targetDate);
        const sundayStr = addDays(mondayStr, 6);
        const prevMondayStr = addDays(mondayStr, -7);
        const weekLabels = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
        const activeMetric = window.weeklyChartMetric || 'workouts';

        const weekDaysData = [];
        let thisWeekWorkoutsCount = 0;
        let thisWeekTotalMin = 0;
        let thisWeekTotalVolume = 0;

        for (let i = 0; i < 7; i++) {
          const dStr = addDays(mondayStr, i);
          const dw = allWorkouts.filter(w => w.date === dStr);
          const count = dw.length;
          const mins = dw.reduce((acc, w) => acc + (Number(w.duration_minutes) || 0), 0);
          const vol = dw.reduce((acc, w) => acc + ((Number(w.sets) || 0) * (Number(w.reps) || 0) * (Number(w.weight) || 0)), 0);

          thisWeekWorkoutsCount += count;
          thisWeekTotalMin += mins;
          thisWeekTotalVolume += vol;

          weekDaysData.push({
            dayLabel: weekLabels[i],
            dateStr: dStr,
            shortDate: dStr.slice(5),
            workouts: count,
            duration: mins,
            volume: Math.round(vol)
          });
        }

        let prevWeekWorkoutsCount = 0;
        let prevWeekTotalMin = 0;
        let prevWeekTotalVolume = 0;
        for (let i = 0; i < 7; i++) {
          const dStr = addDays(prevMondayStr, i);
          const dw = allWorkouts.filter(w => w.date === dStr);
          prevWeekWorkoutsCount += dw.length;
          prevWeekTotalMin += dw.reduce((acc, w) => acc + (Number(w.duration_minutes) || 0), 0);
          prevWeekTotalVolume += dw.reduce((acc, w) => acc + ((Number(w.sets) || 0) * (Number(w.reps) || 0) * (Number(w.weight) || 0)), 0);
        }

        let comparisonText = 'No prior week data for comparison';
        let comparisonBadge = '--';
        if (activeMetric === 'duration') {
          if (prevWeekTotalMin > 0) {
            const pct = Math.round(((thisWeekTotalMin - prevWeekTotalMin) / prevWeekTotalMin) * 100);
            comparisonBadge = `${pct >= 0 ? '+' : ''}${pct}%`;
            comparisonText = `${Math.abs(pct)}% ${pct >= 0 ? 'more' : 'less'} training time than last week (${prevWeekTotalMin} min)`;
          } else if (thisWeekTotalMin > 0) {
            comparisonBadge = `${thisWeekTotalMin} min`;
            comparisonText = `${thisWeekTotalMin} min trained this week (0 min last week)`;
          }
        } else if (activeMetric === 'volume') {
          if (prevWeekTotalVolume > 0) {
            const pct = Math.round(((thisWeekTotalVolume - prevWeekTotalVolume) / prevWeekTotalVolume) * 100);
            comparisonBadge = `${pct >= 0 ? '+' : ''}${pct}%`;
            comparisonText = `${Math.abs(pct)}% ${pct >= 0 ? 'more' : 'less'} volume than last week (${prevWeekTotalVolume.toLocaleString()} lbs)`;
          } else if (thisWeekTotalVolume > 0) {
            comparisonBadge = `${thisWeekTotalVolume.toLocaleString()} lbs`;
            comparisonText = `${thisWeekTotalVolume.toLocaleString()} lbs lifted this week`;
          }
        } else {
          if (prevWeekWorkoutsCount > 0) {
            const pct = Math.round(((thisWeekWorkoutsCount - prevWeekWorkoutsCount) / prevWeekWorkoutsCount) * 100);
            comparisonBadge = `${pct >= 0 ? '+' : ''}${pct}%`;
            const diff = thisWeekWorkoutsCount - prevWeekWorkoutsCount;
            comparisonText = diff === 0
              ? `Same number of workouts as last week (${prevWeekWorkoutsCount})`
              : `${Math.abs(diff)} ${diff > 0 ? 'more' : 'fewer'} workout${Math.abs(diff) === 1 ? '' : 's'} than last week`;
          } else if (thisWeekWorkoutsCount > 0) {
            comparisonBadge = `${thisWeekWorkoutsCount} done`;
            comparisonText = `${thisWeekWorkoutsCount} workout${thisWeekWorkoutsCount === 1 ? '' : 's'} completed this week`;
          }
        }

        const unitMap = { workouts: '', duration: ' min', volume: ' lbs' };
        const chartVals = weekDaysData.map(d => d[activeMetric]);
        const maxVal = Math.max(...chartVals, 0);
        const yTop = maxVal === 0 ? (activeMetric === 'workouts' ? 4 : activeMetric === 'duration' ? 60 : 1000) : Math.ceil(maxVal * 1.15);

        const svgPoints = weekDaysData.map((d, i) => {
          const val = d[activeMetric];
          const x = 30 + (i * 90);
          const y = maxVal === 0 ? 132 : Math.round(132 - ((val / yTop) * 112));
          return { ...d, x, y, val, unit: unitMap[activeMetric] };
        });

        const pathD = `M ${svgPoints.map(p => `${p.x},${p.y}`).join(' L ')}`;
        const areaD = `${pathD} L ${svgPoints[6].x},135 L ${svgPoints[0].x},135 Z`;

        const activeDatesSet = new Set(allWorkouts.map(w => w.date).filter(Boolean));
        const sortedActiveDates = Array.from(activeDatesSet).sort();

        let longestStreak = 0;
        let tempStreak = 0;
        let prevDateStr = null;
        sortedActiveDates.forEach(dStr => {
          if (!prevDateStr) {
            tempStreak = 1;
          } else {
            const nextExpected = addDays(prevDateStr, 1);
            if (dStr === nextExpected) tempStreak++;
            else tempStreak = 1;
          }
          if (tempStreak > longestStreak) longestStreak = tempStreak;
          prevDateStr = dStr;
        });

        let currentStreak = 0;
        const yesterdayStr = addDays(todayStr, -1);
        let checkCursor = null;
        if (activeDatesSet.has(todayStr)) {
          checkCursor = todayStr;
        } else if (activeDatesSet.has(yesterdayStr)) {
          checkCursor = yesterdayStr;
        }
        while (checkCursor && activeDatesSet.has(checkCursor)) {
          currentStreak++;
          checkCursor = addDays(checkCursor, -1);
        }

        const refDateObj = parseLocalDate(targetDate);
        const defaultYear = refDateObj.getFullYear();
        const defaultHalf = refDateObj.getMonth() < 6 ? 0 : 1;

        const hmYear = window.consistencyYear !== undefined ? window.consistencyYear : defaultYear;
        const hmHalf = window.consistencyHalf !== undefined ? window.consistencyHalf : defaultHalf;

        const shortMonths = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const startMonthIdx = hmHalf === 0 ? 0 : 6;
        const endMonthIdx = startMonthIdx + 5;
        const periodLabel = `${shortMonths[startMonthIdx]} – ${shortMonths[endMonthIdx]} ${hmYear}`;

        const monthBlocksHtml = [];
        for (let mIdx = startMonthIdx; mIdx <= endMonthIdx; mIdx++) {
          const daysInThisMonth = new Date(hmYear, mIdx + 1, 0).getDate();
          const cellsHtml = [];

          for (let dayNum = 1; dayNum <= daysInThisMonth; dayNum++) {
            const cellDateStr = `${hmYear}-${String(mIdx + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
            const cellWorkouts = allWorkouts.filter(w => w.date === cellDateStr);
            const count = cellWorkouts.length;
            const totalMin = cellWorkouts.reduce((acc, w) => acc + (Number(w.duration_minutes) || 0), 0);
            const isFuture = cellDateStr > todayStr;
            const isSelected = cellDateStr === targetDate;

            let cellClass = 'hm-cell ';
            let statusDesc = '';
            if (count >= 2 || totalMin >= 45) {
              cellClass += 'hm-active-2';
              statusDesc = `${count} workouts completed${totalMin > 0 ? ` (${totalMin} min)` : ''}`;
            } else if (count === 1) {
              cellClass += 'hm-active-1';
              statusDesc = `1 workout completed${totalMin > 0 ? ` (${totalMin} min)` : ''}`;
            } else if (isFuture) {
              cellClass += 'hm-future';
              statusDesc = 'Future date (upcoming)';
            } else {
              cellClass += 'hm-past-empty';
              statusDesc = 'No workout recorded';
            }
            if (isSelected) cellClass += ' hm-selected';

            cellsHtml.push(
              `<div class="${cellClass}" tabindex="0" role="button" aria-label="${shortMonths[mIdx]} ${dayNum}, ${hmYear}: ${statusDesc}" style="cursor:pointer;" onclick="window.selectDashboardDate('${cellDateStr}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.selectDashboardDate('${cellDateStr}');}" title="${shortMonths[mIdx]} ${dayNum}, ${hmYear} (${cellDateStr}): ${statusDesc}"></div>`
            );
          }

          monthBlocksHtml.push(`
            <div class="hm-month-block" data-month-idx="${mIdx}">
              <div class="hm-month-label">${shortMonths[mIdx]}</div>
              <div class="hm-month-grid">
                ${cellsHtml.join('')}
              </div>
            </div>
          `);
        }

        const currentMonthPrefix = todayStr.slice(0, 7);
        const computeMonthConsistency = (monthPrefix, isCurrentMonth) => {
          const eligible = allEvents.filter(e => {
            if (!e.date || !e.date.startsWith(monthPrefix)) return false;
            if (e.status === 'cancelled') return false;
            if (isCurrentMonth && e.date > todayStr) return false;
            return true;
          });
          if (eligible.length === 0) return { pct: null, completed: 0, eligible: 0 };
          let completed = 0;
          eligible.forEach(evt => {
            if (this.isEventCompleted(evt, allWorkouts, allRoutines)) completed++;
          });
          return {
            pct: Math.round((completed / eligible.length) * 100),
            completed,
            eligible: eligible.length
          };
        };

        const thisMonthStats = computeMonthConsistency(currentMonthPrefix, true);

        const historicalMonthPrefixes = Array.from(
          new Set(
            allEvents
              .filter(e => e.date && e.status !== 'cancelled' && e.date.slice(0, 7) < currentMonthPrefix)
              .map(e => e.date.slice(0, 7))
          )
        );

        let bestMonthPct = null;
        let bestMonthLabel = 'NO PRIOR MONTHS';
        historicalMonthPrefixes.forEach(mPref => {
          const res = computeMonthConsistency(mPref, false);
          if (res.pct !== null && (bestMonthPct === null || res.pct > bestMonthPct)) {
            bestMonthPct = res.pct;
            bestMonthLabel = `${mPref} (${res.completed}/${res.eligible})`;
          }
        });

        const selectedDateWorkouts = allWorkouts.filter(w => w.date === targetDate);
        const selectedDateDuration = selectedDateWorkouts.reduce((s, w) => s + (Number(w.duration_minutes) || 0), 0);
        const selectedDateEvents = allEvents.filter(e => e.date === targetDate && e.status !== 'cancelled');

        const upcomingSessions = allEvents
          .filter(e => e.date >= todayStr && e.status !== 'cancelled' && !this.isEventCompleted(e, allWorkouts, allRoutines))
          .sort((a, b) => a.date.localeCompare(b.date) || (a.scheduled_time || '').localeCompare(b.scheduled_time || ''))
          .slice(0, 5);

        const recentWorkouts = allWorkouts.slice(0, 6);

        // The dashboard is deliberately a "today" view. Past-due one-time tasks
        // carry forward visually each day until completed, while recurring tasks
        // contribute only their occurrence for today.
        const activeTasks = allTasks.filter(task => task.status === 'active');
        const isRecurringTask = task => task.recurrence && task.recurrence.type && task.recurrence.type !== 'none';
        const carriedForwardTasks = activeTasks
          .filter(task => task.due_date && task.due_date < todayStr && !isRecurringTask(task))
          .map(task => ({ ...task, is_dashboard_carryover: true }));
        const dueTodayTasks = activeTasks.filter(task => task.due_date === todayStr);
        const todayTaskIds = new Set(dueTodayTasks.map(task => task.id));
        const recurringTodayTasks = this.projectRecurringInstancesForRange(activeTasks, todayStr, todayStr)
          .filter(task => !todayTaskIds.has(task.source_task_id || task.id));
        const dashboardTasks = [...carriedForwardTasks, ...dueTodayTasks, ...recurringTodayTasks]
          .sort((a, b) => Number(!!b.is_dashboard_carryover) - Number(!!a.is_dashboard_carryover)
            || getPriorityWeight(b.priority) - getPriorityWeight(a.priority)
            || String(a.title || '').localeCompare(String(b.title || '')))
          .slice(0, 5);

        return {
          todayStr,
          targetDate,
          targets,
          steps: { count: dailySteps, target: targets.steps || 10000 },
          macros,
          allEvents,
          allRoutines,
          allWorkouts,
          allTasks,
          selectedDateWorkouts,
          selectedDateDuration,
          selectedDateEvents,
          upcomingSessions,
          recentWorkouts,
          dashboardTasks,
          weekly: {
            mondayStr,
            sundayStr,
            activeMetric,
            thisWeekWorkoutsCount,
            thisWeekTotalMin,
            thisWeekTotalVolume: Math.round(thisWeekTotalVolume),
            weeklyGoal: targets.weekly_workouts,
            comparisonBadge,
            comparisonText,
            yTop,
            svgPoints,
            pathD,
            areaD
          },
          streaks: {
            current: currentStreak,
            longest: longestStreak,
            totalActiveDays: sortedActiveDates.length
          },
          heatmap: {
            html: monthBlocksHtml.join(''),
            periodLabel,
            hmYear,
            hmHalf,
            thisMonthDisplay: thisMonthStats.pct !== null ? `${thisMonthStats.pct}%` : '--',
            thisMonthSub: thisMonthStats.pct !== null ? `${thisMonthStats.completed}/${thisMonthStats.eligible} SESSIONS` : 'NO DUE SESSIONS',
            bestMonthDisplay: bestMonthPct !== null ? `${bestMonthPct}%` : '--',
            bestMonthSub: bestMonthLabel
          }
        };
      },

      // =======================================================================
      // PERSONAL TASKS & RECURRENCE ENGINE
      // =======================================================================
      async getTaskCategories() {
        const u = db.getAuthenticatedUser();
        if (!u) return [...DEFAULT_TASK_CATEGORIES];
        if (!Array.isArray(u.task_categories) || u.task_categories.length === 0) {

      },

      async renameTaskCategory(oldName, newName) {

      async deleteTaskCategory(name) {

          if (t.user_id === u.id && t.category === name) {
            t.category = '';
          }
        });
        db.save();
        return u.task_categories;
      },

      getMonthlyDateForRule(year, monthIdx0, monthlyRule, preferredDay) {
        const daysInMonth = new Date(year, monthIdx0 + 1, 0).getDate();
        if (monthlyRule === 'first_day') {
          return `${year}-${String(monthIdx0 + 1).padStart(2, '0')}-01`;
        }
        if (monthlyRule === 'last_day') {
          return `${year}-${String(monthIdx0 + 1).padStart(2, '0')}-${String(daysInMonth).padStart(2, '0')}`;
        }
        if (monthlyRule === 'last_working_day') {
          let d = new Date(year, monthIdx0, daysInMonth);
          while (d.getDay() === 0 || d.getDay() === 6) {
            d.setDate(d.getDate() - 1);
          }
          return getLocalDateStr(d);
        }
        const targetDay = Math.min(Math.max(1, Number(preferredDay) || 1), daysInMonth);
        return `${year}-${String(monthIdx0 + 1).padStart(2, '0')}-${String(targetDay).padStart(2, '0')}`;
      },

      computeNextOccurrenceDate(baseDateStr, recurrence) {
        if (!recurrence || !recurrence.type || recurrence.type === 'none') return null;
        const base = parseLocalDate(baseDateStr || getLocalDateStr());
        const interval = Math.max(1, parseInt(recurrence.interval, 10) || 1);
        const type = recurrence.type;

        if (type === 'daily') {
          base.setDate(base.getDate() + interval);
          return getLocalDateStr(base);
        }
        if (type === 'weekdays') {
          do {
            base.setDate(base.getDate() + 1);
          } while (base.getDay() === 0 || base.getDay() === 6);
          return getLocalDateStr(base);
        }
        if (type === 'weekly') {
          base.setDate(base.getDate() + (7 * interval));
          return getLocalDateStr(base);
        }
        if (type === 'monthly') {
          const targetMonthDate = new Date(base.getFullYear(), base.getMonth() + interval, 1);
          const rule = recurrence.monthly_rule || 'day_of_month';
          const dayNum = recurrence.day_of_month || base.getDate();
          return this.getMonthlyDateForRule(targetMonthDate.getFullYear(), targetMonthDate.getMonth(), rule, dayNum);
        }
        if (type === 'yearly') {
          const targetYear = base.getFullYear() + interval;
          const monthIdx0 = base.getMonth();
          const daysInTargetMonth = new Date(targetYear, monthIdx0 + 1, 0).getDate();
          const dayNum = Math.min(base.getDate(), daysInTargetMonth);
          return `${targetYear}-${String(monthIdx0 + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
        }
        return null;
      },

      formatRecurrenceLabel(recurrence, dueDateStr) {
        if (!recurrence || !recurrence.type || recurrence.type === 'none') return '';
        const interval = Math.max(1, parseInt(recurrence.interval, 10) || 1);
        const type = recurrence.type;
        if (type === 'daily') return interval === 1 ? 'Daily' : `Every ${interval} days`;
        if (type === 'weekdays') return 'Weekdays (Mon–Fri)';
        if (type === 'weekly') return interval === 1 ? 'Weekly' : `Every ${interval} weeks`;
        if (type === 'monthly') {
          const prefix = interval === 1 ? 'Monthly' : `Every ${interval} months`;
          if (recurrence.monthly_rule === 'first_day') return `${prefix} on the 1st`;
          if (recurrence.monthly_rule === 'last_day') return `${prefix} on last day`;
          if (recurrence.monthly_rule === 'last_working_day') return `${prefix} on last working day`;
          const dNum = recurrence.day_of_month || (dueDateStr ? parseInt(dueDateStr.slice(8, 10), 10) : 1);
          const suffix = (dNum % 10 === 1 && dNum !== 11) ? 'st' : (dNum % 10 === 2 && dNum !== 12) ? 'nd' : (dNum % 10 === 3 && dNum !== 13) ? 'rd' : 'th';
          return `${prefix} on the ${dNum}${suffix}`;
        }
        if (type === 'yearly') return interval === 1 ? 'Yearly' : `Every ${interval} years`;
        return 'Recurring';
      },

      projectRecurringInstancesForRange(tasks, startStr, endStr) {
        const projected = [];
        const activeRecurring = tasks.filter(t => t.status === 'active' && t.due_date && t.recurrence && t.recurrence.type && t.recurrence.type !== 'none');

        activeRecurring.forEach(task => {
          const skipped = new Set(Array.isArray(task.skipped_dates) ? task.skipped_dates : []);
          const endDateLimit = task.recurrence.end_date || '9999-12-31';
          let cursor = task.due_date;
          let safety = 0;

          while (cursor && cursor <= endStr && cursor <= endDateLimit && safety < 500) {
            safety++;
            if (cursor > task.due_date && cursor >= startStr && !skipped.has(cursor)) {
              projected.push({
                ...task,
                due_date: cursor,
                is_projected_occurrence: true,
                source_task_id: task.id
              });
            }
            const next = this.computeNextOccurrenceDate(cursor, task.recurrence);
            if (!next || next <= cursor) break;
            cursor = next;
          }
        });

        return projected;
      },

      async getTasks() {
        const u = db.getAuthenticatedUser();
        if (!u) return [];
        return db.state.tasks.filter(t => t.user_id === u.id);
      },

      async createTask(data) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const title = (data.title || '').trim();
        if (!title) throw new Error('Task title is required');

        const recType = data.recurrence_type || 'none';
        let dueDate = data.due_date ? data.due_date.trim() : null;
        if (recType !== 'none' && !dueDate) {
          dueDate = getLocalDateStr();
        }

        const recurrence = recType === 'none' ? { type: 'none' } : {
          type: recType,
          interval: Math.max(1, parseInt(data.recurrence_interval, 10) || 1),
          monthly_rule: data.monthly_rule || 'day_of_month',
          day_of_month: parseOptionalNumber(data.day_of_month) || (dueDate ? parseInt(dueDate.slice(8, 10), 10) : 1),
          start_date: data.recurrence_start_date || dueDate || getLocalDateStr(),
          end_date: data.recurrence_end_date || null
        };

        if (recType === 'monthly' && dueDate && (recurrence.monthly_rule === 'first_day' || recurrence.monthly_rule === 'last_day' || recurrence.monthly_rule === 'last_working_day')) {
          const parsed = parseLocalDate(dueDate);
          dueDate = this.getMonthlyDateForRule(parsed.getFullYear(), parsed.getMonth(), recurrence.monthly_rule, recurrence.day_of_month);
        }

        const nowIso = new Date().toISOString();
        const task = {
          id: db.state.nextIds.task++,
          user_id: u.id,
          title,
          description: (data.description || '').trim(),
          category: (data.category || '').trim(),
          due_date: dueDate || null,
          due_time: data.due_time ? data.due_time.trim() : null,
          priority: data.priority || 'none',
          status: 'active',
          completed_at: null,
          recurrence,
          skipped_dates: [],
          series_id: null,
          reminder_at: data.reminder_at ? data.reminder_at.trim() : null,
          reminder_dismissed: false,
          subtasks: Array.isArray(data.subtasks) ? data.subtasks.map(s => ({ ...s })) : [],
          created_at: nowIso,
          updated_at: nowIso
        };

        db.state.tasks.unshift(task);
        db.save();
        return task;
      },

      async updateTask(id, data, editScope = 'series', occurrenceDate = null) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const task = db.state.tasks.find(t => t.id === id && t.user_id === u.id);
        if (!task) throw new Error('Task not found');

        const title = (data.title !== undefined ? data.title : task.title).trim();
        if (!title) throw new Error('Task title is required');

        const isRecurring = task.recurrence && task.recurrence.type && task.recurrence.type !== 'none';

        if (isRecurring && editScope === 'occurrence') {
          const targetOccDate = occurrenceDate || task.due_date;
          if (targetOccDate === task.due_date) {
            const nextDue = this.computeNextOccurrenceDate(task.due_date, task.recurrence);
            if (nextDue && (!task.recurrence.end_date || nextDue <= task.recurrence.end_date)) {
              task.due_date = nextDue;
            } else {
              if (!Array.isArray(task.skipped_dates)) task.skipped_dates = [];
              task.skipped_dates.push(targetOccDate);
            }
          } else if (targetOccDate) {
            if (!Array.isArray(task.skipped_dates)) task.skipped_dates = [];
            if (!task.skipped_dates.includes(targetOccDate)) task.skipped_dates.push(targetOccDate);
          }
          task.updated_at = new Date().toISOString();

          const detached = await this.createTask({
            title,
            description: data.description !== undefined ? data.description : task.description,
            category: data.category !== undefined ? data.category : task.category,
            due_date: data.due_date !== undefined ? data.due_date : targetOccDate,
            due_time: data.due_time !== undefined ? data.due_time : task.due_time,
            priority: data.priority !== undefined ? data.priority : task.priority,
            recurrence_type: 'none',
            reminder_at: data.reminder_at !== undefined ? data.reminder_at : task.reminder_at,
            subtasks: data.subtasks !== undefined ? data.subtasks : task.subtasks
          });
          db.save();
          return detached;
        }

        task.title = title;
        if (data.description !== undefined) task.description = (data.description || '').trim();
        if (data.category !== undefined) task.category = (data.category || '').trim();
        if (data.due_date !== undefined) task.due_date = data.due_date ? data.due_date.trim() : null;
        if (data.due_time !== undefined) task.due_time = data.due_time ? data.due_time.trim() : null;
        if (data.priority !== undefined) task.priority = data.priority || 'none';
        if (data.reminder_at !== undefined) {
          task.reminder_at = data.reminder_at ? data.reminder_at.trim() : null;
          task.reminder_dismissed = false;
        }
        if (data.subtasks !== undefined && Array.isArray(data.subtasks)) {
          task.subtasks = data.subtasks.map(s => ({ ...s }));
        }

        if (data.recurrence_type !== undefined) {
          const recType = data.recurrence_type || 'none';
          if (recType === 'none') {
            task.recurrence = { type: 'none' };
          } else {
            if (!task.due_date) task.due_date = getLocalDateStr();
            task.recurrence = {
              type: recType,
              interval: Math.max(1, parseInt(data.recurrence_interval, 10) || 1),
              monthly_rule: data.monthly_rule || 'day_of_month',
              day_of_month: parseOptionalNumber(data.day_of_month) || parseInt(task.due_date.slice(8, 10), 10) || 1,
              start_date: data.recurrence_start_date || task.due_date,
              end_date: data.recurrence_end_date || null
            };
          }
        }

        task.updated_at = new Date().toISOString();
        db.save();
        return task;
      },

      async toggleTaskCompletion(id, markComplete, occurrenceDate = null) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const task = db.state.tasks.find(t => t.id === id && t.user_id === u.id);
        if (!task) throw new Error('Task not found');

        const nowIso = new Date().toISOString();
        const isRecurring = task.recurrence && task.recurrence.type && task.recurrence.type !== 'none';

        if (markComplete) {
          if (isRecurring && task.status === 'active') {
            const completedDueDate = occurrenceDate || task.due_date || getLocalDateStr();

            const completedRecord = {
              id: db.state.nextIds.task++,
              user_id: u.id,
              title: task.title,
              description: task.description || '',
              category: task.category || '',
              due_date: completedDueDate,
              due_time: task.due_time || null,
              priority: task.priority || 'none',
              status: 'completed',
              completed_at: nowIso,
              recurrence: { type: 'none' },
              recurrence_origin_label: this.formatRecurrenceLabel(task.recurrence, completedDueDate),
              series_id: task.id,
              skipped_dates: [],
              reminder_at: null,
              reminder_dismissed: true,
              subtasks: Array.isArray(task.subtasks) ? task.subtasks.map(s => ({ ...s, done: true })) : [],
              created_at: task.created_at,
              updated_at: nowIso
            };
            db.state.tasks.unshift(completedRecord);

            if (occurrenceDate && occurrenceDate > task.due_date) {
              if (!Array.isArray(task.skipped_dates)) task.skipped_dates = [];
              if (!task.skipped_dates.includes(occurrenceDate)) task.skipped_dates.push(occurrenceDate);
            } else {
              let nextDue = this.computeNextOccurrenceDate(completedDueDate, task.recurrence);
              const skippedSet = new Set(Array.isArray(task.skipped_dates) ? task.skipped_dates : []);
              while (nextDue && skippedSet.has(nextDue)) {
                nextDue = this.computeNextOccurrenceDate(nextDue, task.recurrence);
              }
              if (nextDue && (!task.recurrence.end_date || nextDue <= task.recurrence.end_date)) {
                task.due_date = nextDue;
                if (Array.isArray(task.subtasks)) {
                  task.subtasks = task.subtasks.map(s => ({ ...s, done: false }));
                }
              } else {
                task.status = 'completed';
                task.completed_at = nowIso;
              }
            }
            task.updated_at = nowIso;
            db.save();
            return { task, completedRecord, advancedTo: task.due_date };
          } else {
            task.status = 'completed';
            task.completed_at = nowIso;
            task.updated_at = nowIso;
            db.save();
            return { task, advancedTo: null };
          }
        } else {
          task.status = 'active';
          task.completed_at = null;
          task.updated_at = nowIso;
          db.save();
          return { task, advancedTo: null };
        }
      },

      async toggleTaskSubtask(taskId, subtaskIdx) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const task = db.state.tasks.find(t => t.id === taskId && t.user_id === u.id);
        if (!task || !Array.isArray(task.subtasks) || !task.subtasks[subtaskIdx]) return;
        task.subtasks[subtaskIdx].done = !task.subtasks[subtaskIdx].done;
        task.updated_at = new Date().toISOString();
        db.save();
        return task;
      },

      async deleteTask(id, deleteScope = 'series', occurrenceDate = null) {
        const u = db.getAuthenticatedUser();
        if (!u) throw new Error('Unauthorized');
        const task = db.state.tasks.find(t => t.id === id && t.user_id === u.id);
        if (!task) return;

        const isRecurring = task.recurrence && task.recurrence.type && task.recurrence.type !== 'none';
        if (isRecurring && deleteScope === 'occurrence') {
          const targetDate = occurrenceDate || task.due_date;
          if (targetDate === task.due_date) {
            const nextDue = this.computeNextOccurrenceDate(task.due_date, task.recurrence);
            if (nextDue && (!task.recurrence.end_date || nextDue <= task.recurrence.end_date)) {
              task.due_date = nextDue;
            } else {
              db.state.tasks = db.state.tasks.filter(t => !(t.id === id && t.user_id === u.id));
            }
          } else if (targetDate) {
            if (!Array.isArray(task.skipped_dates)) task.skipped_dates = [];
            if (!task.skipped_dates.includes(targetDate)) task.skipped_dates.push(targetDate);
          }
          task.updated_at = new Date().toISOString();
          db.save();
          return;
        }

        db.state.tasks = db.state.tasks.filter(t => !(t.id === id && t.user_id === u.id));
        db.save();
      },

      async skipOrDeleteTaskOccurrence(id, occurrenceDate = null) {
        return this.deleteTask(id, 'occurrence', occurrenceDate);
      },

      async deleteTaskSeries(id) {
        return this.deleteTask(id, 'series', null);
      },

      async dismissTaskReminder(id, snoozeMinutes = null) {
        const u = db.getAuthenticatedUser();
        if (!u) return;
        const task = db.state.tasks.find(t => t.id === id && t.user_id === u.id);
        if (!task) return;
        if (snoozeMinutes && Number(snoozeMinutes) > 0) {
          const next = new Date(Date.now() + Number(snoozeMinutes) * 60000);
          const pad = n => String(n).padStart(2, '0');
          task.reminder_at = `${next.getFullYear()}-${pad(next.getMonth() + 1)}-${pad(next.getDate())}T${pad(next.getHours())}:${pad(next.getMinutes())}`;
          task.reminder_dismissed = false;
        } else {
          task.reminder_dismissed = true;
        }
        db.save();
      }
    };

    // =========================================================================
    // UI UTILITIES, MODALS & PERSISTENT NAVIGATION HELPERS
    // =========================================================================
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = type === 'error' ? 'error show' : 'show';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (root) root.innerHTML = '';
    }

    // Automatically inject an upper-right 'X' close button into any active pop-up dialog
    (function setupModalCloseButtonObserver() {
      const root = document.getElementById('modal-root');
      if (!root) return;
      const observer = new MutationObserver(() => {
        const dialogs = root.querySelectorAll('.modal-dialog');
        dialogs.forEach(dialog => {
          if (dialog.closest('#celebration-overlay')) return;
          if (!dialog.querySelector('.modal-close-x')) {
            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'modal-close-x';
            closeBtn.setAttribute('aria-label', 'Close pop-up');
            closeBtn.innerHTML = '&times;';
            closeBtn.onclick = (e) => {
              e.stopPropagation();
              closeModal();
            };
            dialog.appendChild(closeBtn);
          }
        });
      });
      observer.observe(root, { childList: true, subtree: true });
    })();

    function showConfirmModal(message, onConfirm, confirmLabel = 'Delete') {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" onclick="event.stopPropagation()">
            <h3 class="card-title" id="confirm-modal-title" style="margin-top:0;">Confirm Action</h3>
            <p style="color:var(--text-muted); margin-bottom:1.5rem;">${message}</p>
            <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
              <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>

    function startSubtleLoading() {
      clearTimeout(topLoaderTimer);
      topLoaderTimer = setTimeout(() => {
        const bar = document.getElementById('top-loading-bar');
        if (bar) {
          bar.classList.remove('completing');
          bar.classList.add('active');
        }
      }, 120);
    }

    function finishSubtleLoading() {
      clearTimeout(topLoaderTimer);
      const bar = document.getElementById('top-loading-bar');
      if (bar && bar.classList.contains('active')) {
        bar.classList.remove('active');
        bar.classList.add('completing');
        setTimeout(() => bar.classList.remove('completing'), 200);
      }
    }

    async function withButtonLoading(btnEl, asyncFn, loadingLabel = null) {
      if (!btnEl) {
        await asyncFn();
        return;
      }
      if (btnEl.classList.contains('is-loading')) return;
      const originalHtml = btnEl.innerHTML;
      btnEl.classList.add('is-loading');
      btnEl.disabled = true;
      btnEl.setAttribute('aria-busy', 'true');
      btnEl.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span><span>${loadingLabel || originalHtml}</span>`;
      startSubtleLoading();
      try {
        await asyncFn();
      } finally {
        finishSubtleLoading();
        if (btnEl && btnEl.isConnected) {
          btnEl.classList.remove('is-loading');
          btnEl.disabled = false;
          btnEl.removeAttribute('aria-busy');
          btnEl.innerHTML = originalHtml;
        }
      }
    }

    function loadPersistedUIState() {
      try {
        const raw = sessionStorage.getItem(UI_STATE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.dashboardSelectedDate) window.dashboardSelectedDate = parsed.dashboardSelectedDate;
          if (parsed.weeklyChartMetric) window.weeklyChartMetric = parsed.weeklyChartMetric;
          if (parsed.consistencyYear !== undefined) window.consistencyYear = parsed.consistencyYear;
          if (parsed.consistencyHalf !== undefined) window.consistencyHalf = parsed.consistencyHalf;
          if (parsed.tasksSubView) window.tasksSubView = parsed.tasksSubView;
          if (parsed.tasksSelectedDate) window.tasksSelectedDate = parsed.tasksSelectedDate;
          if (parsed.currentPath && validRoutes.includes(parsed.currentPath)) {
            return parsed.currentPath;
          }
        }
      } catch (e) {}
      return null;
    }

    function savePersistedUIState() {
      try {
        sessionStorage.setItem(UI_STATE_KEY, JSON.stringify({

          dashboardSelectedDate: window.dashboardSelectedDate || getLocalDateStr(),
          weeklyChartMetric: window.weeklyChartMetric || 'workouts',

          tasksSubView: window.tasksSubView || 'today',
          tasksSelectedDate: window.tasksSelectedDate || getLocalDateStr()
        }));

    }

    function resolveInitialRoute() {
      const hashRoute = window.location.hash ? window.location.hash.replace(/^#/, '') : '';
      if (validRoutes.includes(hashRoute)) return hashRoute;
      const pathRoute = window.location.pathname;
      if (validRoutes.includes(pathRoute)) return pathRoute;
      return loadPersistedUIState() || '/dashboard';
    }

    let currentPath = resolveInitialRoute();
    loadPersistedUIState();

    window.addEventListener('popstate', () => {
      const nextRoute = resolveInitialRoute();
      const isRouteChange = nextRoute !== currentPath;
      currentPath = nextRoute;
      savePersistedUIState();
      renderApp({ isRouteChange, preserveScroll: true });
    });

    window.addEventListener('hashchange', () => {
      const hashRoute = window.location.hash ? window.location.hash.replace(/^#/, '') : '';
      if (validRoutes.includes(hashRoute) && hashRoute !== currentPath) {

    async function renderWorkouts() {
      const todayStr = getLocalDateStr();
      const selectedDate = window.dashboardSelectedDate || todayStr;
      const isViewingToday = selectedDate === todayStr;
      const allWorkouts = await api.getWorkouts();
      const workouts = allWorkouts.filter(w => w.date === selectedDate);
      return `
        <div class="page-header animate-fade-in">
          <div><h1 class="page-title">Workouts</h1><p class="page-subtitle">Log your completed training sessions and track progressive overload.</p></div>
          <div style="display:flex; align-items:center; gap:0.55rem; flex-wrap:wrap;">
            ${!isViewingToday ? `<button class="section-link" onclick="window.selectDashboardDate('${todayStr}')">Reset to Today</button>` : ''}
            <input type="date" aria-label="Select Workout History Date" value="${selectedDate}" onchange="window.selectDashboardDate(this.value)" style="width:auto; padding:0.4rem 0.75rem; font-size:0.8rem; border-radius:9px;" title="Select Date" />
          </div>
        </div>
        <div class="card animate-fade-in" style="animation-delay:0.1s;">
          <form id="workout-form">
            <div class="form-group">
              <div class="form-label-wrap"><label for="w-name">Exercise / Workout Name <span class="label-required">*</span></label></div>
              <input type="text" id="w-name" required />
            </div>
            <div class="form-row">
              <div class="form-group"><div class="form-label-wrap"><label for="w-sets">Sets</label><span class="label-optional">(Optional)</span></div><input type="number" id="w-sets" min="1"/></div>
              <div class="form-group"><div class="form-label-wrap"><label for="w-reps">Reps</label><span class="label-optional">(Optional)</span></div><input type="number" id="w-reps" min="1"/></div>
              <div class="form-group"><div class="form-label-wrap"><label for="w-weight">Weight (lbs)</label><span class="label-optional">(Optional)</span></div><input type="number" id="w-weight" min="0" step="0.5"/></div>
              <div class="form-group"><div class="form-label-wrap"><label for="w-steps">Steps</label><span class="label-optional">(Optional)</span></div><input type="number" id="w-steps" min="1" step="1"/></div>
              <div class="form-group"><div class="form-label-wrap"><label for="w-duration">Duration (min)</label><span class="label-optional">(Optional)</span></div><input type="number" id="w-duration" min="1"/></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Save Completed Workout</button>
          </form>
        </div>
        <div class="card animate-fade-in" style="animation-delay:0.2s;">
          <div class="card-title">
            <span>Completed Workout History (${isViewingToday ? 'Today' : selectedDate})</span>
            <span style="font-size:0.78rem; font-weight:600; color:var(--text-muted);">${workouts.length} completed</span>
          </div>
          ${workouts.length ? workouts.map(w => {
            const details = [
              w.sets !== null && Number(w.sets) > 0 ? `${w.sets} sets` : null,
              w.reps !== null && Number(w.reps) > 0 ? `${w.reps} reps` : null,
              w.weight !== null && Number(w.weight) > 0 ? `@ ${w.weight} lbs` : null,
              w.steps !== null && w.steps !== undefined && Number(w.steps) > 0 ? `${Number(w.steps).toLocaleString()} steps` : null,
              w.duration_minutes !== null ? `${w.duration_minutes} min` : null
            ].filter(Boolean).join(' • ') || 'Completed session';
            return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem 0; border-bottom:1px solid var(--border-color); flex-wrap:wrap; gap:0.75rem;">
              <div>
                <div style="display:flex; align-items:center; gap:0.6rem;">
                  <span style="font-weight:700; font-size:1rem;">${escapeHtml(w.name)}</span>
                  <span class="badge badge-completed">${w.date}</span>
                </div>
                <div style="font-size:0.84rem; color:var(--text-muted); margin-top:4px;">${details}</div>
              </div>
              <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-secondary btn-sm" onclick="window.openEditWorkoutModal(${w.id})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="window.handleDeleteWorkout(${w.id})">Remove</button>
              </div>
            </div>`;
          }).join('') : `<p style="color:var(--text-dim)">No completed workouts for ${isViewingToday ? 'today' : selectedDate}.</p>`}
        </div>
      `;
    }

    const routeFormDrafts = {};
    const routeDirtyState = {};

    function captureCurrentRouteFormDraft(route) {
      const mainEl = document.getElementById('main-content');
      if (!mainEl) return;
      const inputs = mainEl.querySelectorAll('input:not([type="date"]):not([type="checkbox"]):not([type="radio"]), textarea');
      const draft = {};
      let hasUserTypedInput = false;

      inputs.forEach(inp => {
        if (!inp.id) return;
        const val = inp.value || '';
        draft[inp.id] = val;
        if (inp.id === 'm-servings') {
          if (val !== '' && val !== '1') hasUserTypedInput = true;
        } else if (val.trim() !== '') {
          hasUserTypedInput = true;
        }
      });

      routeFormDrafts[route] = draft;
      routeDirtyState[route] = hasUserTypedInput;
    }

    function restoreCurrentRouteFormDraft(route) {
      if (!routeDirtyState[route] || !routeFormDrafts[route]) return;
      const draft = routeFormDrafts[route];
      Object.keys(draft).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = draft[id];
      });
    }

    function clearRouteFormDraft(route) {
      delete routeFormDrafts[route];
      routeDirtyState[route] = false;
      routeScrollPositions[route] = 0;
    }

    function scrollMobileHeatmapToActiveMonth() {
      if (window.innerWidth > 768) return;
      const row = document.getElementById('hm-months-row');
      if (!row) return;
      const refDate = parseLocalDate(window.dashboardSelectedDate || getLocalDateStr());
      const targetMonthIdx = refDate.getMonth();
      const monthEl = row.querySelector(`.hm-month-block[data-month-idx="${targetMonthIdx}"]`);
      if (monthEl) {
        row.scrollLeft = Math.max(0, monthEl.offsetLeft - row.offsetLeft);
      }
    }

    window.navigate = function(path, options = {}) {
      const targetPath = validRoutes.includes(path) ? path : '/dashboard';
      const isRouteChange = targetPath !== currentPath;

      captureCurrentRouteFormDraft(currentPath);
      routeScrollPositions[currentPath] = window.scrollY || 0;
      currentPath = targetPath;

      if (options.mobileTab) {
        window.mobileActiveTab = options.mobileTab;
      } else if (targetPath === '/dashboard') {
        window.mobileActiveTab = 'home';
      } else if (targetPath === '/nutrition') {
        window.mobileActiveTab = 'food';
      } else if (targetPath === '/workouts' || targetPath === '/routines') {
        window.mobileActiveTab = 'workouts';
      } else if (targetPath === '/calendar') {
        window.mobileActiveTab = 'notifications';
      }

      if (typeof window.closeMobileQuickActions === 'function') {
        window.closeMobileQuickActions();
      }

      savePersistedUIState();

      if (!options.skipHistory) {
        try {
          window.history.pushState({ path: currentPath }, '', '#' + currentPath);
        } catch (e) {
          window.location.hash = '#' + currentPath;
        }
      }

      const shouldPreserveScroll = isRouteChange ? !!routeDirtyState[targetPath] : true;
      renderApp({ isRouteChange, preserveScroll: shouldPreserveScroll });
    };

    window.openRoutineEditorModal = async (id = null, autoAdd = false) => {
      const routines = await api.getRoutines();
      let r = id ? routines.find(x => x.id === id) : null;
      if (!r) {
        r = { id: null, name: '', estimated_duration: '', exercises: [] };
      }
      
      window._editingRoutine = {
        id: r.id,
        name: r.name,
        estimated_duration: r.estimated_duration || '',
        exercises: r.exercises ? r.exercises.map(ex => ({...ex})) : []
      };
      
      if (autoAdd) {
        window._editingRoutine.exercises.push({ name: '', sets: 3, reps: 10, weight: 0, steps: null });
      }

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()" style="max-width:620px;">
            <h3 class="card-title" style="font-size:1.35rem; margin-bottom:1.25rem;">${id ? 'Edit Routine' : 'Create Routine'}</h3>
            <form id="routine-editor-form">
              <div class="form-row">
                <div class="form-group" style="flex:2;">
                  <label for="re-name">Routine Name <span class="label-required">*</span></label>
                  <input type="text" id="re-name" value="${escapeHtml(window._editingRoutine.name)}" required />
                </div>
                <div class="form-group" style="flex:1;">
                  <label for="re-est-duration">Est. Duration (min)</label>
                  <input type="number" id="re-est-duration" value="${window._editingRoutine.estimated_duration}" min="1" />
                </div>
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; margin-top:0.5rem; padding-bottom:0.5rem; border-bottom:1px solid var(--border-color);">
                  <label style="margin:0; font-size:0.9rem; color:var(--text-white);">Exercises</label>
                  <button type="button" class="section-link" onclick="window.reAddExercise()">+ Add Exercise</button>
              </div>

              <div id="re-exercises-container" style="display:flex; flex-direction:column; gap:0.6rem; max-height:45vh; overflow-y:auto; padding-right:0.5rem; margin-bottom:1.5rem;">
              </div>

              <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
                <button type="button" class="btn btn-secondary" onclick="${id ? `window.openRoutineDetailModal(${id})` : 'closeModal()'}">Cancel</button>
                <button type="submit" class="btn btn-primary" id="re-save-btn">Save Routine</button>
              </div>
            </form>
          </div>
        </div>
      `;
      
      window.renderReExercises();

      document.getElementById('routine-editor-form').onsubmit = async (e) => {
        e.preventDefault();
        window.syncReExercisesFromDOM();
        const btn = document.getElementById('re-save-btn');
        await withButtonLoading(btn, async () => {
          const data = {
            name: document.getElementById('re-name').value,
            estimated_duration: document.getElementById('re-est-duration').value,
            exercises: window._editingRoutine.exercises.filter(ex => ex.name.trim() !== '')
          };
          try {
            if (window._editingRoutine.id) {
              await api.updateRoutine(window._editingRoutine.id, data);
              showToast('Routine updated successfully!');
            } else {
              await api.createRoutine(data);
              showToast('Routine created successfully!');
            }
            closeModal();
            renderApp({ isRouteChange: false, preserveScroll: true });
          } catch (err) {
            showToast(err.message, 'error');
          }
        }, 'Saving...');
      };
    };

    window.syncReExercisesFromDOM = () => {
      if (!window._editingRoutine) return;
      window._editingRoutine.exercises.forEach((ex, idx) => {
        const nameEl = document.getElementById(`re-ex-name-${idx}`);
        const setsEl = document.getElementById(`re-ex-sets-${idx}`);
        const repsEl = document.getElementById(`re-ex-reps-${idx}`);
        const weightEl = document.getElementById(`re-ex-weight-${idx}`);
        const stepsEl = document.getElementById(`re-ex-steps-${idx}`);
        if (nameEl) ex.name = nameEl.value;
        if (setsEl) ex.sets = parseInt(setsEl.value) || 0;
        if (repsEl) ex.reps = parseInt(repsEl.value) || 0;
        if (weightEl) ex.weight = parseFloat(weightEl.value) || 0;
        if (stepsEl) ex.steps = parseInt(stepsEl.value) || null;
      });
    };

    window.renderReExercises = () => {
      const container = document.getElementById('re-exercises-container');
      if (!container || !window._editingRoutine) return;
      const exercises = window._editingRoutine.exercises;
      
      if (exercises.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:2rem 1.5rem; background:rgba(255,255,255,0.015); border-radius:12px; border:1px dashed var(--border-color);">
            <div style="color:var(--text-white); font-weight:700; margin-bottom:0.4rem;">No exercises added yet</div>
            <p style="color:var(--text-dim); font-size:0.85rem; margin-bottom:1rem;">Build your routine by adding exercises below.</p>
            <button type="button" class="btn btn-secondary btn-sm" onclick="window.reAddExercise()">+ Add Exercise</button>
          </div>
        `;
        return;
      }

      container.innerHTML = exercises.map((ex, idx) => `
        <div style="background:var(--bg-input); border:1px solid var(--border-color); border-radius:14px; padding:0.85rem 1rem; display:flex; flex-direction:column; gap:0.65rem; transition:var(--transition);">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:0.75rem; font-weight:800; color:var(--text-muted); letter-spacing:0.04em;">EXERCISE ${idx + 1}</div>
            <div style="display:flex; gap:0.25rem;">
              <button type="button" class="task-icon-btn" title="Move Up" style="padding:0.2rem 0.45rem;" onclick="window.reMoveExercise(${idx}, -1)" ${idx === 0 ? 'disabled style="opacity:0.25;cursor:not-allowed;"' : ''}>▲</button>
              <button type="button" class="task-icon-btn" title="Move Down" style="padding:0.2rem 0.45rem;" onclick="window.reMoveExercise(${idx}, 1)" ${idx === exercises.length - 1 ? 'disabled style="opacity:0.25;cursor:not-allowed;"' : ''}>▼</button>
              <button type="button" class="task-icon-btn" title="Remove Exercise" style="padding:0.2rem 0.45rem; color:var(--color-danger); border-color:rgba(239,68,68,0.25); background:rgba(239,68,68,0.08);" onclick="window.reRemoveExercise(${idx})">&times;</button>
            </div>
          </div>
          <div class="form-row" style="gap:0.6rem;">
            <div class="form-group" style="flex:2; margin-bottom:0; min-width:140px;">
              <label for="re-ex-name-${idx}" style="font-size:0.75rem;">Name</label>
              <input type="text" id="re-ex-name-${idx}" value="${escapeHtml(ex.name)}" style="padding:0.5rem 0.75rem; font-size:0.88rem;" required />
            </div>
            <div class="form-group" style="flex:1; min-width:56px; margin-bottom:0;">
              <label for="re-ex-sets-${idx}" style="font-size:0.75rem;">Sets</label>
              <input type="number" id="re-ex-sets-${idx}" value="${ex.sets || ''}" style="padding:0.5rem 0.75rem; font-size:0.88rem;" min="0" />
            </div>
            <div class="form-group" style="flex:1; min-width:56px; margin-bottom:0;">
              <label for="re-ex-reps-${idx}" style="font-size:0.75rem;">Reps</label>
              <input type="number" id="re-ex-reps-${idx}" value="${ex.reps || ''}" style="padding:0.5rem 0.75rem; font-size:0.88rem;" min="0" />
            </div>
            <div class="form-group" style="flex:1; min-width:65px; margin-bottom:0;">
              <label for="re-ex-weight-${idx}" style="font-size:0.75rem;">Weight</label>
              <input type="number" id="re-ex-weight-${idx}" value="${ex.weight || ''}" style="padding:0.5rem 0.75rem; font-size:0.88rem;" min="0" step="0.5" />
            </div>
            <div class="form-group" style="flex:1.15; min-width:75px; margin-bottom:0;">
              <label for="re-ex-steps-${idx}" style="font-size:0.75rem;">Steps</label>
              <input type="number" id="re-ex-steps-${idx}" value="${ex.steps || ''}" style="padding:0.5rem 0.75rem; font-size:0.88rem;" min="0" step="1" />
            </div>
          </div>
        </div>
      `).join('');
    };

    window.reAddExercise = () => {
      window.syncReExercisesFromDOM();
      window._editingRoutine.exercises.push({ name: '', sets: 3, reps: 10, weight: 0, steps: null });
      window.renderReExercises();
      const container = document.getElementById('re-exercises-container');
      if (container) setTimeout(() => container.scrollTop = container.scrollHeight, 50);
    };

    window.reRemoveExercise = (idx) => {
      window.syncReExercisesFromDOM();
      window._editingRoutine.exercises.splice(idx, 1);
      window.renderReExercises();
    };

    window.reMoveExercise = (idx, dir) => {
      if (idx + dir < 0 || idx + dir >= window._editingRoutine.exercises.length) return;
      window.syncReExercisesFromDOM();
      const arr = window._editingRoutine.exercises;
      const temp = arr[idx];
      arr[idx] = arr[idx + dir];
      arr[idx + dir] = temp;
      window.renderReExercises();
    };

    window.openRoutineDetailModal = async (id) => {
      const routines = await api.getRoutines();
      const r = routines.find(x => x.id === id);
      if (!r) return;
      const totalSets = (r.exercises || []).reduce((acc, ex) => acc + (Number(ex.sets) || 0), 0);
      const totalSteps = (r.exercises || []).reduce((acc, ex) => acc + (Number(ex.steps) || 0), 0);
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()" style="max-width:580px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:0.75rem; padding-right:2.2rem;">
              <div>
                <h3 class="card-title" style="margin:0; font-size:1.4rem; font-family:var(--font-display);">${escapeHtml(r.name)}</h3>
                <div style="font-size:0.84rem; color:var(--text-muted); margin-top:0.25rem;">
                  ${r.exercises ? r.exercises.length : 0} exercises${totalSets > 0 ? ` &bull; ${totalSets} planned sets` : ''}${totalSteps > 0 ? ` &bull; ${totalSteps.toLocaleString()} steps` : ''}${r.estimated_duration ? ` &bull; ~${r.estimated_duration} min` : ''}
                </div>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" onclick="window.openRoutineEditorModal(${r.id})">Edit Routine</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:0.55rem; max-height:48vh; overflow-y:auto; margin:1rem 0;">
              ${r.exercises && r.exercises.length ? r.exercises.map((ex, i) => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:0.8rem 1rem; background:var(--bg-input); border:1px solid var(--border-color); border-radius:12px;">
                  <div>
                    <div style="font-weight:700; color:var(--text-white); font-size:0.94rem;">${i + 1}. ${escapeHtml(ex.name)}</div>
                    <div style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;">${formatExerciseSummary(ex)}</div>
                  </div>
                </div>
              `).join('') : '<p style="color:var(--text-dim); font-size:0.88rem;">No exercises in this routine yet.</p>'}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; gap:0.65rem; flex-wrap:wrap; margin-top:1.15rem; padding-top:1rem; border-top:1px solid var(--border-color);">
              <button type="button" class="btn btn-secondary btn-sm" onclick="window.openRoutineEditorModal(${r.id}, true)">+ Add Exercise</button>
              <div style="display:flex; gap:0.55rem;">
                <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal()">Close</button>
